<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NovaTech Portal">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>NovaTech &middot; Order Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">
<script>
  (function(){
    try{
      var t = localStorage.getItem('ntTheme') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<style>

  :root{
    color-scheme:light;
    /* Notion Sans is proprietary; Inter is the fallback the spec names, and
       the spec defines no mono token, so figures ride the UI face with tnum. */
    --font-ui:'Inter',-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-num:var(--font-ui);
    --ink:#1a1a1a; --charcoal:#37352f; --ink-deep:#000000; --on-ink:#ffffff; --muted:#5d5b54; --faint:#787671;
    --stone:#a4a097; --disabled:#bbb8b1;
    --bg:#f6f5f4; --paper:#ffffff; --soft:#fafaf9;
    --line:#e5e3df; --line-strong:#c8c4be;
    --accent:#5645d4; --accent-fg:#5645d4; --accent-hover:#4534b3;
    --accent-soft:#e6e0f5; --accent-line:#d6b6f6; --accent-ink:#ffffff;
    --link:#0075de; --link-hover:#005bab;
    /* hue drives the dot and any fill; the pastel tint sits behind and the
       label uses the family's deep variant so it clears 4.5:1 */
    --ok:#1aae39;   --ok-ink:#37352f;   --ok-bg:#d9f3e1;   --ok-line:#b6e5c4;
    --warn:#dd5b00; --warn-ink:#793400; --warn-bg:#ffe8d4; --warn-line:#f7cba8;
    --bad:#e03131;  --bad-ink:#a02e6d;  --bad-bg:#fde0ec;  --bad-line:#f6c0d8;
    --info:#5645d4; --info-ink:#391c57; --info-bg:#e6e0f5; --info-line:#d6b6f6;
    --e1:rgba(15,15,15,.04) 0 1px 2px 0;
    --e2:rgba(15,15,15,.08) 0 4px 12px 0;
    --e3:rgba(15,15,15,.20) 0 24px 48px -8px;
    --e4:rgba(15,15,15,.16) 0 16px 48px -8px;
    --scrim:rgba(10,21,48,.5);
    --ring:0 0 0 2px var(--accent);
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s4b:20px;
    --s5:24px; --s6:32px; --s6b:40px; --s7:48px; --s8:64px;
    --r-xs:4px; --r-tag:6px; --r-sm:8px; --r-md:12px;
    --r-lg:16px; --r-xl:20px; --r-pill:9999px;
    --t:170ms cubic-bezier(.2,.6,.2,1);
    --t-slow:220ms cubic-bezier(.2,.6,.2,1);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    /* derived from the spec's own navy band colours — no new hues introduced */
    --ink:#e8ecf2; --charcoal:#e8ecf2; --muted:#9aa5b4; --faint:#6c7787;
    --stone:#9aa5b4; --disabled:#5b6673;
    --bg:#0e1116; --paper:#161b22; --soft:#1c222b;
    --line:#252c36;
    --line-strong:#374250;
    --ink-deep:#ffffff; --on-ink:#0e1116;
    --accent:#5645d4; --accent-fg:#d6b6f6; --accent-hover:#7b3ff2;
    --accent-soft:color-mix(in srgb, #5645d4 26%, #161b22);
    --accent-line:color-mix(in srgb, #7b3ff2 44%, #161b22);
    --accent-ink:#ffffff;
    --link:#dcecfa; --link-hover:#ffffff;
    --ok:#1aae39;   --ok-ink:#d9f3e1;
    --ok-bg:color-mix(in srgb, #1aae39 20%, #161b22);
    --ok-line:color-mix(in srgb, #1aae39 38%, #161b22);
    --warn:#dd5b00; --warn-ink:#ffe8d4;
    --warn-bg:color-mix(in srgb, #dd5b00 22%, #161b22);
    --warn-line:color-mix(in srgb, #dd5b00 40%, #161b22);
    --bad:#e03131;  --bad-ink:#fde0ec;
    --bad-bg:color-mix(in srgb, #e03131 22%, #161b22);
    --bad-line:color-mix(in srgb, #e03131 40%, #161b22);
    --info:#5645d4; --info-ink:#e6e0f5;
    --info-bg:color-mix(in srgb, #5645d4 26%, #161b22);
    --info-line:color-mix(in srgb, #7b3ff2 44%, #161b22);
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.4);
    --e3:0 2px 6px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.55);
    --e4:rgba(0,0,0,.5) 0 16px 48px -8px;
    --scrim:rgba(4,6,9,.66);
    --ring:0 0 0 2px var(--accent-hover);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:14px; line-height:1.50;
    font-feature-settings:normal;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background var(--t-slow), color var(--t-slow);
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--accent-fg); text-decoration:none; }
  a:hover{ color:var(--accent-hover); }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:none; box-shadow:var(--ring); border-radius:var(--r-sm);
  }
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  h1,h2,h3,h4{ font-weight:600; letter-spacing:-0.5px; }
  h3,h4{ letter-spacing:0; }
  b, strong{ font-weight:600; }
  ::placeholder{ color:var(--stone); opacity:1; }
  input[type="checkbox"], input[type="radio"]{ accent-color:var(--accent); }
  .muted{ color:var(--muted); font-size:12.5px; }
  .subtle{ font-size:11.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); margin-left:var(--s2); }

  /* ---------- top bar ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:var(--s5);
    /* brand and actions land on the same columns as the page content below */
    padding:var(--s3) max(var(--s5), calc((100% - 1280px) / 2)); background:var(--paper);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; flex-wrap:nowrap;
    box-shadow:var(--e1);
  }
  header.top::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:var(--line); pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:var(--s4); min-width:0; }
  .brand img{ height:30px; width:auto; flex:0 0 auto; }
  .brand img.is-dark{ display:none; }
  :root[data-theme="dark"] .brand img.is-light{ display:none; }
  :root[data-theme="dark"] .brand img.is-dark{ display:block; }
  /* a hairline keeps the wordmark from touching the page label */
  .brand > div{ position:relative; padding-left:var(--s4); min-width:0; }
  .brand > div::before{
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:1px; height:28px;
    background:var(--line-strong);
  }
  .brand b{ font-size:15px; letter-spacing:0; display:block; line-height:1.3; }
  .brand span{ display:block; color:var(--faint); font-size:12px; line-height:1.3; }

  .pmenu{ display:flex; align-items:center; gap:var(--s1); margin:0 auto 0 var(--s3); }
  .pmenu a{
    position:relative; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted);
    text-decoration:none; padding:8px 16px; line-height:1.3; border-radius:var(--r-pill) !important; white-space:nowrap; cursor:pointer;
  }
  .pmenu a:hover{ background:var(--soft); color:var(--ink); }
  .pmenu a.on{ background:var(--ink); color:var(--paper); }
  .pbadge{
    display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
    border-radius:var(--r-pill); background:var(--warn); color:#fff; font-size:11px; font-weight:700; line-height:1;
  }
  .who{ display:flex; align-items:center; gap:var(--s4); flex-wrap:nowrap; min-width:0; }
  .who-em{ font-size:12.5px; color:var(--muted); }
  /* identity on one side of the rule, actions on the other */
  .who #themeBtn{ position:relative; margin-left:var(--s3); }
  .who #themeBtn::before{
    content:""; position:absolute; left:calc(var(--s3) * -1 - 1px); top:50%; transform:translateY(-50%);
    width:1px; height:24px;
    background:var(--line-strong);
  }

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    border-radius:var(--r-sm); padding:8px 12px; min-height:34px; font:inherit; font-size:14px; font-weight:500;
    /* an explicit line-height — the inherited 1.55 makes a 13px label 20px tall
       and pushes the button past its min-height */
    line-height:1.2;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; transition:border-color var(--t), background var(--t), transform var(--t), box-shadow var(--t);
  }
  .btn:hover{ border-color:var(--muted); box-shadow:var(--e1); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); padding:10px 18px; min-height:40px; }
  .btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); box-shadow:none; }
  .btn.sm{ padding:4px 12px; min-height:28px; font-size:12.5px; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; min-height:32px; padding:0; border:1px solid var(--line-strong);
    background:var(--paper); color:var(--muted); border-radius:var(--r-pill); cursor:pointer;
    transition:color var(--t), border-color var(--t), background var(--t), box-shadow var(--t);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--muted); box-shadow:none; }
  .icon-btn svg{ width:17px; height:17px; }
  :root[data-theme="light"] .i-sun{ display:none; }
  :root:not([data-theme="light"]) .i-moon{ display:none; }

  /* ---------- layout ---------- */
  .wrap{ max-width:1280px; margin:0 auto; padding:var(--s7) var(--s6) var(--s8); }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s5); margin-bottom:var(--s5); box-shadow:none;
  }
  h1{ font-size:24px; letter-spacing:0; margin:0 0 var(--s2); line-height:1.2; }
  h2{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--faint); margin:0 0 var(--s4b); }
  .page-head{ margin-bottom:var(--s5); }
  /* the status chip is a sibling of the number, not punctuation after it */
  .inv-h1{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; row-gap:var(--s2); }

  /* ---------- login ---------- */
  .login{ max-width:400px; margin:11vh auto; padding:0 var(--s4); animation:rise var(--t-slow) both; }
  .field{ margin-bottom:var(--s3); }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:var(--s1); }
  .field input, .pickbox, .searchbox{
    width:100%; height:44px; padding:0 var(--s4); font:inherit; font-size:14px;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper); color:var(--ink);
    transition:border-color var(--t), box-shadow var(--t);
  }
  .field input:focus, .pickbox:focus, .searchbox:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .err{ color:var(--bad); font-size:12.5px; min-height:1.2em; margin-top:var(--s2); font-weight:600; }

  /* ---------- order rows ---------- */
  .toolbar{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .searchbox{ flex:1 1 260px; height:44px; font-size:14px; }
  .orow{
    display:grid; grid-template-columns:minmax(0,1fr) auto 210px 28px; gap:var(--s5);
    align-items:center; padding:var(--s4); border:1px solid var(--line);
    border-radius:var(--r-md); background:var(--paper); margin-bottom:var(--s3);
    cursor:pointer; box-shadow:var(--e1);
    transition:border-color var(--t), box-shadow var(--t), transform var(--t);
    animation:rise var(--t-slow) both;
  }
  .orow:hover{ border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); box-shadow:var(--e2); transform:translateY(-1px); }
  .orow:hover .chev{ transform:translateX(3px); color:var(--accent-fg); }
  .orow:focus-visible{ outline:none; box-shadow:var(--ring); }
  .inv{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; font-weight:600; font-size:15px; }
  /* its own cell, so the row's align-items:center does the vertical centring */
  .ostat{ display:flex; align-items:center; justify-content:center; min-width:0; margin-right:var(--s4); }
  .ostat .chip{ flex:0 0 auto; }
  .inv-lbl{ font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .chev{ color:var(--faint); display:flex; justify-content:flex-end; transition:transform var(--t), color var(--t); }
  .chev svg{ width:18px; height:18px; }

  .chip{
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
    font-size:11.5px; font-weight:600; letter-spacing:.02em;
    padding:4px 10px; border-radius:var(--r-pill); border:1px solid transparent;
  }
  .chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.n{ color:var(--muted);  background:var(--soft);      border-color:var(--line); }
  .chip.i{ color:var(--info-ink);   background:var(--info-bg);   border-color:var(--info-line); --dot:var(--info); }
  .chip.w{ color:var(--warn-ink);   background:var(--warn-bg);   border-color:var(--warn-line); --dot:var(--warn); }
  .chip.k{ color:var(--ok-ink);     background:var(--ok-bg);     border-color:var(--ok-line); --dot:var(--ok); }
  .chip.b{ color:var(--bad-ink);    background:var(--bad-bg);    border-color:var(--bad-line); --dot:var(--bad); }

  .bar{ height:7px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; display:flex; border:1px solid var(--line); }
  .bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .bar i.s{ background:var(--ok); } .bar i.a{ background:var(--accent); } .bar i.b{ background:var(--line-strong); }
  .barlbl{ font-family:var(--font-num); font-size:11.5px; color:var(--muted); margin-top:8px; font-variant-numeric:tabular-nums; }

  /* ---------- detail ---------- */
  .back{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .sum{ display:grid; grid-template-columns:repeat(5,1fr); gap:var(--s3); margin-bottom:var(--s5); }
  .sumc{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s4); box-shadow:none; animation:rise var(--t-slow) both;
  }
  .sumv{ font-family:var(--font-num); font-size:26px; font-weight:600; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .suml{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-top:var(--s1); line-height:1.3; text-wrap:balance; }
  .sumc.ok .sumv{ color:var(--ok); }
  .sumc.rem .sumv{ color:var(--warn); }
  .sumc.prep .sumv{ color:var(--info); }

  /* skinny progress rail above the tiles */
  .oprog{ margin-bottom:var(--s4); }
  .oprog-bar{
    display:flex; height:8px; overflow:hidden; background:var(--soft);
    border:1px solid var(--line); border-radius:var(--r-pill);
  }
  .oprog-bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .oprog-l{
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
    margin-top:var(--s2); font-size:12px; color:var(--muted);
  }
  .oprog-l b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- pipeline summary ---------- */
  .pipev{ font-size:28px; font-weight:600; line-height:1.25; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; }
  .pipes{ font-size:13px; color:var(--muted); }
  .pipebar{
    display:flex; height:12px; margin-top:var(--s4); overflow:hidden;
    background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill);
  }
  .pipebar i{ display:block; height:100%; transition:width var(--t-slow); }
  .pipeleg{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--s2) var(--s6); margin-top:var(--s4); }
  .pipeit{ display:flex; align-items:center; gap:var(--s2); font-size:13px; min-width:0; }
  .pipedot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .pipel{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pipen{ margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }
  @media (max-width:640px){ .pipeleg{ grid-template-columns:1fr; gap:var(--s2); } .pipev{ font-size:24px; } }

  /* ---------- RMAs ---------- */
  .rhead{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s4); }
  .rhead h1{ margin:0; }
  .rhsub{ display:flex; flex-wrap:wrap; align-items:center; gap:4px var(--s4); line-height:1.6; margin:var(--s3) 0 var(--s4); }
  .rhsub > span{ display:inline-flex; align-items:center; gap:var(--s3); min-width:0; }
  .rhsub > span + span::before{ content:"\00b7"; color:var(--faint); }
  /* the number leads; status chips sit at the far right of the row */
  .inv-h1 > .chip{ margin-left:auto; }
  .inv-h1 > .chip + .chip{ margin-left:0; }

  /* ---------- PO number: the one field the customer owns ---------- */
  .pometa{ display:flex; align-items:center; flex-wrap:wrap; gap:var(--s2) var(--s3); margin:calc(-1 * var(--s2)) 0 var(--s5); font-size:13px; color:var(--muted); }
  .pometa .po-k{ font-weight:600; }
  .pometa .po-v{ color:var(--ink); font-weight:600; }
  .pometa .po-none{ color:var(--faint); }
  .pometa .po-due::before{ content:"\00b7"; color:var(--faint); margin-right:var(--s3); }
  .poform{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .poform input{
    height:32px; padding:0 var(--s3); font:inherit; font-size:13px; width:200px; max-width:100%;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper); color:var(--ink);
  }
  .poform input:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  @media (max-width:640px){
    .poform input{ height:40px; font-size:16px; width:100%; }
    .poform{ width:100%; }
    .poform .btn{ flex:1; }
  }
  .rhead .btn, .rlook + * .btn, #rnLook, #rmaRetGo{ white-space:nowrap; }
  .rrow{
    display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto 110px; gap:var(--s4); align-items:center;
    padding:var(--s4) var(--s4b); border:1px solid var(--line); border-radius:var(--r-md); background:var(--paper);
    margin-bottom:var(--s2); cursor:pointer; transition:border-color var(--t); animation:rise var(--t-slow) both;
  }
  .rrow:hover{ border-color:var(--line-strong); }
  .rrow .rno{ font-weight:600; font-variant-numeric:tabular-nums; }
  .rrow .rsub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .rrow .rissue{ font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rdate{ font-size:12px; color:var(--faint); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rtiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--s3); margin-bottom:var(--s4); }
  .rtile{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s4); }
  .rtile b{ display:block; font-size:24px; font-weight:600; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .rtile span{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--faint); }
  .rtile.hot b{ color:var(--warn-ink); }
  /* ---- the two RMA charts, matching the ones Novatech sees ---- */

  .rgrid{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:var(--s4); align-items:start; }

  .batch{ border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:var(--s3); overflow:hidden; background:var(--paper); }

  .carrier{
    display:inline-flex; align-items:center; flex:0 0 auto;

  .storenum{

  /* ---------- tables ---------- */

    .pmenu a.on{ background:var(--paper); color:var(--ink); box-shadow:var(--e1); }
    #staffPick{ padding:5px var(--s4); gap:var(--s2); }
    #staffPick .pickbox{ flex:1 1 auto; width:auto; max-width:none; height:28px; min-height:28px; font-size:12px; }
    .orow{ grid-template-columns:minmax(0,1fr) auto; gap:var(--s2) var(--s3); }
    .orow > .ostat{ align-self:start; justify-content:flex-end; }
    .orow > div:nth-child(3){ grid-column:1 / -1; }
    .orow .chev{ display:none; }
    .orow .barlbl{ font-size:12.5px; }
    .sum{ grid-template-columns:repeat(2,1fr); }
    .sumc:last-child{ grid-column:1 / -1; }
    .sumv{ font-size:22px; }
    .bhead{ grid-template-columns:1fr; }
    /* the two batch actions share the full width of the card footer */
    .bhead > div:last-child{ justify-self:stretch; }
    .bacts{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .bacts .btn{ width:100%; }
    .back .btn{ min-height:36px; }
    .btn{ min-height:36px; }
    .btn.sm{ min-height:30px; }
    .icon-btn{ width:32px; height:32px; min-height:32px; }
    h1{ font-size:21px; }
    /* top-biased, not dead-centre: the browser's own bottom bar makes a
       mathematically centred card read low on a phone */
    .login{ margin:0 auto; padding:7vh var(--s3) 48px; min-height:100dvh; display:flex; flex-direction:column; justify-content:flex-start; }
    .login .card{ padding:var(--s5) var(--s4); }
    .field input, .searchbox{ height:44px; min-height:44px; font-size:16px; max-width:100%; }
    .pickbox{ height:44px; min-height:44px; font-size:16px; }
    .toolbar{ flex-direction:column; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .toolbar .btn{ width:100%; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .modal-bg{ align-items:flex-end; padding:0; }
    .modal{
      max-width:none; border-bottom-left-radius:0; border-bottom-right-radius:0;
      max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    .modal-f{ position:sticky; bottom:0; background:var(--paper);
      padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom)); }
    .modal-f .btn{ flex:1; }
    .toast-stack{ bottom:calc(var(--s4) + env(safe-area-inset-bottom)); width:calc(100% - 24px); }
    .twrap{ -webkit-overflow-scrolling:touch; }
    table{ font-size:13px; }
  }
  @media (max-width:420px){
    .sum{ grid-template-columns:1fr 1fr; }
  }
  @media print{
    header.top, .toolbar, .back, .btn, .icon-btn, .toast-stack{ display:none !important; }
    body{ background:#fff; }
    .card, .batch, .sumc{ box-shadow:none; border-color:#ccc; break-inside:avoid; }
    .bbody{ display:block !important; background:#fff; }
    .orow{ animation:none; }
  }

  /* ============================================================
     Notion geometry. Controls are 8px rectangles; {rounded.full}
     is reserved for status badges and pill tabs, per the spec.
     ============================================================ */
  .btn, input:not([type="checkbox"]):not([type="radio"]), select, textarea, .rlook, .rnext{
    border-radius:var(--r-sm) !important;
  }
  .chip, .carrier, .storenum, .bar, .pipebar, .staffbadge, .btn.sm{ border-radius:var(--r-pill) !important; }
  .icon-btn{ border-radius:50% !important; }
</style>
</head>
<body>

<header class="top" id="topbar" style="display:none;">
  <div class="brand">
    <img class="is-light" src="logo.png" alt="" onerror="this.style.display='none'">

    <div><b>Order Portal</b><span id="custName"></span></div>
  </div>
  <nav class="pmenu" id="pmenu" aria-label="Sections">
    <a data-pview="orders" class="on" role="button" tabindex="0">Orders</a>
    <a data-pview="rmas" role="button" tabindex="0">RMAs<span class="pbadge" id="pmenuBadge" style="display:none;"></span></a>
  </nav>
  <div class="who">

      <svg viewBox="0 0 24 24" class="i-moon"><path fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" d="M12 22C17.5228 22 22 17.5228 22 12C22 11.5373 21.3065 11.4608 21.0672 11.8568C19.9289 13.7406 17.8615 15 15.5 15C11.9101 15 9 12.0899 9 8.5C9 6.13845 10.2594 4.07105 12.1432 2.93276C12.5392 2.69347 12.4627 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"/></svg>
      <svg viewBox="0 0 24 24" class="i-sun"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 2V4"/><path stroke-linecap="round" d="M12 20V22"/><path stroke-linecap="round" d="M4 12L2 12"/><path stroke-linecap="round" d="M22 12L20 12"/><path stroke-linecap="round" d="M19.7778 4.22266L17.5558 6.25424"/><path stroke-linecap="round" d="M4.22217 4.22266L6.44418 6.25424"/><path stroke-linecap="round" d="M6.44434 17.5557L4.22211 19.7779"/><path stroke-linecap="round" d="M19.7778 19.7773L17.5558 17.5551"/></g></svg>
    </button>
    <button class="btn sm" id="signOut" type="button">Sign out</button>

</header>

<div id="staffPick" style="display:none;"></div>

<div id="loginView" class="login">
  <div class="card">
    <h1>Order Portal</h1>
    <p class="muted" style="margin-top:0;">Sign in to see your orders, shipments and serial numbers.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="go" type="button" style="width:100%; height:40px;">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
  <p class="muted" style="text-align:center;">
    <button type="button" class="icon-btn" id="themeBtn2" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" class="i-moon"><path fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" d="M12 22C17.5228 22 22 17.5228 22 12C22 11.5373 21.3065 11.4608 21.0672 11.8568C19.9289 13.7406 17.8615 15 15.5 15C11.9101 15 9 12.0899 9 8.5C9 6.13845 10.2594 4.07105 12.1432 2.93276C12.5392 2.69347 12.4627 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"/></svg>
      <svg viewBox="0 0 24 24" class="i-sun"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 2V4"/><path stroke-linecap="round" d="M12 20V22"/><path stroke-linecap="round" d="M4 12L2 12"/><path stroke-linecap="round" d="M22 12L20 12"/><path stroke-linecap="round" d="M19.7778 4.22266L17.5558 6.25424"/><path stroke-linecap="round" d="M4.22217 4.22266L6.44418 6.25424"/><path stroke-linecap="round" d="M6.44434 17.5557L4.22211 19.7779"/><path stroke-linecap="round" d="M19.7778 19.7773L17.5558 17.5551"/></g></svg>
    </button>
  </p>
</div>

<div class="wrap" id="app" style="display:none;">
  <div id="listView"></div>
  <div id="detailView" style="display:none;"></div>
</div>

<div class="pop" id="pop"></div>
<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://vajrnbniwkvnkkkigeit.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_mF1sD8UO4CHuyCgPTLZsXQ_CilDLz3y';
  const SB = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true } })
    : null;

  const $ = function(id){ return document.getElementById(id); };
  function esc(v){ return (v==null?'':String(v)).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(n){ return (n==null||n==='') ? '\u2014' : Number(n).toLocaleString(); }
  function fmtDate(v){
    if (!v) return '';
    const d = new Date(String(v).length <= 10 ? v + 'T12:00:00' : v);
    return isNaN(d) ? String(v) : d.toLocaleDateString();
  }

  /* ---------- theme ---------- */
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    try { localStorage.setItem('ntTheme', t); } catch(e){}
    const metas = document.querySelectorAll('meta[name="theme-color"]');
    metas.forEach(function(m){
      if (!m.getAttribute('media')) m.setAttribute('content', t === 'dark' ? '#0e1116' : '#ffffff');
    });
    const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (bar) bar.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
  }
  function toggleTheme(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }
  ['themeBtn','themeBtn2'].forEach(function(id){
    const b = $(id); if (b) b.addEventListener('click', toggleTheme);
  });

  /* ---------- toast ---------- */
  function toast(msg, kind, ms){
    const stack = $('toastStack'); if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity 200ms, transform 200ms';
      el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
      setTimeout(function(){ el.remove(); }, 220);
    }, ms || 4000);
  }

  /* ---------- modal ---------- */
  let modalBg = null;
  function closeModal(){ if (modalBg){ modalBg.remove(); modalBg = null; } }
  function openModal(html){
    closeModal();
    modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.id = 'modalBg';
    modalBg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    let downOnBg = false;
    /* A selection drag that starts in the modal and ends on the backdrop
       still lands its click there. Closing on that wiped the form, which is
       why it looked tied to copy and paste. Press and release must both be
       on the backdrop. */
    modalBg.addEventListener('mousedown', function(e){ downOnBg = (e.target === modalBg); });
    modalBg.addEventListener('click', function(e){
      if (e.target === modalBg && downOnBg) closeModal();
      downOnBg = false;
    });
    document.body.appendChild(modalBg);
    const first = modalBg.querySelector('input, button');
    if (first) first.focus();
    return modalBg;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

  /* ---------- shareable links: read once at startup, no listeners ---------- */
  function baseUrl(){ return location.origin + location.pathname; }
  function linkFor(orderId){ return baseUrl() + '?order=' + encodeURIComponent(orderId); }
  function setUrl(orderId){
    try { history.replaceState(null, '', orderId ? linkFor(orderId) : baseUrl()); } catch(e){}
  }
  function setRmaUrl(id){
    try { history.replaceState(null, '', id ? baseUrl() + '?rma=' + encodeURIComponent(id) : baseUrl()); } catch(e){}
  }
  function readRmaLink(){
    const v = new URLSearchParams(location.search || '').get('rma');
    return (v && /^[0-9a-fA-F-]{36}$/.test(v)) ? v : null;
  }
  function readLink(){
    const v = new URLSearchParams(location.search || '').get('order');
    return (v && /^[0-9a-fA-F-]{36}$/.test(v)) ? v : null;
  }
  async function copyLink(text){
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly','');
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      toast('Link copied', 'ok');
    } catch(e){
      openModal('<div class="modal-h"><h3>Copy this link</h3></div>' +
        '<div class="modal-b"><input id="cpBox" type="text" class="searchbox mono" readonly value="' + esc(text) + '"></div>' +
        '<div class="modal-f"><button class="btn primary" id="cpDone" type="button">Done</button></div>');
      const b = document.getElementById('cpBox'); if (b){ b.focus(); b.select(); }
      const dn = document.getElementById('cpDone'); if (dn) dn.addEventListener('click', closeModal);
    }
  }

  let session = null, me = null, customer = null;
  let isStaff = false, allCustomers = [], viewAs = null;
  let orders = [], lines = [], configs = [], batches = [], tracking = [], units = [], locations = [];
  let currentId = null, query = '';
  let pview = 'orders';
  let rmaTickets = [], rmaParts = [], rmaShipments = [], rmaComments = [], rmaAttachments = [], rmaEvents = [], rmaContacts = [];
  let rmaCurrent = null, rmaReturnAddress = '';

  /* ---------- auth ---------- */
  async function init(){
    if (!SB){ $('loginErr').textContent = 'Could not load the sign-in library. Check your connection and refresh.'; return; }
    const { data } = await SB.auth.getSession();
    session = data.session;
    let authUid = session && session.user ? session.user.id : null;
    /* Token refreshes and refocus both fire here. Re-rendering on them sent
       the customer back to the order list mid-task. */
    SB.auth.onAuthStateChange(function(_e, s){
      const uid = s && s.user ? s.user.id : null;
      session = s;
      if (uid === authUid) return;
      authUid = uid; render();
    });
    render();
  }
  async function render(){
    if (!session){
      $('loginView').style.display = '';
      $('app').style.display = 'none';
      $('topbar').style.display = 'none';
      return;
    }
    $('loginView').style.display = 'none';
    $('whoEmail').textContent = session.user.email || '';
    const cu = await SB.from('customer_users').select('*').eq('user_id', session.user.id).limit(1);
    me = (cu.data || [])[0];

    if (!me || !me.active){
      /* Not a customer login. NovaTech staff can still open this page to see
         exactly what a customer sees, so check the roster before refusing. */
      const st = await SB.from('staff')
        .select('name,active,can_view_orders,can_manage_orders,can_admin_orders,is_admin')
        .eq('user_id', session.user.id).limit(1);
      const r = (st.data || [])[0];
      const staffOk = r && r.active &&
        (r.can_view_orders || r.can_manage_orders || r.can_admin_orders || r.is_admin);
      if (staffOk){
        isStaff = true;
        const cs = await SB.from('customers').select('*').eq('active', true).order('name');
        allCustomers = cs.data || [];
        if (!allCustomers.length){
          $('app').style.display = ''; $('topbar').style.display = '';
          $('listView').innerHTML = '<div class="card"><h1>No customers yet</h1>' +
            '<p class="muted">Add one in the dashboard\u2019s Admin page first.</p></div>';
          return;
        }
        if (!viewAs){
          /* the dashboard links here with ?as=<customer> so the ticket or order it points at is in view */
          const asP = new URLSearchParams(location.search || '').get('as');
          const hit = asP ? allCustomers.find(function(c){ return String(c.id) === asP; }) : null;
          viewAs = hit ? hit.id : allCustomers[0].id;
        }
        me = { customer_id: viewAs };
        $('app').style.display = ''; $('topbar').style.display = '';
        await load();
        return;
      }
      $('app').style.display = '';
      $('topbar').style.display = '';
      $('custName').textContent = '';
      $('listView').innerHTML = '<div class="card"><h1>Not set up yet</h1>' +
        '<p class="muted">This login is not linked to a customer account. Ask your NovaTech contact to enable it.</p></div>';
      $('detailView').style.display = 'none';
      return;
    }
    $('app').style.display = '';
    $('topbar').style.display = '';
    await load();
  }
  $('go').addEventListener('click', signIn);
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') signIn(); });
  $('em').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('pw').focus(); });
  async function signIn(){
    const err = $('loginErr'); err.textContent = '';
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Signing in\u2026';
    const r = await SB.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (r.error) err.textContent = r.error.message || 'Could not sign in.';
  }
  $('signOut').addEventListener('click', function(){ SB.auth.signOut(); });

  /* ---------- data ---------- */
  async function load(){
    $('listView').innerHTML =
      '<div class="page-head"><h1>Your orders</h1></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:32%"></div>' +
        '<div class="skel skel-line" style="width:64%"></div></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:28%"></div>' +
        '<div class="skel skel-line" style="width:55%"></div></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:36%"></div>' +
        '<div class="skel skel-line" style="width:48%"></div></div>';
    const [c, o, cf, lo] = await Promise.all([
      SB.from('customers').select('*').eq('id', me.customer_id).limit(1),
      SB.from('orders').select('*').eq('customer_id', me.customer_id).eq('archived', false).order('created_at', { ascending:false }),
      SB.from('configs').select('*').eq('customer_id', me.customer_id),
      SB.from('ship_to_locations').select('*').eq('customer_id', me.customer_id)
    ]);
    customer = (c.data || [])[0];
    orders = o.data || [];
    configs = cf.data || [];
    locations = lo.data || [];
    $('custName').textContent = customer ? customer.name : '';
    const pick = $('staffPick');
    if (isStaff && pick){
      pick.style.display = '';
      pick.innerHTML = '<span class="staffbadge">Staff preview</span> ' +
        '<select id="viewAs" class="pickbox">' + allCustomers.map(function(c){
          return '<option value="' + esc(c.id) + '"' + (c.id === viewAs ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }).join('') + '</select>';
      $('viewAs').addEventListener('change', async function(){
        viewAs = this.value;
        me = { customer_id: viewAs };
        currentId = null; query = ''; setUrl(null);
        $('detailView').style.display = 'none';
        await load();
      });
    }
    const ids = orders.map(function(x){ return x.id; });
    if (ids.length){
      const [ln, ba, un] = await Promise.all([
        SB.from('order_lines').select('*').in('order_id', ids).order('position'),
        SB.from('batches').select('*').in('order_id', ids).order('batch_no'),
        SB.from('pc_log').select('id,serial,order_id,batch_id,config_id,unit_status').in('order_id', ids).order('serial')
      ]);
      lines = ln.data || []; batches = ba.data || []; units = un.data || [];
      const bids = batches.map(function(b){ return b.id; });
      if (bids.length){
        const tr = await SB.from('batch_tracking').select('*').in('batch_id', bids);
        tracking = tr.data || [];
      } else tracking = [];
    } else { lines = []; batches = []; units = []; tracking = []; }
    await loadRma();
    const wantR = readRmaLink();
    if (wantR){ pview = 'rmas'; }
    renderList();
    const want = readLink();
    if (want && orders.some(function(o){ return o.id === want; })) openOrder(want);
    else if (want) toast('That order is not on your account.', 'bad', 6000);
    if (wantR){
      if (rmaTickets.some(function(t){ return t.id === wantR; })) openRma(wantR);
      else toast('That RMA is not on your account.', 'bad', 6000);
    }
  }
  async function loadRma(){
    try {
      const cid = me.customer_id;
      const r = await Promise.all([
        SB.from('rma_tickets').select('*').eq('customer_id', cid).order('created_at', { ascending:false }),
        SB.from('customer_contacts').select('*').eq('customer_id', cid),
        SB.from('app_settings').select('*').eq('key', 'rma_return_address')
      ]);
      rmaTickets = r[0].data || []; rmaContacts = r[1].data || [];
      const ra = (r[2].data || [])[0]; rmaReturnAddress = ra ? (ra.value || '') : '';
      const ids = rmaTickets.map(function(t){ return t.id; });
      if (ids.length){
        const s = await Promise.all([
          SB.from('rma_parts').select('*').in('rma_id', ids).order('created_at'),
          SB.from('rma_shipments').select('*').in('rma_id', ids).order('created_at'),
          SB.from('rma_comments').select('*').in('rma_id', ids).eq('internal', false).order('created_at'),
          SB.from('rma_attachments').select('*').in('rma_id', ids).order('created_at'),
          SB.from('rma_events').select('*').in('rma_id', ids).order('created_at')
        ]);
        rmaParts = s[0].data || []; rmaShipments = s[1].data || []; rmaComments = s[2].data || [];
        rmaAttachments = s[3].data || []; rmaEvents = s[4].data || [];
      } else { rmaParts = []; rmaShipments = []; rmaComments = []; rmaAttachments = []; rmaEvents = []; }
    } catch(e){ rmaTickets = []; }
  }

  /* ---------- helpers ---------- */
  function cfgById(id){ return configs.find(function(c){ return c.id === id; }); }
  function specLines(cfg){
    if (!cfg) return [];
    const sticks = cfg.ram_sticks || 1;
    const ramBase = String(cfg.ram || '').replace(/^ram\s+/i, '').trim();
    const caseN = String(cfg.pc_case || '').replace(/\s*\bcases?\b\s*/ig, ' ').replace(/\s+/g, ' ').trim();
    return [['Case', caseN], ['CPU', (cfg.cpu||'').trim()], ['GPU', (cfg.gpu||'').trim()],
            ['RAM', ramBase ? ((sticks > 1 ? sticks + 'x ' : '') + ramBase) : ''],
            ['Storage', (cfg.storage||'').trim()]]
      .filter(function(p){ return p[1]; });
  }
  function stats(o){
    const mine = units.filter(function(u){ return u.order_id === o.id; });
    const ordered = lines.filter(function(l){ return l.order_id === o.id; })
      .reduce(function(a,l){ return a + (+l.qty_ordered||0); }, 0);
    let b=0,a=0,s=0;
    mine.forEach(function(u){
      if (u.unit_status === 'shipped') s++; else if (u.unit_status === 'assigned') a++; else b++;
    });
    return { ordered:ordered, built:b, assigned:a, shipped:s, made:b+a+s, remaining:Math.max(0, ordered-(b+a+s)) };
  }
  function statusOf(st){
    if (st.made === 0) return { c:'n', l:'Not started' };
    if (st.shipped > 0 && st.ordered > 0 && st.shipped >= st.ordered) return { c:'k', l:'Complete' };
    if (st.shipped > 0) return { c:'i', l:'Partially shipped' };
    if (st.remaining === 0) return { c:'w', l:'Awaiting shipment' };
    return { c:'n', l:'In production' };
  }
  function trackUrl(carrier, n){
    const e = encodeURIComponent(String(n||'').trim());
    if (!e) return '';
    switch (String(carrier||'').trim().toLowerCase()){
      case 'ups':   return 'https://www.ups.com/track?loc=en_US&requester=QUIC&tracknum=' + e;
      case 'fedex': return 'https://www.fedex.com/fedextrack/?trknbr=' + e;
      case 'usps':  return 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + e;
      default: return '';
    }
  }
  /* Carrier mark. Looks for a real logo at carriers/<slug>.png and falls back to
     the typographic badge when the file is absent — so Freight and Other, which
     have no logo, keep reading as text. */
  function carrierBadge(carrier){
    const c = String(carrier || '').trim();
    if (!c) return '';
    const k = c.toLowerCase();
    const slug = k.replace(/[^a-z0-9]+/g, '');
    const short = k === 'fedex' ? 'FDX' : k === 'freight' ? 'FRT' : k === 'other' ? 'SHIP' : c.toUpperCase();
    return '<span class="carrier" title="' + esc(c) + '">' +
      '<img src="carriers/' + esc(slug) + '.png" alt="' + esc(c) + '"' +
        ' onload="this.closest(\'.carrier\').classList.add(\'has-logo\')"' +
        ' onerror="this.remove()">' +
      '<i>' + esc(short) + '</i></span>';
  }
  /* A master number covers the whole batch; a unit number is that box alone.
     The distinction matters when a customer rings the carrier, so it is marked
     — quietly, because most of the time it is the same story either way. */
  function trkTag(isMaster){
    return isMaster
      ? '<span class="trk-tag" title="One number for the whole shipment">master</span>'
      : '';
  }
  function trackHtml(carrier, nums){
    const list = (Array.isArray(nums) ? nums : [nums]).filter(Boolean);
    if (!list.length) return '<span class="muted">\u2014</span>';
    return list.map(function(n){
      const u = trackUrl(carrier, n);
      return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(n) + '</a>' : esc(n);
    }).join(', ');
  }
  /* the destination lives on ship_to_locations, not on the batch */
  function locOf(b){ return b && b.location_id ? locations.find(function(l){ return l.id === b.location_id; }) : null; }
  function locName(b){
    const l = locOf(b);
    return l ? l.store_name : 'Destination to be confirmed';
  }
  function locNum(b){ const l = locOf(b); return (l && l.store_number) ? l.store_number : ''; }
  function locLine(b){
    const l = locOf(b);
    if (!l) return '';
    return [l.address1, l.address2, [l.city, l.state].filter(Boolean).join(', '), l.zip].filter(Boolean).join(' \u00b7 ');
  }

  /* ---------- list ---------- */
  /* Everything still in flight, summed across open orders. Complete orders
     drop out, so the total answers "what is left on my account". Stage order
     runs least to most advanced, matching the detail page's stat cards. */
  function pipeHtml(){
    let toBuild = 0, built = 0, prep = 0, shipped = 0, open = 0;
    orders.forEach(function(o){
      const st = stats(o);
      if (st.ordered > 0 && st.shipped >= st.ordered) return;
      open++;
      toBuild += st.remaining; built += st.built; prep += st.assigned; shipped += st.shipped;
    });
    const total = toBuild + built + prep + shipped;
    if (!open || !total) return '';
    const segs = [
      { l:'Shipped',           n:shipped, c:'var(--ok)' },
      { l:'Preparing to ship', n:prep,    c:'var(--info)' },
      { l:'Ready to assign',   n:built,   c:'var(--accent)' },
      { l:'Remaining to build',n:toBuild, c:'var(--line-strong)' }
    ];
    return '<div class="card">' +
      '<h2>Pipeline <span class="subtle">across your open orders</span></h2>' +
      '<div class="pipev">' + num(total) + '</div>' +
      '<div class="pipes">units in ' + open + ' open order' + (open === 1 ? '' : 's') +
        (toBuild ? ' \u00b7 ' + num(toBuild) + ' left to build' : ' \u00b7 all built') + '</div>' +
      '<div class="pipebar">' + segs.map(function(s){
        return s.n ? '<i style="width:' + (s.n/total*100) + '%;background:' + s.c + '" title="' +
                     s.l + ': ' + num(s.n) + '"></i>' : '';
      }).join('') + '</div>' +
      '<div class="pipeleg">' + segs.map(function(s){
        return '<div class="pipeit"><span class="pipedot" style="background:' + s.c + '"></span>' +
               '<span class="pipel">' + s.l + '</span><span class="pipen">' + num(s.n) + '</span></div>';
      }).join('') + '</div></div>';
  }

  function syncMenu(){
    const menu = $('pmenu'); if (!menu) return;
    menu.querySelectorAll('[data-pview]').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-pview') === pview); });
    const needs = rmaTickets.filter(function(t){ return t.status === 'needs_info'; }).length;
    const b = $('pmenuBadge'); if (b){ b.textContent = String(needs); b.style.display = needs ? '' : 'none'; }
  }
  function pnavHtml(){ syncMenu(); return ''; }
  document.addEventListener('click', function(e){
    const b = e.target.closest('[data-pview]'); if (!b) return;
    e.preventDefault(); pview = b.getAttribute('data-pview'); rmaCurrent = null; currentId = null; renderList();
  });
  document.addEventListener('keydown', function(e){
    const b = e.target.closest && e.target.closest('[data-pview]'); if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); pview = b.getAttribute('data-pview'); rmaCurrent = null; currentId = null; renderList();
  });
  function renderList(){
    setUrl(null);
    $('detailView').style.display = 'none';
    $('listView').style.display = '';

    $('listView').style.display = '';
    const q = query.trim().toLowerCase();
    const rows = orders.filter(function(o){
      return !q || (o.invoice_no||'').toLowerCase().indexOf(q) >= 0 || (o.po_number||'').toLowerCase().indexOf(q) >= 0;
    });
    $('listView').innerHTML = pnavHtml() +
      '<h1>Your orders</h1>' +
      '<p class="muted" style="margin-top:0;">Progress, shipments, tracking numbers and serial numbers for everything you have ordered.</p>' +
      pipeHtml() +
      '<div class="card olist-card">' +
      '<div class="toolbar">' +
        '<input class="searchbox" id="q" type="text" placeholder="Search invoice or PO" value="' + esc(query) + '">' +
        '<button class="btn" id="lookup" type="button">Find a serial</button>' +
      '</div>' +
      (rows.length ? rows.map(function(o){
        const st = stats(o), s = statusOf(st);
        const pct = function(n){ return st.ordered ? Math.min(100, n/st.ordered*100) : 0; };
        return '<div class="orow" role="button" tabindex="0" data-id="' + esc(o.id) + '">' +
          '<div><div class="inv"><span class="inv-lbl">Invoice #</span>' +
            '<span class="mono">' + esc(o.invoice_no) + '</span></div>' +
            '<div class="sub">' + (o.po_number ? 'PO ' + esc(o.po_number) + ' &middot; ' : '') +
            (o.due_date ? 'due ' + esc(fmtDate(o.due_date)) : 'no due date') + '</div></div>' +
          '<div class="ostat"><span class="chip ' + s.c + '">' + s.l + '</span></div>' +
          '<div><div class="bar">' +
            '<i class="s" style="width:' + pct(st.shipped) + '%"></i>' +
            '<i class="a" style="width:' + pct(st.assigned) + '%"></i>' +
            '<i class="b" style="width:' + pct(st.built) + '%"></i>' +
          '</div><div class="barlbl">' + num(st.shipped) + ' of ' + num(st.ordered) + ' shipped &middot; ' + num(st.made) + ' built</div></div>' +
          '<div class="chev"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5L15 12L9 19"/></svg></div>' +
        '</div>';
      }).join('')
      : '<div class="empty">' +
        '<div class="empty-ico"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 4.00195C18.175 4.01406 19.3529 4.11051 20.1213 4.87889C21 5.75757 21 7.17179 21 10.0002V16.0002C21 18.8286 21 20.2429 20.1213 21.1215C19.2426 22.0002 17.8284 22.0002 15 22.0002H9C6.17157 22.0002 4.75736 22.0002 3.87868 21.1215C3 20.2429 3 18.8286 3 16.0002V10.0002C3 7.17179 3 5.75757 3.87868 4.87889C4.64706 4.11051 5.82497 4.01406 8 4.00195"/><path stroke-linecap="round" d="M7 14.5H15"/><path stroke-linecap="round" d="M7 18H12.5"/><path d="M8 3.5C8 2.67157 8.67157 2 9.5 2H14.5C15.3284 2 16 2.67157 16 3.5V4.5C16 5.32843 15.3284 6 14.5 6H9.5C8.67157 6 8 5.32843 8 4.5V3.5Z"/></g></svg></div>' +
        '<p>' + (orders.length ? 'No orders match that search.' : 'Nothing here yet.') + '</p>' +
        '<p class="muted">' + (orders.length ? 'Try a different invoice or PO number.' : 'Orders appear here once NovaTech creates them.') + '</p>' +
        '</div>') +
      '</div>';
    const qi = $('q');
    if (qi) qi.addEventListener('input', function(){ query = this.value; renderList(); $('q').focus(); });

  /* ---------- detail ---------- */
  function openOrder(id){

    setUrl(id);

          ['Shipped', st.shipped, 'var(--ok)'],
          ['Preparing to ship', st.assigned, 'var(--info)'],
          ['Ready to assign', st.built, 'var(--accent)'],
          ['Remaining to build', st.remaining, 'var(--line-strong)']
        ];
        const done = Math.round(st.shipped / st.ordered * 100);
        return '<div class="oprog"><div class="oprog-bar">' + segs.map(function(s){
            return s[1] ? '<i style="width:' + (s[1]/st.ordered*100) + '%;background:' + s[2] + '" title="' + s[0] + ': ' + num(s[1]) + '"></i>' : '';
          }).join('') + '</div>' +
          '<div class="oprog-l"><span><b>' + done + '%</b> shipped</span>' +
          '<span>' + (st.remaining ? '<b>' + num(st.remaining) + '</b> left to build' : 'all ' + num(st.ordered) + ' built') + '</span></div></div>';
      })() : '') +
      '<div class="sum">' +
        '<div class="sumc" title="Total quantity on this invoice"><div class="sumv">' + num(st.ordered) + '</div><div class="suml">Ordered</div></div>' +
        '<div class="sumc rem" title="Still to be built"><div class="sumv">' + num(st.remaining) + '</div><div class="suml">To build</div></div>' +
        '<div class="sumc" title="Assembled and given a serial number"><div class="sumv">' + num(st.made) + '</div><div class="suml">Built</div></div>' +
        '<div class="sumc prep" title="Packed into a batch, waiting to leave"><div class="sumv">' + num(st.assigned) + '</div><div class="suml">Preparing to ship</div></div>' +
        '<div class="sumc ok" title="Dispatched to a store"><div class="sumv">' + num(st.shipped) + '</div><div class="suml">Shipped</div></div>' +
      '</div>' +
      '<div class="card"><h2>Shipments <span class="subtle">each shipment goes to one store</span></h2>' +
      (mine.length ? mine.map(function(b){
        const bu = units.filter(function(u){ return u.batch_id === b.id; });
        const tk = tracking.filter(function(t){ return t.batch_id === b.id; });
        const per = {}; tk.forEach(function(t){ if (t.unit_id) per[t.unit_id] = t.tracking_no; });
        const wide = tk.filter(function(t){ return !t.unit_id; }).map(function(t){ return t.tracking_no; });
        const shipped = b.status === 'shipped';
        return '<div class="batch">' +
          '<div class="bhead" data-head="' + esc(b.id) + '" role="button" tabindex="0" title="Click for serials and tracking">' +
            '<div class="bno"><b>Batch ' + b.batch_no + '</b>' +
              '<span class="chip ' + (shipped?'k':'w') + '">' + (shipped?'Shipped':'Preparing') + '</span></div>' +
            '<div><b>' + esc(locName(b)) + '</b>' +
              (locNum(b) ? '<span class="storenum">Store ' + esc(locNum(b)) + '</span>' : '') +
              '<div class="sub">' + esc(locLine(b) || '') + '</div></div>' +
            '<div class="mono">' + num(bu.length) + ' units<div class="sub bship">' +
              (wide.length
                ? '<span class="trk-grp">' + carrierBadge(b.carrier) +
                  trackHtml(b.carrier, [wide[0]]) +
                  (wide.length > 1 ? '<span class="muted">+' + num(wide.length - 1) + '</span>' : '') +
                  '</span><span class="bdot">&middot;</span>'
                : carrierBadge(b.carrier)) +
              '<span>' + (b.ship_date ? esc(fmtDate(b.ship_date)) : 'not yet shipped') + '</span></div></div>' +
            '<div class="bacts">' +
              '<button class="btn" data-x="' + esc(b.id) + '" type="button">Details</button></div>' +
          '</div>' +
          '<div class="bbody" id="bb_' + esc(b.id) + '" style="display:none;">' +
            '<div class="bbar"><button class="btn sm" data-copy="' + esc(b.id) + '" type="button" title="Copy every serial in this batch, comma separated">Copy All</button></div>' +
            '<div class="twrap"><table><thead><tr><th>Serial</th><th>Model</th><th>Tracking</th></tr></thead><tbody>' +
            bu.map(function(u){
              return '<tr><td class="mono">' + esc(u.serial) + '</td>' +
                '<td><span class="cfg" data-cfg="' + esc(u.config_id) + '" tabindex="0">' + esc(cfgName[u.config_id] || '\u2014') + '</span></td>' +
                '<td class="mono">' + trackHtml(b.carrier, per[u.id] ? [per[u.id]] : wide) +
                  (per[u.id] ? '' : (wide.length ? trkTag(true) : '')) + '</td></tr>';
            }).join('') + '</tbody></table></div>' +
          '</div>' +
        '</div>';
      }).join('')
      : '<div class="empty">' +
        '<div class="empty-ico"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.56541 8.73049C9.0804 6.97492 8.8379 6.09714 9.24954 5.40562C9.66119 4.71409 10.5662 4.47889 12.3763 4.00849L14.2962 3.50955C16.1062 3.03915 17.0113 2.80394 17.7242 3.20319C18.4372 3.60244 18.6797 4.48023 19.1647 6.2358L19.6792 8.09786C20.1642 9.85343 20.4067 10.7312 19.995 11.4227C19.5834 12.1143 18.6784 12.3495 16.8683 12.8199L14.9484 13.3188C13.1384 13.7892 12.2333 14.0244 11.5203 13.6252C10.8073 13.2259 10.5648 12.3481 10.0798 10.5926L9.56541 8.73049Z"/><path stroke-linecap="round" d="M8.23 15.0602L6.08 7.27014C5.89453 6.61732 5.38563 6.12036 4.7 5.92L3 5.4502"/><circle cx="8.05" cy="18.1" r="2.9"/><path stroke-linecap="round" d="M10.9199 17.36L19.9999 15"/></g></svg></div>' +
        '<p>Nothing has shipped yet.</p><p class="muted">Shipments appear here as they leave the building.</p></div>') +
      '</div>';

    $('back').addEventListener('click', renderList);
    bindPo(o);
    $('share').addEventListener('click', function(){ copyLink(linkFor(o.id)); });
    /* The invoice PDF carries dollar figures, so it is not offered here — it
       belongs on the billing view, behind its own permission. */
    $('csv').addEventListener('click', function(){ exportCsv(o); });
    $('prt').addEventListener('click', function(){
      document.querySelectorAll('.bbody').forEach(function(x){ x.style.display = ''; });
      window.print();
    });
    /* the whole header row is the target; the buttons inside it keep their own jobs */
    function toggleBatch(id){
      const bd = $('bb_' + id); if (!bd) return;
      const open = bd.style.display !== 'none';
      bd.style.display = open ? 'none' : '';
      const btn = document.querySelector('[data-x="' + id + '"]');
      if (btn) btn.textContent = open ? 'Details' : 'Hide';
    }
    document.querySelectorAll('[data-x]').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleBatch(btn.getAttribute('data-x')); });
    });
    document.querySelectorAll('[data-head]').forEach(function(head){
      head.addEventListener('click', function(e){
        if (e.target.closest('button, a, .cfg')) return;
        toggleBatch(head.getAttribute('data-head'));
      });
      head.addEventListener('keydown', function(e){
        if (e.target !== head) return;
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleBatch(head.getAttribute('data-head')); }
      });
    });
  }
  /* ---------- PO number ---------- */
  /* The customer's own reference, so the customer keeps it current. Everything
     else on the invoice stays read-only. */
  function poMetaHtml(o){
    return '<span class="po-k">PO number</span>' +
      (o.po_number ? '<span class="po-v mono">' + esc(o.po_number) + '</span>'
                   : '<span class="po-none">not set</span>') +
      '<button class="btn sm" id="poEdit" type="button">' + (o.po_number ? 'Change' : 'Add') + '</button>' +
      (o.due_date ? '<span class="po-due">due ' + esc(fmtDate(o.due_date)) + '</span>' : '');
  }

  function bindPo(o){
    const row = $('poMeta'); if (!row) return;
    const edit = row.querySelector('#poEdit');
    if (edit) edit.addEventListener('click', function(){ poForm(o); });
  }

  function poForm(o){
    const row = $('poMeta'); if (!row) return;
    row.innerHTML = '<span class="po-k">PO number</span>' +
      '<span class="poform">' +
        '<input id="poIn" type="text" maxlength="60" autocomplete="off" spellcheck="false" ' +
          'placeholder="e.g. 4500123987" value="' + esc(o.po_number || '') + '">' +
        '<button class="btn sm primary" id="poSave" type="button">Save</button>' +
        '<button class="btn sm" id="poCancel" type="button">Cancel</button>' +
      '</span>';
    const input = $('poIn'), save = $('poSave');
    input.focus(); input.select();
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); save.click(); }
      if (e.key === 'Escape'){ e.preventDefault(); $('poCancel').click(); }
    });
    $('poCancel').addEventListener('click', function(){
      row.innerHTML = poMetaHtml(o); bindPo(o);
    });
    save.addEventListener('click', async function(){
      const val = input.value.trim();
      if (val === (o.po_number || '')){ row.innerHTML = poMetaHtml(o); bindPo(o); return; }
      save.disabled = true; save.textContent = 'Saving\u2026';
      const r = await SB.rpc('portal_set_po_number', { p_order: o.id, p_po: val || null });
      if (r.error){
        save.disabled = false; save.textContent = 'Save';
        toast('Could not save the PO number: ' + r.error.message, 'bad', 7000);
        return;
      }
      if (r.data) Object.assign(o, Array.isArray(r.data) ? r.data[0] : r.data);
      else o.po_number = val || null;
      row.innerHTML = poMetaHtml(o); bindPo(o);
      toast(val ? 'PO number saved' : 'PO number cleared', 'ok');
    });
  }

  $('listView').addEventListener('click', function(e){
    const r = e.target.closest('.orow'); if (r) openOrder(r.getAttribute('data-id'));
  });
  $('listView').addEventListener('keydown', function(e){
    const r = e.target.closest('.orow');
    if (r && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openOrder(r.getAttribute('data-id')); }
  });


  /* ---------- RMAs ---------- */
  const RMA_BUCKET = 'rma-attachments';

  window.NT_RMA_ICO = { power:'power', display:'monitor', boot:'restart', memory:'ram',

  const RMA_CATS = [
    ['power','Won\u2019t power on'], ['display','No display'], ['boot','Boot or OS'],
    ['memory','Memory (RAM)'], ['storage','Storage (M.2 / SSD)'], ['gpu','Graphics card'],
    ['motherboard','Motherboard'], ['psu','Power supply'], ['cooling','Cooling or noise'],

  ];

  function rmaNo(t){ return 'RMA-' + t.rma_no; }
  function rmaCat(k){ const c = RMA_CATS.find(function(x){ return x[0] === k; }); return c ? c[1] : (k || 'Other'); }
  function rmaChip(s){ const d = RMA_ST[s] || { l:s, c:'n' }; return '<span class="chip ' + d.c + '">' + esc(d.l) + '</span>'; }
  function rmaWhen(v){ const d = new Date(v); return isNaN(d) ? '' : d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
  function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function addDays(s, n){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
  function unitBatch(u){ return (u && u.batch_id) ? batches.find(function(b){ return b.id === u.batch_id; }) : null; }
  function myName(){
    const em = (session && session.user && session.user.email || '').toLowerCase();
    const c = rmaContacts.find(function(x){ return (x.email || '').toLowerCase() === em; });
    return c ? c.name : (session && session.user && session.user.email) || 'Technician';
  }

  /* warranty: 14 days after the unit ships, for one year */
  function rmaWarranty(u){
    const b = unitBatch(u);
    const on = (u && u.unit_status === 'shipped' && b && b.ship_date) ? b.ship_date : null;
    if (!on) return { key: u && u.unit_status === 'shipped' ? 'unknown' : 'unshipped', label: u && u.unit_status === 'shipped' ? 'Shipped, date unknown' : 'Not shipped yet', c:'n' };
    const start = addDays(on, 14);
    const e = new Date(start + 'T12:00:00'); e.setFullYear(e.getFullYear() + 1);
    const end = ymd(e), today = ymd(new Date());
    const left = Math.round((new Date(end + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000);
    if (today < start) return { key:'active', start:start, end:end, label:'Good until ' + fmtDate(end), c:'k' };
    if (left < 0)      return { key:'expired', start:start, end:end, label:'Expired ' + fmtDate(end), c:'b' };
    if (left <= 30)    return { key:'expiring', start:start, end:end, label:'Good until ' + fmtDate(end) + ' \u00b7 ' + left + 'd left', c:'w' };
    return { key:'active', start:start, end:end, label:'Good until ' + fmtDate(end), c:'k' };
  }
  function rmaWarrantyChip(w){ return '<span class="chip ' + w.c + '"' + (w.end ? ' title="Through ' + esc(fmtDate(w.end)) + '"' : '') + '>' + esc(w.label) + '</span>'; }
  function rmaHistoryHtml(u){
    const list = rmaTickets.filter(function(t){ return String(t.unit_id) === String(u.id) || (t.serial || '').toUpperCase() === (u.serial || '').toUpperCase(); });
    if (!list.length) return '<p class="muted" style="margin:8px 0 0;">No RMAs on this unit.</p>';
    return '<p class="muted" style="margin:8px 0 0;">' + list.length + ' RMA' + (list.length === 1 ? '' : 's') + ' on this unit: ' +
      list.map(function(t){ return '<a data-rmaopen="' + esc(t.id) + '" style="color:var(--link);cursor:pointer;">' + rmaNo(t) + '</a> ' + rmaChip(t.status); }).join(' \u00b7 ') + '</p>';

  document.addEventListener('click', function(e){
    const a = e.target.closest('[data-rmaopen]'); if (!a) return;
    e.preventDefault(); closeModal(); pview = 'rmas'; openRma(a.getAttribute('data-rmaopen'));
  });

  /* ---- list ---- */
  let rQuery = '', rFilter = 'open', rPage = 0;
  const R_PAGE = 25;
  const R_FILTERS = [['open','Open'],['new','Submitted'],['needs_info','Needs your reply'],['approved','Approved'],['shipped','Part shipped'],['return_received','Returned'],['closed','Closed'],['denied','Not covered'],['','All']];
  function rmaMatch(t, q){
    if (!q) return true;
    const bare = q.replace(/^rma-?/, '');
    const u = units.find(function(x){ return String(x.id) === String(t.unit_id); }), cfg = u ? cfgById(u.config_id) : null;
    return (bare && String(t.rma_no).indexOf(bare) === 0)
        || (t.serial || '').toLowerCase().indexOf(q) >= 0
        || (!!cfg && (cfg.name || '').toLowerCase().indexOf(q) >= 0)
        || (t.issue || '').toLowerCase().indexOf(q) >= 0
        || (t.part_requested || '').toLowerCase().indexOf(q) >= 0;
  }
  function rmaRows(){
    const q = rQuery.trim().toLowerCase();
    return rmaTickets.filter(function(t){
      if (rFilter === 'open' && RMA_OPEN.indexOf(t.status) < 0) return false;
      if (rFilter && rFilter !== 'open' && t.status !== rFilter) return false;
      return rmaMatch(t, q);
    });
  }
  /* ---------- the two charts the tech asked for, normalised per 100 units ----------
     Raw RMA counts only ever climb, which makes a growing account look worse the
     longer it runs. Dividing by units shipped is the number that actually says
     whether quality is holding. */
  const PCH = (function(){
    function fmtShort(d){ return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }); }
    function smooth(pts){
      const n = pts.length;
      if (n < 3) return pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('');
      const dx = [], dy = [], m = [], t = [];
      for (let i = 0; i < n-1; i++){ dx.push(pts[i+1][0]-pts[i][0]); dy.push(pts[i+1][1]-pts[i][1]); m.push(dy[i]/(dx[i]||1e-6)); }
      t[0] = m[0]; t[n-1] = m[n-2];
      for (let i = 1; i < n-1; i++){
        if (m[i-1]*m[i] <= 0) t[i] = 0;
        else { const w1 = 2*dx[i]+dx[i-1], w2 = dx[i]+2*dx[i-1]; t[i] = (w1+w2)/(w1/m[i-1]+w2/m[i]); }
      }
      let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
      for (let i = 0; i < n-1; i++){
        const h = dx[i]/3;
        d += 'C' + (pts[i][0]+h).toFixed(1) + ' ' + (pts[i][1]+t[i]*h).toFixed(1) + ' ' +
                   (pts[i+1][0]-h).toFixed(1) + ' ' + (pts[i+1][1]-t[i+1]*h).toFixed(1) + ' ' +
                   pts[i+1][0].toFixed(1) + ' ' + pts[i+1][1].toFixed(1);
      }
      return d;
    }
    function area(host, series, o){
      o = o || {};
      const W = 600, H = o.h || 150, padT = 12, padB = 6, n = series.length;
      if (!n){ host.innerHTML = ''; return; }
      const max = Math.max(o.min || 0.001, Math.max.apply(null, series.map(function(p){ return p.y; })));
      const pts = series.map(function(p, i){ return [ n === 1 ? W/2 : (i/(n-1))*W, padT + (1 - p.y/max) * (H - padT - padB) ]; });
      const line = smooth(pts), gid = 'pg' + (o.id || Math.random().toString(36).slice(2));
      host.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">' +
          '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" style="stop-color:var(--accent)" stop-opacity=".28"/>' +
            '<stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + line + 'L' + W + ' ' + H + 'L0 ' + H + 'Z" fill="url(#' + gid + ')"/>' +
          '<path d="' + line + '" fill="none" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
          '<line class="pch-x" x1="0" x2="0" y1="0" y2="' + H + '" style="stroke:var(--line-strong)" vector-effect="non-scaling-stroke" opacity="0"/>' +
          '<circle class="pch-dot" r="4" style="fill:var(--accent);stroke:var(--paper)" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0"/>' +
        '</svg><div class="rchart-tip"></div>' +
        '<div class="rchart-axis"><span>' + fmtShort(series[0].x) + '</span>' +
          (n > 2 ? '<span>' + fmtShort(series[Math.floor((n-1)/2)].x) + '</span>' : '') +
          '<span>' + fmtShort(series[n-1].x) + '</span></div>';
      const svg = host.querySelector('svg'), tip = host.querySelector('.rchart-tip');
      const xl = svg.querySelector('.pch-x'), dot = svg.querySelector('.pch-dot');
      function move(ev){
        const r = svg.getBoundingClientRect();
        const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const i = Math.max(0, Math.min(n-1, Math.round((cx - r.left)/r.width * (n-1))));
        const p = pts[i];
        xl.setAttribute('x1', p[0]); xl.setAttribute('x2', p[0]); xl.setAttribute('opacity', 1);
        dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[1]); dot.setAttribute('opacity', 1);
        tip.style.left = (p[0]/W*100) + '%'; tip.style.top = (p[1] - 10) + 'px';
        tip.innerHTML = (o.fmt ? o.fmt(series[i]) : series[i].y);
        tip.style.opacity = 1;
      }
      function leave(){ xl.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tip.style.opacity = 0; }
      svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', move, { passive:true });
      svg.addEventListener('mouseleave', leave); svg.addEventListener('touchend', leave);
    }
    return { area:area };
  })();

  function rate100(rmas, shipped){ return shipped ? (rmas / shipped * 100) : null; }
  function fmtRate(v){ return v == null ? '\u2014' : (v >= 10 ? v.toFixed(1) : v.toFixed(2)); }
  /* a shipped unit's date comes from its batch; undated ones count as already
     out there, which keeps the denominator honest rather than flattering */
  function shippedUnitDates(){
    const dated = [], undated = [];
    units.forEach(function(u){
      if (u.unit_status !== 'shipped') return;
      const b = unitBatch(u);
      if (b && b.ship_date) dated.push(new Date(String(b.ship_date) + 'T12:00:00'));
      else undated.push(u);
    });
    return { dated: dated.sort(function(a, b){ return a - b; }), base: undated.length, total: dated.length + undated.length };
  }
  function renderRmaRate(){
    const plot = $('rRatePlot'); if (!plot) return;
    const ship = shippedUnitDates();
    const live = rmaTickets.filter(function(t){ return t.status !== 'cancelled'; });
    const overall = rate100(live.length, ship.total);

    $('rRateVal').textContent = fmtRate(overall);
    $('rRateSub').textContent = overall == null
      ? 'No units shipped yet, so there is nothing to measure against.'
      : num(live.length) + ' RMA' + (live.length === 1 ? '' : 's') + ' across ' + num(ship.total) + ' units shipped';

    if (overall == null){ plot.innerHTML = ''; return; }

    /* 12 week-ends; at each one, the rate to date */
    const weeks = [], now = new Date(); now.setHours(23,59,59,999);
    const monday = new Date(now); monday.setHours(0,0,0,0);
    monday.setDate(monday.getDate() - ((monday.getDay()+6)%7));
    for (let i = 11; i >= 0; i--){
      const end = new Date(monday); end.setDate(end.getDate() - i*7 + 6); end.setHours(23,59,59,999);
      weeks.push(end > now ? now : end);
    }
    const series = weeks.map(function(end){
      const shipped = ship.base + ship.dated.filter(function(d){ return d <= end; }).length;
      const opened  = live.filter(function(t){ return new Date(t.created_at) <= end; }).length;
      const r = rate100(opened, shipped);
      return { x: end, y: r == null ? 0 : r, rmas: opened, units: shipped };
    });
    PCH.area(plot, series, { h:150, id:'rrate', min:0.5, fmt:function(p){
      return '<b>' + fmtRate(p.y) + ' per 100</b> ' + num(p.rmas) + ' of ' + num(p.units) + ' by ' +
        p.x.toLocaleDateString(undefined, { month:'short', day:'numeric' });
    } });
  }
  let rFailRange = localStorage.getItem('ntPortalFailRange') || 'all';
  function renderRmaFail(){

    $('rFailTabs').querySelectorAll('[data-pfr]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-pfr') === rFailRange); });

    let since = null;
    if (rFailRange === '30'){ since = new Date(); since.setDate(since.getDate() - 30); since.setHours(0,0,0,0); }
    else if (rFailRange === 'ytd'){ since = new Date(new Date().getFullYear(), 0, 1); }

    const ship = shippedUnitDates();
    /* the window applies to both sides of the ratio, or the rate means nothing */
    const shipped = since ? ship.base + ship.dated.filter(function(d){ return d >= since; }).length : ship.total;

    const byCat = {};
    rmaTickets.filter(function(t){ return t.status !== 'cancelled' && (!since || new Date(t.created_at) >= since); })
      .forEach(function(t){ const c = t.issue_category || 'other'; byCat[c] = (byCat[c] || 0) + 1; });
    const cats = Object.keys(byCat).sort(function(a, b){ return byCat[b] - byCat[a]; }).slice(0, 7);

    if (!cats.length || !shipped){
      el.innerHTML = '<p class="muted" style="margin:0;">' +
        (!shipped ? 'No units shipped in this period.' : (rFailRange === 'all' ? 'Nothing yet.' : 'No RMAs in this period.')) + '</p>';
      return;
    }
    const max = rate100(byCat[cats[0]], shipped);
    el.innerHTML = cats.map(function(c){
      const r = rate100(byCat[c], shipped);
      return '<div class="rfail-row" title="' + byCat[c] + ' RMA' + (byCat[c] === 1 ? '' : 's') + ' across ' + num(shipped) + ' units shipped">' +
        '<span class="nt-catline">' + ntIco(NT_RMA_ICO[c]) + '<em>' + esc(rmaCat(c)) + '</em></span>' +
        '<div class="rfail-bar"><i style="width:' + (r / max * 100) + '%"></i></div>' +
        '<b>' + fmtRate(r) + '</b></div>';
    }).join('');
  }

  function shrink(file){
    return new Promise(function(res, rej){
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', 0.86);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
  }
  async function rmaUpload(t, files, commentId){
    for (const f of files){
      let blob = f, type = f.type || 'application/octet-stream', name = f.name;
      if (/^image\/(jpeg|png|webp)$/.test(type)){ try { blob = await shrink(f); type = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; } catch(e){} }
      const safe = name.replace(/[^\w.\-]+/g, '_').slice(-80);
      const path = t.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '-' + safe;
      const up = await SB.storage.from(RMA_BUCKET).upload(path, blob, { contentType: type, upsert: false });
      if (up.error){ toast('Upload failed: ' + up.error.message, 'bad'); continue; }
      const ins = await SB.from('rma_attachments').insert({ rma_id: t.id, comment_id: commentId || null, path: path, filename: f.name, size_bytes: blob.size, content_type: type, uploaded_by: session.user.id, uploaded_by_type: 'customer' }).select().single();
      if (!ins.error && ins.data) rmaAttachments.push(ins.data);
    }
  }
