  /* ---------- fluid bottom sheet ----------
     1:1 finger tracking, rubber-banding past the top edge, momentum
     projection at release and an interruptible critically-damped spring.
     Runs only where the modal is actually laid out as a bottom sheet. */
  (function(){
    var DECEL = 0.998;              /* Apple's scroll deceleration rate */
    var RESPONSE = 0.35, ZETA = 1;  /* critically damped: no overshoot */
    var THRESHOLD = 10;             /* hysteresis before a drag commits */
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    var raf = 0;

    function project(v){ return (v / 1000) * DECEL / (1 - DECEL); }
    function rubberband(over, dim){
      var c = 0.55;
      return (over * dim * c) / (dim + c * Math.abs(over));
    }
    function paint(d){ d.sheet.style.transform = 'translate3d(0,' + d.y.toFixed(2) + 'px,0)'; }
    function clear(d){
      d.sheet.style.transform = '';
      d.sheet.style.willChange = '';
      /* touch-action goes back so the sheet scrolls again. animation does NOT:
         clearing an inline animation:none starts the entry animation over at
         frame 0 rather than resuming it, which would replay the slide-up every
         time a drag sprang back. The close path clears it instead. */
      d.sheet.style.touchAction = '';
    }

    /* Semi-implicit spring. Starts from the live on-screen value and the
       velocity the finger had, so there is no seam between drag and animation
       and no jump when a drag interrupts a settle already in flight. */
    function spring(d, target, v0, done){
      var w = 2 * Math.PI / RESPONSE, k = w * w, c = 2 * ZETA * w;
      var v = v0, last = 0;
      cancelAnimationFrame(raf);
      function step(now){
        /* same frame-timestamp skew guard as the count-up: a negative dt would
           integrate the spring backwards on its first step */
        if (!last) last = now;
        var dt = Math.min(0.032, Math.max(0, (now - last) / 1000)) || 0.016;
        last = now;
        v += (-k * (d.y - target) - c * v) * dt;
        d.y += v * dt;
        if (Math.abs(d.y - target) < 0.5 && Math.abs(v) < 40){
          d.y = target; paint(d); if (done) done(); return;
        }
        paint(d);
        raf = requestAnimationFrame(step);
      }
      raf = requestAnimationFrame(step);
    }

    function settle(d){
      var v = d.vel();
      /* land where the throw is going, not where the finger let go */
      var out = (d.y + project(v)) > d.h * 0.5 || d.y > d.h * 0.85;
      if (!out){
        if (reduce.matches){ d.y = 0; paint(d); clear(d); return; }
        spring(d, 0, v, function(){ clear(d); });
        return;
      }
      d.bg.classList.add('sheet-dragged');
      if (reduce.matches){ closeModal(); return; }
      spring(d, d.h, Math.max(v, 300), function(){ closeModal(); });
    }

    document.addEventListener('pointerdown', function(e){
      if (!e.target.closest) return;
      var sheet = e.target.closest('.modal');
      if (!sheet) return;
      var bg = sheet.closest('.modal-bg');
      if (!bg || getComputedStyle(bg).alignItems !== 'flex-end') return;
      if (e.target.closest('input, textarea, select, button, a, label')) return;
      if (sheet.scrollTop > 0) return;

      cancelAnimationFrame(raf);
      /* take over from the entry animation at whatever value it reached */
      var y0 = 0, tf = getComputedStyle(sheet).transform;
      if (tf && tf !== 'none'){ try { y0 = new DOMMatrixReadOnly(tf).m42 || 0; } catch(err){} }

      var hist = [];
      var d = {
        bg: bg, sheet: sheet, y: y0, h: sheet.offsetHeight || 1,
        vel: function(){
          if (hist.length < 2) return 0;
          var f = hist[0], l = hist[hist.length - 1], dt = (l.t - f.t) / 1000;
          return dt > 0 ? (l.y - f.y) / dt : 0;
        }
      };
      var startY = e.clientY, committed = false;
      sheet.style.willChange = 'transform';
      try { sheet.setPointerCapture(e.pointerId); } catch(err){}

      function move(ev){
        var dy = ev.clientY - startY;
        if (!committed){
          if (Math.abs(dy) < THRESHOLD) return;
          committed = true;
          /* only now take the sheet off its entry animation and off the
             browser's panning, so a plain tap leaves both untouched */
          sheet.style.animation = 'none';
          sheet.style.touchAction = 'none';
        }
        hist.push({ y: dy, t: ev.timeStamp });
        while (hist.length > 6) hist.shift();
        /* continue from where the sheet actually is, not from zero */
        var raw = y0 + dy;
        /* past the top edge it resists progressively instead of stopping dead */
        d.y = raw >= 0 ? raw : -rubberband(-raw, d.h);
        paint(d);
        if (ev.cancelable) ev.preventDefault();
      }
      function up(){
        sheet.removeEventListener('pointermove', move);
        sheet.removeEventListener('pointerup', up);
        sheet.removeEventListener('pointercancel', up);
        if (!committed){ clear(d); return; }
        settle(d);
      }
      sheet.addEventListener('pointermove', move);
      sheet.addEventListener('pointerup', up);
      sheet.addEventListener('pointercancel', up);
    });
  })();

  /* ---------- bars fill up on arrival ----------
     A progress bar is full at every moment; only the split moves. So each
     track animates as a unit: the coloured segments grow from nothing while
     the grey remainder is eaten away from its full width. Segments of one bar
     share a delay so the bar never shows a gap; the stagger is between bars.
     Armed only by navigation — a click on the nav, or back/forward. Renders
     triggered by anything else, hover and tooltips included, never arm it. A short grace window covers async follow-up renders, then it
     disarms — so re-renders inside a view (tab switches, an invoice opening,
     batch paging) never refill. */
  (function(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var SEL = '.bar i, .oprog-bar i, .pipebar i, .bmeter-f, .bagebar i, .bch-bar, .binv-m i, .rfail-bar i';
    var PROPS = ['width', 'height', 'flex-basis'];
    var FILL = 620, STEP = 45, MAXDELAY = 270, GRACE = 900;
    var armed = true, disarming = 0, observer = null, lastKey = null;
    var groups = [], pending = 0;

    /* Which view we are looking at. A change here means bars the user has not
       seen yet, so the fill re-arms; anything else is a re-render. */
    function viewKey(){
      var el = document.querySelector('[data-pview].on, .nav-item.active, #tabbar .tab-btn.active');
      var name = el ? (el.getAttribute('data-pview') || el.getAttribute('data-goto') || el.textContent.trim()) : '';
      return name + '|' + location.search;
    }
    function armFor(key){
      lastKey = key;
      armed = true;
      if (disarming){ clearTimeout(disarming); disarming = 0; }
      /* Views that switch by toggling display keep their nodes, so the
         per-node flags have to go or those bars could only ever fill once. */
      document.querySelectorAll('[data-filled]').forEach(function(el){
        delete el.dataset.filled;
      });
      /* A display switch mutates no nodes, so nothing would call scan. Look
         again after the app's own click handler has had its frame. */
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ if (armed) scan(document.body); });
      });
    }

    function read(el){
      for (var i = 0; i < PROPS.length; i++){
        var v = el.style.getPropertyValue(PROPS[i]);
        if (v) return { prop: PROPS[i], target: v };
      }
      return null;
    }
    function pct(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }

    function flush(){
      pending = 0;
      if (!groups.length) return;
      var batch = groups; groups = [];
      if (!disarming){
        disarming = setTimeout(function(){ armed = false; }, GRACE);
      }
      /* one reflow for the whole batch, so every bar starts from a committed state */
      void document.body.offsetWidth;
      batch.forEach(function(list, i){
        var delay = Math.min(i * STEP, MAXDELAY);
        list.forEach(function(q){
          q.el.style.setProperty('transition', q.prop + ' ' + FILL + 'ms cubic-bezier(.2,.6,.2,1) ' + delay + 'ms');
          q.el.style.setProperty(q.prop, q.target);
        });
      });
      /* hand the properties back to the stylesheet once the fill has landed */
      setTimeout(function(){
        batch.forEach(function(list){
          list.forEach(function(q){ q.el.style.removeProperty('transition'); });
        });
      }, FILL + MAXDELAY + 60);
    }

    function scan(root){
      if (!armed || !root || !root.querySelectorAll) return;
      var found = [];
      if (root.matches && root.matches(SEL)) found.push(root);
      root.querySelectorAll(SEL).forEach(function(el){ found.push(el); });

      var byTrack = new Map();
      found.forEach(function(el){
        if (el.dataset.filled || !el.parentNode) return;
        /* a bar in a hidden view is left alone, so it still fills when its
           view is the one being shown */
        if (!el.offsetParent) return;
        el.dataset.filled = '1';
        var r = read(el);
        if (!r) return;
        var list = byTrack.get(el.parentNode);
        if (!list){ list = []; byTrack.set(el.parentNode, list); }
        list.push({ el: el, prop: r.prop, target: r.target, rem: el.classList.contains('rem') });
      });

      byTrack.forEach(function(list){
        var total = 0;
        list.forEach(function(q){ total += pct(q.target); });
        list.forEach(function(q){
          q.el.style.setProperty('transition', 'none');
          /* the remainder starts owning the whole track; progress starts empty */
          q.el.style.setProperty(q.prop, q.rem ? total + '%' : '0%');
        });
        groups.push(list);
      });

      if (groups.length && !pending) pending = requestAnimationFrame(flush);
    }

    /* the pages render by writing innerHTML in dozens of places; watching for
       new nodes beats wiring a call into every one of them */
    observer = new MutationObserver(function(muts){
      if (!armed) return;
      muts.forEach(function(m){
        for (var i = 0; i < m.addedNodes.length; i++){
          if (m.addedNodes[i].nodeType === 1) scan(m.addedNodes[i]);
        }
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    /* Navigation is the signal, caught on the way down so we are armed before
       the app's own handler paints. Reading the view from the DOM alone is not
       enough: the nav class and the content are not written in a fixed order. */
    document.addEventListener('click', function(e){
      if (!e.target.closest) return;
      if (e.target.closest('[data-pview], .nav-item, [data-goto], #tabbar .tab-btn')) armFor(viewKey());
    }, true);
    /* back and forward are navigation too; nothing else may arm */
    window.addEventListener('popstate', function(){ armFor(viewKey()); });

    lastKey = viewKey();
    scan(document.body);
  })();
})();
</script>
</body>
</html>
