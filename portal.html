<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0e1116">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>NovaTech &middot; Order Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">
<script>
  (function(){
    try{
      var t = localStorage.getItem('ntTheme') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      /* the session resolves asynchronously; until it does show neither
         screen, rather than flashing sign-in at someone already signed in */
      document.documentElement.classList.add('nt-boot');
      /* if the check never comes back, fall through to the normal screens
         rather than spinning forever */
      setTimeout(function(){ document.documentElement.classList.remove('nt-boot'); }, 5000);
    }catch(e){}
  })();
</script>
<style>

  :root{
    color-scheme:light;
    /* Notion Sans is proprietary; Inter is the fallback the spec names, and
       the spec defines no mono token, so figures ride the UI face with tnum. */
    --font-ui:'Inter',-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-num:var(--font-ui);
    --ink:#1a1a1a; --charcoal:#37352f; --ink-deep:#000000; --on-ink:#ffffff; --muted:#5d5b54; --faint:#787671;
    --stone:#a4a097; --disabled:#bbb8b1;
    --bg:#f6f5f4; --paper:#ffffff; --soft:#fafaf9;
    --line:#e5e3df; --line-strong:#c8c4be;
    --accent:#5645d4; --accent-fg:#5645d4; --accent-hover:#4534b3;
    --accent-soft:#e6e0f5; --accent-line:#d6b6f6; --accent-ink:#ffffff;
    --link:#0075de; --link-hover:#005bab;
    --hue-rma:#0075de;
    /* hue drives the dot and any fill; the pastel tint sits behind and the
       label uses the family's deep variant so it clears 4.5:1 */
    --ok:#1aae39;   --ok-ink:#37352f;   --ok-bg:#d9f3e1;   --ok-line:#b6e5c4;
    --warn:#dd5b00; --warn-ink:#793400; --warn-bg:#ffe8d4; --warn-line:#f7cba8;
    --bad:#e03131;  --bad-ink:#a02e6d;  --bad-bg:#fde0ec;  --bad-line:#f6c0d8;
    --info:#5645d4; --info-ink:#391c57; --info-bg:#e6e0f5; --info-line:#d6b6f6;
    --e1:rgba(15,15,15,.04) 0 1px 2px 0;
    --e2:rgba(15,15,15,.08) 0 4px 12px 0;
    --e3:rgba(15,15,15,.20) 0 24px 48px -8px;
    --e4:rgba(15,15,15,.16) 0 16px 48px -8px;
    --scrim:rgba(10,21,48,.5);
    /* liquid glass: one tinted surface plus its opaque stand-in, and the two
       easing curves every piece of chrome moves on */
    --glass:rgba(48,52,62,.68); --glass-solid:#2c2f38;
    --tab-chip:#f6f5f4; --tab-chip-ink:#15171d;
    --ease-drawer:cubic-bezier(.32,.72,0,1);
    --ease-out:cubic-bezier(.2,.8,.3,1);
    --ring:0 0 0 2px var(--accent);
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s4b:20px;
    --s5:24px; --s6:32px; --s6b:40px; --s7:48px; --s8:64px;
    --r-xs:4px; --r-tag:6px; --r-sm:8px; --r-md:12px;
    --r-lg:16px; --r-xl:20px; --r-pill:9999px;
    --t:170ms cubic-bezier(.2,.6,.2,1);
    --t-slow:220ms cubic-bezier(.2,.6,.2,1);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    /* derived from the spec's own navy band colours — no new hues introduced */
    --ink:#e8ecf2; --charcoal:#e8ecf2; --muted:#9aa5b4; --faint:#6c7787;
    --stone:#9aa5b4; --disabled:#5b6673;
    --bg:#0e1116; --paper:#161b22; --soft:#1c222b;
    --line:#252c36;
    --line-strong:#374250;
    --ink-deep:#ffffff; --on-ink:#0e1116;
    --accent:#5645d4; --accent-fg:#d6b6f6; --accent-hover:#7b3ff2;
    --accent-soft:color-mix(in srgb, #5645d4 26%, #161b22);
    --accent-line:color-mix(in srgb, #7b3ff2 44%, #161b22);
    --accent-ink:#ffffff;
    --link:#dcecfa; --link-hover:#ffffff;
    --hue-rma:#dcecfa;
    --ok:#1aae39;   --ok-ink:#d9f3e1;
    --ok-bg:color-mix(in srgb, #1aae39 20%, #161b22);
    --ok-line:color-mix(in srgb, #1aae39 38%, #161b22);
    --warn:#dd5b00; --warn-ink:#ffe8d4;
    --warn-bg:color-mix(in srgb, #dd5b00 22%, #161b22);
    --warn-line:color-mix(in srgb, #dd5b00 40%, #161b22);
    --bad:#e03131;  --bad-ink:#fde0ec;
    --bad-bg:color-mix(in srgb, #e03131 22%, #161b22);
    --bad-line:color-mix(in srgb, #e03131 40%, #161b22);
    --info:#5645d4; --info-ink:#e6e0f5;
    --info-bg:color-mix(in srgb, #5645d4 26%, #161b22);
    --info-line:color-mix(in srgb, #7b3ff2 44%, #161b22);
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.4);
    --e3:0 2px 6px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.55);
    --e4:rgba(0,0,0,.5) 0 16px 48px -8px;
    --scrim:rgba(4,6,9,.66);
    --glass:rgba(24,28,36,.62); --glass-solid:#161a21;
    --tab-chip:rgba(255,255,255,.16); --tab-chip-ink:#eef1f6;
    --ring:0 0 0 2px var(--accent-hover);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  /* the rubber-band area past the top of the page is the html background,
     not the body's — without this it flashes white in dark mode */
  html{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:14px; line-height:1.50;
    font-feature-settings:normal;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background var(--t-slow), color var(--t-slow);
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--accent-fg); text-decoration:none; }
  a:hover{ color:var(--accent-hover); }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:none; box-shadow:var(--ring); border-radius:var(--r-sm);
  }
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  h1,h2,h3,h4{ font-weight:600; letter-spacing:-0.5px; }
  h3,h4{ letter-spacing:0; }
  b, strong{ font-weight:600; }
  ::placeholder{ color:var(--stone); opacity:1; }
  input[type="checkbox"], input[type="radio"]{ accent-color:var(--accent); }
  .muted{ color:var(--muted); font-size:12.5px; }
  .subtle{ font-size:11.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); margin-left:var(--s2); }

  /* ---------- top bar ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:var(--s5);
    /* brand and actions land on the same columns as the page content below */
    padding:var(--s3) max(var(--s5), calc((100% - 2040px) / 2)); background:var(--paper);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; flex-wrap:nowrap;
    box-shadow:var(--e1);
  }
  header.top::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:var(--line); pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:var(--s4); min-width:0; }
  .brand img{ height:30px; width:auto; flex:0 0 auto; }
  .brand img.is-dark, .brand img.is-mark{ display:none; }
  .so-ico{ display:none; width:16px; height:16px; }
  :root[data-theme="dark"] .brand img.is-light{ display:none; }
  :root[data-theme="dark"] .brand img.is-dark{ display:block; }
  /* a hairline keeps the wordmark from touching the page label */
  .brand > div{ position:relative; padding-left:var(--s4); min-width:0; }
  .brand > div::before{
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:1px; height:28px;
    background:var(--line-strong);
  }
  .brand b{ font-size:15px; letter-spacing:0; display:block; line-height:1.3; }
  .brand span{ display:block; color:var(--faint); font-size:12px; line-height:1.3; }

  .pmenu{ display:flex; align-items:center; gap:var(--s1); margin:0 auto 0 var(--s3); }
  .pmenu a{
    position:relative; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted);
    text-decoration:none; padding:8px 16px; line-height:1.3; border-radius:var(--r-pill) !important; white-space:nowrap; cursor:pointer;
  }
  .pmenu a:hover{ background:var(--soft); color:var(--ink); }
  .pmenu a.on{ background:var(--ink); color:var(--paper); }
  .pbadge{
    display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
    border-radius:var(--r-pill); background:var(--warn); color:#fff; font-size:11px; font-weight:700; line-height:1;
  }
  .who{ display:flex; align-items:center; gap:var(--s4); flex-wrap:nowrap; min-width:0; }
  .who-em{ font-size:12.5px; color:var(--muted); }
  /* identity on one side of the rule, actions on the other */
  .who #themeBtn{ position:relative; margin-left:var(--s3); }
  .who #themeBtn::before{
    content:""; position:absolute; left:calc(var(--s3) * -1 - 1px); top:50%; transform:translateY(-50%);
    width:1px; height:24px;
    background:var(--line-strong);
  }

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    border-radius:var(--r-sm); padding:8px 12px; min-height:34px; font:inherit; font-size:14px; font-weight:500;
    /* an explicit line-height — the inherited 1.55 makes a 13px label 20px tall
       and pushes the button past its min-height */
    line-height:1.2;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; transition:border-color var(--t), background var(--t), transform var(--t), box-shadow var(--t);
  }
  .btn:hover{ border-color:var(--muted); box-shadow:var(--e1); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); padding:10px 18px; min-height:40px; }
  .btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); box-shadow:none; }
  .btn.sm{ padding:4px 12px; min-height:28px; font-size:12.5px; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; min-height:32px; padding:0; border:1px solid var(--line-strong);
    background:var(--paper); color:var(--muted); border-radius:var(--r-pill); cursor:pointer;
    transition:color var(--t), border-color var(--t), background var(--t), box-shadow var(--t);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--muted); box-shadow:none; }
  .icon-btn svg{ width:17px; height:17px; }
  :root[data-theme="light"] .i-sun{ display:none; }
  :root:not([data-theme="light"]) .i-moon{ display:none; }

  /* ---------- layout ---------- */
  .wrap{ max-width:2040px; margin:0 auto; padding:var(--s7) var(--s6) var(--s8); }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s5); margin-bottom:var(--s5); box-shadow:none;
  }
  h1{ font-size:24px; letter-spacing:0; margin:0 0 var(--s2); line-height:1.2; }
  h2{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--faint); margin:0 0 var(--s4b); }
  .page-head{ margin-bottom:var(--s5); }
  /* the status chip is a sibling of the number, not punctuation after it */
  .inv-h1{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; row-gap:var(--s2); }

  /* ---------- login ---------- */
  .login{ max-width:400px; margin:11vh auto; padding:0 var(--s4); animation:rise var(--t-slow) both; }
  .field{ margin-bottom:var(--s3); }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:var(--s1); }
  .field input, .pickbox, .searchbox{
    width:100%; height:44px; padding:0 var(--s4); font:inherit; font-size:14px;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper); color:var(--ink);
    transition:border-color var(--t), box-shadow var(--t);
  }
  .field input:focus, .pickbox:focus, .searchbox:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .err{ color:var(--bad); font-size:12.5px; min-height:1.2em; margin-top:var(--s2); font-weight:600; }

  /* ---------- order rows ---------- */
  .toolbar{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .searchbox{ flex:1 1 260px; height:44px; font-size:14px; }
  .orow{
    display:grid; grid-template-columns:minmax(0,1fr) auto 210px 28px; gap:var(--s5);
    align-items:center; padding:var(--s4); border:1px solid var(--line);
    border-radius:var(--r-md); background:var(--paper); margin-bottom:var(--s3);
    cursor:pointer; box-shadow:var(--e1);
    transition:border-color var(--t), box-shadow var(--t), transform var(--t);
    animation:rise var(--t-slow) both;
  }
  .orow:hover{ border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); box-shadow:var(--e2); }
  .orow:hover .chev{ color:var(--accent-fg); }
  /* movement only on a real pointer: a tap fires a hover that sticks */
  @media (hover: hover) and (pointer: fine){
    .orow:hover{ transform:translateY(-1px); }
    .orow:hover .chev{ transform:translateX(3px); }
  }
  .orow:focus-visible{ outline:none; box-shadow:var(--ring); }
  .inv{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; font-weight:600; font-size:15px; }
  /* its own cell, so the row's align-items:center does the vertical centring */
  .ostat{ display:flex; align-items:center; justify-content:center; min-width:0; margin-right:var(--s4); }
  .ostat .chip{ flex:0 0 auto; }
  .inv-lbl{ font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--faint);  white-space:nowrap; }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .chev{ color:var(--faint); display:flex; justify-content:flex-end; transition:transform var(--t), color var(--t); }
  .chev svg{ width:18px; height:18px; }

  .chip{
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
    font-size:11.5px; font-weight:600; letter-spacing:.02em;
    padding:4px 10px; border-radius:var(--r-pill); border:1px solid transparent;
  }
  .chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.n{ color:var(--muted);  background:var(--soft);      border-color:var(--line); }
  .chip.i{ color:var(--info-ink);   background:var(--info-bg);   border-color:var(--info-line); --dot:var(--info); }
  .chip.w{ color:var(--warn-ink);   background:var(--warn-bg);   border-color:var(--warn-line); --dot:var(--warn); }
  .chip.k{ color:var(--ok-ink);     background:var(--ok-bg);     border-color:var(--ok-line); --dot:var(--ok); }
  .chip.b{ color:var(--bad-ink);    background:var(--bad-bg);    border-color:var(--bad-line); --dot:var(--bad); }

  .bar{ height:7px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; display:flex; border:1px solid var(--line); }
  .bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .bar i.s{ background:var(--ok); } .bar i.a{ background:var(--accent); } .bar i.b{ background:var(--line-strong); }
  .barlbl{ font-family:var(--font-num); font-size:11.5px; color:var(--muted); margin-top:8px; font-variant-numeric:tabular-nums; }

  /* ---------- detail ---------- */
  .back{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .sum{ display:grid; grid-template-columns:repeat(5,1fr); gap:var(--s3); margin-bottom:var(--s5); }
  .sumc{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s4); box-shadow:none; animation:rise var(--t-slow) both;
  }
  .sumv{ font-family:var(--font-num); font-size:26px; font-weight:600; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .suml{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-top:var(--s1); line-height:1.3; text-wrap:balance; }
  .sumc.ok .sumv{ color:var(--ok); }
  .sumc.rem .sumv{ color:var(--warn); }
  .sumc.prep .sumv{ color:var(--info); }

  /* skinny progress rail above the tiles */
  .oprog{ margin-bottom:var(--s4); }
  .oprog-bar{
    display:flex; height:8px; overflow:hidden; background:var(--soft);
    border:1px solid var(--line); border-radius:var(--r-pill);
  }
  .oprog-bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .oprog-l{
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
    margin-top:var(--s2); font-size:12px; color:var(--muted);
  }
  .oprog-l b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- pipeline summary ---------- */
  .pipev{ font-size:28px; font-weight:600; line-height:1.25; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; }
  .pipes{ font-size:13px; color:var(--muted); }
  .pipebar{
    display:flex; height:12px; margin-top:var(--s4); overflow:hidden;
    background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill);
  }
  .pipebar i{ display:block; height:100%; transition:width var(--t-slow); }
  .pipeleg{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--s2) var(--s6); margin-top:var(--s4); }
  .pipeit{ display:flex; align-items:center; gap:var(--s2); font-size:13px; min-width:0; }
  .pipedot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .pipel{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pipen{ margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }
  @media (max-width:640px){ .pipeleg{ grid-template-columns:minmax(0,1fr); gap:var(--s2); } .pipev{ font-size:24px; } }

  /* Paging redraws the whole detail view, so remember which batches were
     open and put them back. */
  function batchesOpen(){
    const ids = [];
    document.querySelectorAll('.bbody').forEach(function(b){
      if (b.classList.contains('open')) ids.push(b.id.replace(/^bb_/, ''));
    });
    return ids;
  }
  function reopenBatches(ids){
    ids.forEach(function(id){
      const bd = document.getElementById('bb_' + id);
      if (!bd) return;
      bd.classList.add('open', 'instant');
      requestAnimationFrame(function(){ bd.classList.remove('instant'); });
      const btn = document.querySelector('[data-x="' + id + '"]');
      if (btn) btn.textContent = 'Hide';
    });
  }
  document.addEventListener('click', function(e){
    const pv = e.target.closest('[data-bprev]'), nx = e.target.closest('[data-bnext]');
    if (!pv && !nx) return;
    const id = (pv || nx).getAttribute(pv ? 'data-bprev' : 'data-bnext');
    batchPage[id] = (batchPage[id] || 0) + (pv ? -1 : 1);
    const open = batchesOpen();
    if (currentId) openOrder(currentId);
    reopenBatches(open);
  });
  document.addEventListener('change', function(e){
    const sel = e.target.closest('[data-rows]');
    if (!sel) return;
    const n = parseInt(sel.value, 10);
    rowsPer = ROW_OPTS.indexOf(n) >= 0 ? n : 30;   /* 0 means All, and 0 is falsy */
    try { localStorage.setItem('portalRows', String(rowsPer)); } catch(err){}
    batchPage = {};
    const open = batchesOpen();
    if (currentId) openOrder(currentId);
    reopenBatches(open);
  });


  /* ---------- demo mode ---------- */
  #demoBar{
    position:fixed; left:0; right:0; bottom:0; z-index:9999;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px max(12px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
    background:var(--warn); color:#fff; font-size:12.5px; line-height:1.3;
    box-shadow:0 -2px 12px rgba(0,0,0,.18);
  }
  #demoBar b{ font-weight:600; }
  #demoBar .demo-dot{
    width:8px; height:8px; border-radius:50%; background:#fff; flex:0 0 auto;
    animation:demoPulse 1.8s ease-in-out infinite;
  }
  @keyframes demoPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  #demoBar .demo-sep{ opacity:.6; }
  #demoBar .demo-txt{ min-width:0; }
  #demoBar button{
    margin-left:auto; appearance:none; cursor:pointer; font:inherit; font-size:12px;
    padding:5px 12px; min-height:30px; border-radius:9999px;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.5); color:#fff;
  }
  #demoBar button:hover{ background:rgba(255,255,255,.3); }
  :root[data-demo]{ --demo-bar:44px; }

  @media print{ #demoBar{ display:none !important; } }

  /* ---------- notes on an order ----------
     Both sides write here. A note from NovaTech is the answer to "where is
     my order", so it sits under the shipments, not behind a tab. */
  .nthread{ display:flex; flex-direction:column; gap:var(--s3); }
  .nmsg{ border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s3) var(--s4); background:var(--paper); }
  .nmsg.them{ background:var(--soft); }
  .nmsg.pinned{ border-color:var(--accent-line); background:var(--accent-soft); }
  .nmsg-h{
    display:flex; justify-content:space-between; align-items:center; gap:var(--s3);
    flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:var(--s1);
  }
  .nmsg-h b{ color:var(--ink); font-weight:600; }
  .nmsg-h{ flex-wrap:nowrap; }
  .nmsg-h span{ display:inline-flex; align-items:center; gap:6px; min-width:0; }
  .nmsg-h span:first-child{ flex:1 1 auto; }
  .nmsg-h span:first-child b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nmsg-h span:last-child{ flex:0 0 auto; white-space:nowrap; }
  .nmsg p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13.5px; }
  .nmsg-x{
    appearance:none; border:none; background:none; padding:0 2px; cursor:pointer;
    color:var(--faint); font-size:12px; line-height:1; font-family:inherit;
  }
  .nmsg-x:hover{ color:var(--bad); }
  .ncompose{ margin-top:var(--s4); display:grid; gap:var(--s2); }
  .ncompose textarea{
    width:100%; min-height:76px; resize:vertical; font:inherit; font-size:13.5px;
    padding:var(--s3); border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper); color:var(--ink);
  }
  .ncompose textarea:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .ncompose-bar{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .ncompose-bar .sp{ flex:1; }
  .nempty{ margin:0; color:var(--muted); font-size:13px; }

  /* ---------- billing ----------
     The page answers one question first — what do I owe — then shows the
     shape of the account: how it ages, what has moved month to month, and
     the invoices themselves. */

  /* the balance, on the brand ground, with a settled meter under it */
  .bhero{
    display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:var(--s5);
    padding:var(--s5) var(--s5b, var(--s5)); border-radius:var(--r-lg);
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
    color:var(--accent-ink); box-shadow:var(--e2); align-items:start;
  }
  .bhero-k{ font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.72; }
  .bhero-v{
    margin-top:var(--s1); font-size:44px; font-weight:600; line-height:1.05;
    letter-spacing:-1.5px; font-variant-numeric:tabular-nums;
  }
  .bhero-s{ margin-top:var(--s2); font-size:13px; opacity:.82; }
  .bmeter{
    margin-top:var(--s4); height:8px; border-radius:var(--r-pill);
    background:rgba(255,255,255,.22); overflow:hidden;
  }
  .bmeter-f{ height:100%; border-radius:var(--r-pill); background:var(--accent-ink); transition:width var(--t-slow); }
  .bmeter-l{ margin-top:var(--s2); font-size:12px; opacity:.82; font-variant-numeric:tabular-nums; }
  /* the right column: the next thing that needs doing */
  .bhero-side{ display:flex; flex-direction:column; gap:var(--s3); }
  .bhero-box{
    padding:var(--s3) var(--s4); border-radius:var(--r-md);
    background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.18);
  }
  .bhero-box.hot{ background:rgba(255,255,255,.2); border-color:var(--accent-ink); }
  .bhero-box .bhero-k{ opacity:.8; }
  .bhero-box b{ display:block; margin-top:2px; font-size:19px; letter-spacing:-0.4px; font-variant-numeric:tabular-nums; }
  .bhero-box span{ font-size:12px; opacity:.8; }

  /* three plain figures in a row — cards would compete with the hero */
  .bquick{
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr));
    border:1px solid var(--line); border-radius:var(--r-md); background:var(--paper);
    margin-top:var(--s4); overflow:hidden;
  }
  .bquick > div{ padding:var(--s4); border-left:1px solid var(--line); min-width:0; }
  .bquick > div:first-child{ border-left:none; }
  .bquick-k{ font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .bquick-v{ margin-top:2px; font-size:22px; font-weight:600; letter-spacing:-0.6px; font-variant-numeric:tabular-nums; }
  .bquick-s{ font-size:12px; color:var(--muted); }
  .bquick .hot{ color:var(--bad); }

  /* aging: one bar, because five boxes of money say less than their shares */
  .bagebar{ display:flex; height:14px; border-radius:var(--r-pill); overflow:hidden; background:var(--soft); margin-top:var(--s4); }
  .bagebar i{ display:block; min-width:2px; transition:flex-basis var(--t-slow); }
  .bagebar i.g0{ background:var(--accent); }
  .bagebar i.g1{ background:color-mix(in srgb, var(--warn) 60%, var(--paper)); }
  .bagebar i.g2{ background:var(--warn); }
  .bagebar i.g3{ background:color-mix(in srgb, var(--bad) 70%, var(--warn)); }
  .bagebar i.g4{ background:var(--bad); }
  .bagekey{ display:flex; flex-wrap:wrap; gap:var(--s3) var(--s5); margin-top:var(--s4); }
  .bagekey > div{ min-width:0; }
  .bagekey-k{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .bagekey-k i{ width:8px; height:8px; border-radius:2px; flex:0 0 auto; }
  .bagekey-v{ margin-top:1px; font-weight:600; font-variant-numeric:tabular-nums; font-size:14px; }
  .bagekey .zero{ color:var(--stone); font-weight:400; }

  /* the chart: gridlines, a real axis, and a value on hover */
  .bch{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:0 var(--s3); margin-top:var(--s4b); }
  .bch-y{
    display:flex; flex-direction:column; justify-content:space-between;
    height:168px; font-size:10.5px; color:var(--faint); text-align:right;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .bch-y span{ transform:translateY(-50%); }
  .bch-y span:last-child{ transform:translateY(50%); }
  .bch-col2{ min-width:0; }
  .bch-plot{ position:relative; height:168px; }
  .bch-grid{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; }
  .bch-grid i{ display:block; height:1px; background:var(--line); }
  .bch-grid i:last-child{ background:var(--line-strong); }
  .bch-cols{ position:absolute; inset:0; display:flex; align-items:flex-end; gap:2px; }
  .bch-col{
    flex:1 1 0; min-width:0; height:100%; position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding:0 2px;
    border-radius:var(--r-xs) var(--r-xs) 0 0;
  }
  .bch-col:hover{ background:var(--soft); }
  .bch-bar{
    width:100%; max-width:44px; border-radius:var(--r-xs) var(--r-xs) 0 0;
    background:linear-gradient(180deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 62%, var(--paper)) 100%);
    transition:height var(--t-slow);
  }
  .bch-col.none .bch-bar{ background:var(--line); }
  .bch-col.units .bch-bar{
    background:linear-gradient(180deg, var(--ok) 0%, color-mix(in srgb, var(--ok) 55%, var(--paper)) 100%);
  }
  .bch-tip{
    position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
    padding:3px 8px; border-radius:var(--r-tag); background:var(--ink); color:var(--paper);
    font-size:11px; white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity var(--t); font-variant-numeric:tabular-nums; z-index:2;
  }
  .bch-col:hover .bch-tip{ opacity:1; }
  .bch-x{ display:flex; gap:2px; margin-top:var(--s2); }
  .bch-x span{
    flex:1 1 0; min-width:0; text-align:center; font-size:10.5px; color:var(--faint);
    white-space:nowrap; overflow:hidden;
  }
  .bch-tot{ display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5); margin-top:var(--s4); font-size:12.5px; color:var(--muted); }
  .bch-tot b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .bseg{ display:flex; gap:2px; padding:3px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill); }
  .bseg button{
    appearance:none; border:none; background:none; cursor:pointer; font:inherit; font-size:12px;
    padding:5px 12px; border-radius:var(--r-pill); color:var(--muted); min-height:30px;
  }
  .bseg button.on{ background:var(--paper); color:var(--ink); font-weight:600; box-shadow:var(--e1); }
  .bseg button:hover{ color:var(--ink); }
  .bchart-bar{ width:100%; max-width:34px; background:var(--accent); border-radius:var(--r-sm) var(--r-sm) 0 0; min-height:2px; }
  .btabs{ display:flex; gap:var(--s2); }
  .binv{ border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:var(--s2); overflow:hidden; background:var(--paper); }
  .binv-h{
    display:grid; grid-template-columns:minmax(0,1.5fr) 96px repeat(2, minmax(0,1fr)) auto;
    gap:var(--s3) var(--s4); align-items:center; padding:var(--s4); cursor:pointer;
    transition:background var(--t);
  }
  .binv.open{ border-color:var(--line-strong); box-shadow:var(--e1); }
  /* how much of this invoice is settled, at a glance */
  .binv-m{ height:6px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; }
  .binv-m i{ display:block; height:100%; border-radius:var(--r-pill); background:var(--accent); }
  .binv-m.full i{ background:var(--ok); }
  .binv-m.late i{ background:var(--bad); }
  .binv-mp{ margin-top:3px; font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .binv-h:hover{ background:var(--soft); }
  .binv-h:focus-visible{ outline:none; box-shadow:var(--ring); }
  .binv-no{ font-weight:600; }
  .binv-sub{ font-size:12px; color:var(--muted); }
  .binv-n{ text-align:right; font-variant-numeric:tabular-nums; }
  .binv-n b{ display:block; }
  .binv-n span{ font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  .binv-b{ padding:0 var(--s4) var(--s4); border-top:1px solid var(--line); }
  .binv-b.fresh{ animation:rise var(--t-slow) both; }
  .binv-sec{ margin:var(--s4) 0 var(--s2); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .bpay{ display:grid; grid-template-columns:auto auto minmax(0,1fr); gap:var(--s3); padding:var(--s2) 0; border-bottom:1px solid var(--line); font-size:13px; }
  .bpay:last-child{ border-bottom:none; }
  .bpay-a{ font-weight:600; font-variant-numeric:tabular-nums; }
  .bpay-d{ color:var(--muted); }
  .bdoc{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:var(--s3); align-items:center; padding:var(--s2) 0; border-bottom:1px solid var(--line); font-size:13px; }
  .bdoc:last-child{ border-bottom:none; }
  .bdoc-n{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .bdoc-m{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .bacts{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s4); }
  @media (max-width:860px){
    .bhero{ grid-template-columns:minmax(0,1fr); gap:var(--s4); padding:var(--s4b) var(--s4); }
    .bhero-v{ font-size:38px; }
    .bhero-side{ flex-direction:row; }
    .bhero-side > *{ flex:1 1 0; }
    .binv-h{ grid-template-columns:minmax(0,1fr) 88px auto; }
    .binv-n.hide-sm{ display:none; }
  }
  @media (max-width:560px){
    .bquick{ grid-template-columns:minmax(0,1fr); }
    .bquick > div{ border-left:none; border-top:1px solid var(--line); }
    .bquick > div:first-child{ border-top:none; }
    .bhero-side{ flex-direction:column; }
    .bhero-v{ font-size:34px; letter-spacing:-1px; }
    .bagekey{ gap:var(--s3) var(--s4); }
    .bch-y{ display:none; }
    .bch{ grid-template-columns:minmax(0,1fr); }
    .binv-h{ grid-template-columns:minmax(0,1fr) auto; padding:var(--s3) var(--s4); }
    .binv-m-wrap{ display:none; }
  }

  /* ---------- RMAs ---------- */
  .rhead{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s4); }
  .rhead h1{ margin:0; }
  .rhsub{ display:flex; flex-wrap:wrap; align-items:center; gap:4px var(--s4); line-height:1.6; margin:var(--s3) 0 var(--s4); }
  .rhsub > span{ display:inline-flex; align-items:center; gap:var(--s3); min-width:0; }
  .rhsub > span + span::before{ content:"\00b7"; color:var(--faint); }
  /* the number leads; status chips sit at the far right of the row */
  .inv-h1 > .chip{ margin-left:auto; }
  .inv-h1 > .chip + .chip{ margin-left:0; }

  /* ---------- PO number: the one field the customer owns ---------- */
  .pometa{ display:flex; align-items:center; flex-wrap:wrap; gap:var(--s2) var(--s3); margin:calc(-1 * var(--s2)) 0 var(--s5); font-size:13px; color:var(--muted); }
  .pometa .po-k{ font-weight:600; }
  .pometa .po-v{ color:var(--ink); font-weight:600; }
  .pometa .po-none{ color:var(--faint); }
  .pometa .po-due::before{ content:"\00b7"; color:var(--faint); margin-right:var(--s3); }
  .poform{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .poform input{
    height:32px; padding:0 var(--s3); font:inherit; font-size:13px; width:200px; max-width:100%;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper); color:var(--ink);
  }
  .poform input:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  @media (max-width:640px){
    .poform input{ height:40px; font-size:16px; width:100%; }
    .poform{ width:100%; }
    .poform .btn{ flex:1; }
  }
  .rhead .btn, .rlook + * .btn, #rnLook, #rmaRetGo{ white-space:nowrap; }
  .rrow{
    display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto 110px; gap:var(--s4); align-items:center;
    padding:var(--s4) var(--s4b); border:1px solid var(--line); border-radius:var(--r-md); background:var(--paper);
    margin-bottom:var(--s2); cursor:pointer; transition:border-color var(--t); animation:rise var(--t-slow) both;
  }
  .rrow:hover{ border-color:var(--line-strong); }
  .rrow .rno{ font-weight:600; font-variant-numeric:tabular-nums; }
  .rrow .rsub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .rrow .rissue{ font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rdate{ font-size:12px; color:var(--faint); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rtiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--s3); margin-bottom:var(--s4); }
  /* the tiles carry their state's hue, the way the dashboard stats do */
  .rtile{
    background:color-mix(in srgb, var(--rtile-hue, var(--line)) 8%, var(--paper));
    border:1px solid color-mix(in srgb, var(--rtile-hue, var(--line)) 32%, var(--paper));
    border-radius:var(--r-md); padding:var(--s4);
  }
  :root[data-theme="dark"] .rtile{ background:color-mix(in srgb, var(--rtile-hue, var(--line)) 16%, var(--paper)); }
  @supports not (color: color-mix(in srgb, red, blue)){
    .rtile{ background:var(--soft); border-color:var(--line); }
  }
  .rtile b{ display:block; font-size:24px; font-weight:600; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .rtile span{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--faint); }
  .rtile b{ color:var(--rtile-ink, var(--ink)); }
  .rtile.hot b{ color:var(--bad-ink); }
  /* ---- the two RMA charts, matching the ones Novatech sees ---- */
  .rcharts{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:var(--s4); margin-bottom:var(--s4); }
  @media (max-width:900px){ .rcharts{ grid-template-columns:minmax(0,1fr); } }
  .rchart{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s4); min-width:0; }
  .rchart h2{ font-size:13px; font-weight:600; margin:0; }
  .rchart-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s3); flex-wrap:wrap; }
  .rchart-val{ font-size:28px; font-weight:600; line-height:1.25; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; margin-top:var(--s2); }
  .rchart-sub{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .rchart-plot{ position:relative; margin-top:var(--s4); }
  .rchart-plot svg{ display:block; width:100%; }
  .rchart-axis{ display:flex; justify-content:space-between; font-size:11px; color:var(--faint); margin-top:var(--s2); font-variant-numeric:tabular-nums; }
  .rchart-tip{
    position:absolute; transform:translate(-50%,-100%); pointer-events:none; opacity:0; transition:opacity var(--t);
    background:var(--ink-deep); color:var(--on-ink); font-size:11.5px; line-height:1.4; white-space:nowrap;
    padding:5px 9px; border-radius:var(--r-sm);
  }
  .rchart-tabs{ display:inline-flex; gap:4px; flex:0 0 auto; }
  .rchart-tabs button{
    font:inherit; font-size:12px; font-weight:500; padding:3px 11px; min-height:26px; cursor:pointer;
    border-radius:var(--r-pill); border:1px solid var(--line); background:transparent; color:var(--muted);
  }
  .rchart-tabs button.on{ background:var(--ink-deep); color:var(--on-ink); border-color:var(--ink-deep); }
  .rfail{ display:grid; gap:var(--s2); margin-top:var(--s4); }
  .rfail-row{ display:grid; grid-template-columns:130px minmax(0,1fr) 40px; gap:var(--s3); align-items:center; font-size:13px; }
  .rfail-row .nt-catline{ color:var(--muted); min-width:0; }
  .rfail{ container-type:inline-size; }
  @container (max-width:250px){
    .rfail-row{ grid-template-columns:minmax(0,1fr) 40px; row-gap:6px; }
    .rfail-row b{ grid-column:2; grid-row:1; }
    .rfail-bar{ grid-column:1 / -1; grid-row:2; }
  }
  .rfail-bar{ height:8px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; }
  .rfail-bar i{ display:block; height:100%; background:var(--accent); }
  .rfail-row b{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  @media (max-width:700px){
    /* title → chart → number, the way every other chart on a phone reads */
    .rchart{ display:flex; flex-direction:column; gap:var(--s1); padding:var(--s4) var(--s3); }
    .rchart h2{ order:1; }
    .rchart-head{ order:1; }
    .rchart-plot{ order:2; margin-top:var(--s2); }
    .rchart-val{ order:3; font-size:18px; line-height:1.2; margin-top:var(--s2); }
    .rchart-sub{ order:4; font-size:11.5px; }
    .rfail{ order:5; }
    .rchart-axis{ margin-top:4px; font-size:10px; }
    .rchart-tabs{ width:100%; } .rchart-tabs button{ flex:1 1 auto; }
    .rfail-row{ grid-template-columns:104px minmax(0,1fr) 40px; }
  }
  .rchips{ display:flex; flex-wrap:wrap; gap:var(--s2); margin-bottom:var(--s4); }
  .rchips button{ font:inherit; font-size:12.5px; font-weight:500; padding:6px 14px; min-height:32px; border-radius:var(--r-pill) !important; border:1px solid var(--line); background:var(--paper); color:var(--muted); cursor:pointer; }
  .rchips button:hover{ border-color:var(--line-strong); color:var(--ink); }
  .rchips button.on{ background:var(--accent-soft); color:var(--accent-fg); border-color:var(--accent-line); }
  .olist-card .orow{ animation:none; }

  .rgrid{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:var(--s4); align-items:start; }
  .rdl{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--s3) var(--s4); font-size:13.5px; line-height:1.55; margin:0; }
  .rdl dt{ color:var(--muted); } .rdl dd{ margin:0; min-width:0; overflow-wrap:anywhere; }
  .rthread{ display:flex; flex-direction:column; gap:var(--s3); }
  .rmsg{ border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s3) var(--s4); background:var(--paper); }
  .rmsg.me{ background:var(--soft); }
  .rmsg-h{ display:flex; justify-content:space-between; gap:var(--s3); font-size:12px; color:var(--muted); margin-bottom:var(--s1); flex-wrap:wrap; }
  .rmsg-h b{ color:var(--ink); font-weight:600; }
  .rmsg p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13.5px; }
  .ratt{ display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s2); }
  .ratt a{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border:1px solid var(--line); border-radius:var(--r-pill); background:var(--paper); color:var(--ink); text-decoration:none; cursor:pointer; max-width:100%; }
  .ratt a span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }
  .ratt img{ width:64px; height:64px; object-fit:cover; border-radius:var(--r-sm); border:1px solid var(--line); cursor:pointer; background:var(--soft); }
  .rcompose{ margin-top:var(--s4); display:grid; gap:var(--s2); }
  .rcompose textarea, .rfield textarea{ width:100%; min-height:80px; padding:var(--s3) var(--s4); font:inherit; font-size:14px; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); resize:vertical; }
  .rbar{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .rbar .spacer{ flex:1; }
  .rbar .filebtn{ cursor:pointer; }
  .rtl{ list-style:none; margin:0; padding:0; }
  .rtl li{ position:relative; padding:0 0 var(--s3) var(--s4b); font-size:13px; }
  .rtl li::before{ content:""; position:absolute; left:4px; top:6px; width:8px; height:8px; border-radius:50%; background:var(--line-strong); }
  .rtl li::after{ content:""; position:absolute; left:7px; top:16px; bottom:-2px; width:2px; background:var(--line); }
  .rtl li:last-child::after{ display:none; }
  .rtl small{ display:block; color:var(--faint); font-size:11.5px; }
  .rlook{ margin-top:var(--s2); padding:var(--s3) var(--s4); border:1px solid var(--line); border-radius:var(--r-sm); background:var(--soft); font-size:13px; }
  .rlook .chip{ vertical-align:middle; }
  /* the way out when a serial predates the portal */
  .rlegacy{ display:flex; align-items:flex-start; gap:10px; margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--line); cursor:pointer; }
  .rlegacy input{ width:16px; height:16px; margin-top:2px; flex:0 0 auto; cursor:pointer; }
  .rlegacy span{ color:var(--muted); line-height:1.5; }

  .rlegacy-note{ font-size:13px; line-height:1.5; color:var(--warn-ink); background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:var(--r-sm); padding:var(--s3) var(--s4); margin-bottom:var(--s4); }
  .field select{ width:100%; height:44px; padding:0 var(--s4); font:inherit; font-size:14px; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); }
  .modal.wide{ max-width:560px; }
  .modal-b.scroll{ max-height:70vh; overflow:auto; }
  @media (max-width:820px){

    .rhsub{ flex-direction:column; align-items:flex-start; gap:6px; }

    .back .btn{ width:100%; min-height:40px; }
    .rrow{ grid-template-columns:minmax(0,1fr) auto; gap:var(--s2) var(--s3); padding:var(--s3) var(--s4); }
    .rrow .rissue{ grid-column:1 / -1; white-space:normal; }

    .rrow > .chip{ grid-column:2; grid-row:1; justify-self:end; align-self:start; width:auto; white-space:nowrap; }
    .rrow .rdate{ grid-column:1 / -1; text-align:left; }
    .rtiles{ grid-template-columns:repeat(2, minmax(0,1fr)); }

    /* list card: shorter search, one scrolling filter row, then breathing room
       before the RMA cards themselves */
    .rlist-card .toolbar{ margin-bottom:var(--s3); }

  .batch{ border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:var(--s3); overflow:hidden; background:var(--paper); }
  /* batch number and its status share one line, status at the right edge */
  .bno{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); min-width:0; }
  .bno .chip{ flex:0 0 auto; }
  .bhead{
    cursor:pointer;
    transition:background var(--t);
    display:grid; grid-template-columns:auto minmax(0,1fr) auto auto;
    gap:var(--s3) var(--s4); align-items:center; padding:var(--s4);
  }
  /* the action sits at the right edge of the header at every width */
  .bhead > div:last-child{ justify-self:end; }
  .bacts{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  /* between phone and desktop there is not room for four columns: the batch
     and its status take the first line, the rest pairs up below */
  @media (min-width:821px) and (max-width:980px){
    .bhead{ grid-template-columns:minmax(0,1fr) auto; }
    .bhead > .bno{ grid-column:1 / -1; }
    .bhead > div:last-child{ grid-column:1 / -1; justify-self:end; }
  }
  .bhead b{ font-size:13.5px; }
  /* sits over the serial column, so it reads as "copy this list" */
  .bbar{ display:flex; margin-bottom:var(--s3); }
  .bhead:hover{ background:var(--soft); }
  .bhead:focus-visible{ outline:none; box-shadow:var(--ring); }
  .bhead button, .bhead a, .bhead .cfg{ cursor:default; }
  .bhead button, .bhead a{ cursor:pointer; }
  .bship{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .bship a{ font-family:var(--font-num); font-size:12px; font-weight:600; }
  .trk-dd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bdot{ color:var(--faint); }
  /* the logo identifies the number, so the two never wrap apart */
  .trk-grp{ display:inline-flex; align-items:center; gap:8px; min-width:0; }
  .carrier{
    display:inline-flex; align-items:center; flex:0 0 auto;
    height:17px; padding:0 8px; border-radius:var(--r-pill);
    background:var(--soft); border:1px solid var(--line-strong);
    font-family:var(--font-num); font-size:9.5px; font-weight:600;
    letter-spacing:0.07em; color:var(--muted); font-style:normal;
  }
  .carrier i{ font-style:normal; }
  .trk-tag{
    display:inline-block; margin-left:6px; font-size:9.5px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
    font-family:var(--font-ui); vertical-align:middle; white-space:nowrap;
  }
  .carrier img{ height:14px; width:auto; display:block; }
  /* a real logo needs no chrome around it */
  .carrier.has-logo{ background:none; border:none; padding:0; height:auto; }
  .carrier.has-logo i{ display:none; }
  /* brand colours go slightly flat on a dark ground */
  :root[data-theme="dark"] .carrier.has-logo img{ filter:brightness(1.1) saturate(1.05); }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]) .carrier.has-logo img{ filter:brightness(1.1) saturate(1.05); }
  }
  .storenum{
    display:inline-block; margin-left:var(--s2); font-family:var(--font-num); font-size:11px;
    font-weight:600; color:var(--muted); background:var(--soft); border:1px solid var(--line);
    border-radius:var(--r-pill); padding:2px 8px; vertical-align:middle;
  }
  /* The batch body grows out of a 0fr grid track instead of appearing at full
     height. min-height:0 on the inner child is what lets the track shrink. */
  .bbody{
    display:grid; grid-template-rows:0fr; overflow:hidden; opacity:0;
    /* visibility keeps a collapsed batch out of the tab order, and because it
       flips only at the end of a transition it does not cut the close short */
    visibility:hidden;
    transition:grid-template-rows var(--t-slow), opacity var(--t), visibility var(--t-slow);
  }
  .bbody.open{ grid-template-rows:1fr; opacity:1; visibility:visible; }
  /* restoring a batch after a page redraw is not a user action; it must not play */
  .bbody.instant{ transition:none; }
  /* The clip shell carries no padding or border of its own: either one would
     count toward the grid track's minimum and leave a strip showing when the
     batch is closed. The visual box lives one level in. */
  .bbody-in{ min-height:0; overflow:hidden; }
  .bbody-pad{
    padding:var(--s3) var(--s4) var(--s4);
    border-top:1px solid var(--line); background:var(--soft);
  }
  .pager{ display:flex; align-items:center; justify-content:center; gap:var(--s3); margin-top:var(--s3); flex-wrap:wrap; }
  .pager-i{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pager-rows{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .pager-rows select{ height:24px; padding:0 24px 0 6px; font-size:11.5px; width:auto; }


  /* password reveal: the eye sits inside the field, so the field keeps its width */
  .pw-wrap{ position:relative; display:block; }
  .pw-wrap input{ padding-right:44px !important; }
  .pw-see{
    position:absolute; top:0; right:0; height:100%; width:40px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:0; padding:0; margin:0; cursor:pointer;
    color:var(--muted); border-radius:0; min-height:0;
  }
  .pw-see:hover{ color:var(--ink); }
  .pw-see:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:var(--r-sm); }
  .pw-see svg{ width:19px; height:19px; display:block; }
  .pw-see .pw-eye-off{ display:none; }
  .pw-see.on .pw-eye{ display:none; }
  .pw-see.on .pw-eye-off{ display:block; }

  /* ---------- tables ---------- */
  .twrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); }
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; }
  thead th{
    position:sticky; top:0; z-index:1; background:var(--paper);
    text-align:left; padding:8px 12px; font-size:10.5px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--faint);
    border-bottom:1px solid var(--line);
  }
  td{ padding:12px 12px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr{ transition:background var(--t); }
  tbody tr:hover{ background:var(--soft); }

  /* ---------- config popover ---------- */
  .cfg{ border-bottom:1px dotted var(--line-strong); cursor:help; transition:color var(--t), border-color var(--t); }
  .cfg:hover{ color:var(--accent-fg); border-bottom-color:var(--accent); }
  .pop{
    display:none; position:fixed; z-index:120; max-width:300px;
    background:var(--paper); border:1px solid var(--line-strong);
    border-radius:var(--r-md); box-shadow:var(--e3); padding:var(--s3) var(--s4);
    animation:pop var(--t) both;
  }
  .pop h3{ margin:0 0 var(--s2); padding-bottom:var(--s2); border-bottom:1px solid var(--line); font-size:13px; }
  .pop dl{ margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px var(--s3); }
  .pop dt{ font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); align-self:center; }
  .pop dd{ margin:0; font-size:12.5px; font-family:var(--font-num); }

  /* ---------- empty + skeleton ---------- */
  .empty{ text-align:center; padding:var(--s7) var(--s4); color:var(--muted); }
  .empty-ico{
    width:44px; height:44px; margin:0 auto var(--s3); border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center;
    background:var(--soft); border:1px solid var(--line); color:var(--faint);
  }
  .empty-ico svg{ width:22px; height:22px; }
  .skel{ background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);
    background-size:400% 100%; animation:shimmer 1.3s ease-in-out infinite; border-radius:var(--r-sm); }
  .skel-line{ height:12px; margin-bottom:var(--s2); }
  .skel-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s4); margin-bottom:var(--s3); }

  /* ---------- toasts + modal ---------- */
  .toast-stack{ position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
    z-index:200; display:flex; flex-direction:column; gap:var(--s2); align-items:center; pointer-events:none; }
  .toast{
    pointer-events:auto; background:var(--paper); color:var(--ink);
    border:1px solid var(--line-strong); border-left:3px solid var(--accent);
    border-radius:var(--r-sm); box-shadow:var(--e3);
    padding:12px var(--s4); font-size:13px; font-weight:600; max-width:88vw;
    animation:rise var(--t) both;
  }
  .toast.ok{ border-left-color:var(--ok); }
  .toast.bad{ border-left-color:var(--bad); }
  .modal-bg{
    position:fixed; inset:0; z-index:150; background:var(--scrim);
    display:flex; align-items:center; justify-content:center; padding:var(--s4);
    animation:fade var(--t) both;
  }
  .modal{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--e3); width:100%; max-width:440px; animation:pop var(--t-slow) both;
  }
  /* leaves the way it arrived, a touch quicker */
  .modal-bg.leaving{ animation:fadeOut 140ms cubic-bezier(.2,.6,.2,1) both; }
  .modal-bg.leaving .modal{ animation:popOut 140ms cubic-bezier(.2,.6,.2,1) both; }
  .modal-h{ padding:var(--s5) var(--s5) 0; }
  .modal-h h3{ margin:0; font-size:17px; letter-spacing:0; }
  .modal-h p{ margin:var(--s1) 0 0; font-size:12.5px; color:var(--muted); }
  .modal-b{ padding:var(--s4) var(--s5); }
  .modal-f{ padding:0 var(--s5) var(--s5); display:flex; gap:var(--s2); justify-content:flex-end; }
  .lookup-out{ margin-top:var(--s3); font-size:13px; }
  .lookup-out dl{ margin:var(--s2) 0 0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px var(--s3); }
  .lookup-out dt{ font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); align-self:center; }
  .lookup-out dd{ margin:0; font-family:var(--font-num); font-size:12.5px; }

  .staffbadge{
    font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-line);
    border-radius:var(--r-pill); padding:2px 8px;
  }
  .pickbox{ height:44px; font-size:14px; max-width:240px; width:auto; min-width:0; flex:0 1 auto; padding-right:var(--s5); }

  /* staff-only preview strip. It is a mode indicator, not customer identity,
     so it gets its own band under the header rather than crowding the brand. */
  #staffPick{
    display:flex; align-items:center; gap:var(--s2);
    padding:5px max(var(--s5), calc((100% - 2040px) / 2));
    background:var(--warn-bg); border-bottom:1px solid var(--warn-line);
  }
  #staffPick .staffbadge{ flex:0 0 auto; }
  /* a mode indicator, not a form: it stays out of the way */
  #staffPick .pickbox{
    height:28px; min-height:28px; font-size:12px; font-weight:500;
    padding:0 var(--s3); width:auto; max-width:260px;
  }

  /* drop the email before anything is forced to wrap */
  @media (max-width:1100px){ .who-em{ display:none; } .who #themeBtn{ margin-left:0; } .who #themeBtn::before{ display:none; } }

  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @keyframes pop{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:none; } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes fadeOut{ to{ opacity:0; } }
  @keyframes popOut{ to{ opacity:0; transform:scale(.98); } }
  @keyframes sheetIn{ from{ transform:translate3d(0,100%,0); } }
  @keyframes sheetOut{ to{ transform:translate3d(0,100%,0); } }
  @keyframes shimmer{ from{ background-position:100% 50%; } to{ background-position:0 50%; } }
  /* Reduced motion, gentler not zero: position changes go, opacity and color
     stay at their normal durations so entrances still read as entrances. */
  @media (prefers-reduced-motion: reduce){
    .login, .orow, .sumc, .rrow, .toast{ animation-name:fade; }
    .modal, .pop, .binv-b.fresh{ animation-name:fade; }
    .modal-bg.leaving .modal{ animation-name:fadeOut; }
    /* the batch opens instantly; only its opacity is still animated */
    .bbody{ transition:opacity var(--t), visibility var(--t-slow); }
    .orow:hover{ transform:none; }
    .orow:hover .chev{ transform:none; }
    .btn:active{ transform:none; }
    .skel{ animation:none; }
    #demoBar .demo-dot{ animation:none; }
  }

  @media (max-width:820px){
    html, body{ overflow-x:hidden; max-width:100%; }
    /* phones: scroll, but without the chrome taking up a stripe of the screen */
    html{ scrollbar-width:none; -ms-overflow-style:none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar{ width:0; height:0; }
    body{
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .wrap{ padding:var(--s5) 10px calc(var(--s7) + env(safe-area-inset-bottom)); }
    .card{ padding:16px 14px; }
    header.top{
      padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
      gap:var(--s2);
      align-items:stretch;
    }
    /* not sticky on a phone: the header is 117px and the content underneath
       matters more than the menu staying put */
    header.top{ flex-wrap:wrap; align-items:center; position:static; box-shadow:none; }
    .brand{ min-width:0; flex:1 1 0; gap:var(--s3); }
    /* "Order Portal · Customer" on one line under a smaller mark: the header
       was a third of the first screen */
    /* the header holds one row: round mark, page label, then three controls */
    header.top{ flex-wrap:nowrap; }
    .brand img.is-light, .brand img.is-dark,
    :root[data-theme="dark"] .brand img.is-light,
    :root[data-theme="dark"] .brand img.is-dark{ display:none; }
    .brand img.is-mark{ display:block; height:28px; width:28px; border-radius:50%; }
    :root[data-theme="dark"] .brand img.is-mark{ display:block; }
    .brand img{ height:24px; }
    #signOut{
      width:32px; height:32px; min-height:32px; padding:0; flex:0 0 auto;
      display:inline-flex; align-items:center; justify-content:center;
      border-radius:50% !important; background:var(--soft); border:1px solid var(--line);
      color:var(--muted);
    }
    #signOut .so-t{ display:none; }
    #signOut .so-ico{ display:block; }
    .brand > div{ padding-left:var(--s3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand b, .brand span{ display:inline; font-size:13px; }
    .brand span::before{ content:" \00b7 "; color:var(--faint); }
    .who{ width:auto; justify-content:flex-end; gap:var(--s2); flex-wrap:nowrap; flex:0 0 auto; }
    .who-em{ display:none; }
    .pmenu{ order:3; flex:1 1 100%; margin:var(--s1) 0 0; padding:3px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill); }
    .pmenu a{ flex:1; justify-content:center; padding:8px 12px; min-height:36px; }
    .pmenu a.on{ background:var(--paper); color:var(--ink); box-shadow:var(--e1); }
    #staffPick{ padding:5px var(--s4); gap:var(--s2); }
    #staffPick .pickbox{ flex:1 1 auto; width:auto; max-width:none; height:28px; min-height:28px; font-size:12px; }
    .orow{ grid-template-columns:minmax(0,1fr) auto; gap:var(--s2) var(--s3); }
    .orow > .ostat{ align-self:start; justify-content:flex-end; }
    .orow > div:nth-child(3){ grid-column:1 / -1; }
    .orow .chev{ display:none; }
    .orow .barlbl{ font-size:12.5px; }
    .sum{ grid-template-columns:repeat(2,1fr); }
    .sumc:last-child{ grid-column:1 / -1; }
    .sumv{ font-size:22px; }
    /* batch and status left, units and shipment right, store beneath, then
       the button. The street address waits in the details. */
    .bhead{
      grid-template-columns:max-content minmax(0,1fr); grid-template-areas:"no units" "dest dest" "acts acts";
      gap:var(--s1) var(--s3); padding:10px 14px;
    }
    .bhead > .bno{ flex-wrap:nowrap; }
    /* tracking is a tap away in the details; up here it only crowds the units */
    .bhead > .mono .trk-grp, .bhead > .mono .bdot{ display:none; }
    .bhead > .bno{ grid-area:no; }
    .bhead > div:nth-child(2){ grid-area:dest; }
    .bhead > div:nth-child(2) .sub{ display:none; }
    .bhead > .mono{ grid-area:units; text-align:right; }
    .bhead > .mono .bship{ justify-content:flex-end; }
    .bhead > div:last-child{ grid-area:acts; justify-self:stretch; }
    .bacts{ display:grid; grid-template-columns:1fr; gap:8px; }
    .bacts .btn{ width:100%; }
    /* rows in the expanded table: tighter, so thirty of them stay short */
    /* Three columns do not fit a phone. Each unit becomes two short lines:
       serial with the model under it, tracking on the right. */
    .bbody table, .bbody tbody, .bbody tr, .bbody td{ display:block; }
    .bbody thead{ display:none; }
    .bbody table{ font-size:12.5px; }
    .bbody tbody tr{
      display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 var(--s3); align-items:center;
      padding:8px 10px; border-bottom:1px solid var(--line);
    }
    .bbody tbody tr:last-child{ border-bottom:0; }
    .bbody td{ padding:0; border:0; width:auto; white-space:normal; overflow-wrap:anywhere; }
    .bbody td:nth-child(1){ grid-column:1; grid-row:1; font-weight:600; }
    .bbody td:nth-child(2){ grid-column:2; grid-row:1; font-size:12px; text-align:right; }
    .bbody td:nth-child(3){ grid-column:1 / -1; grid-row:2; font-size:12px; white-space:nowrap; }
    /* the master tag repeats on every row of a batch; the header already says it */
    .bbody .trk-tag{ display:none; }
    .pager-rows select{ height:32px; }
    .back .btn{ min-height:36px; }
    .btn{ min-height:36px; }
    .btn.sm{ min-height:36px; }
    .icon-btn{ width:32px; height:32px; min-height:32px; }
    h1{ font-size:21px; }
    /* top-biased, not dead-centre: the browser's own bottom bar makes a
       mathematically centred card read low on a phone */
    .login{ margin:0 auto; padding:7vh var(--s3) 48px; min-height:100dvh; display:flex; flex-direction:column; justify-content:flex-start; }
    .login .card{ padding:var(--s5) var(--s4); }
    .field input, .searchbox{ height:44px; min-height:44px; font-size:16px; max-width:100%; }
    .pickbox{ height:44px; min-height:44px; font-size:16px; }
    .toolbar{ flex-direction:column; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .toolbar .btn{ width:100%; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .modal-bg{ align-items:flex-end; padding:0; }
    .modal{
      max-width:none; border-bottom-left-radius:0; border-bottom-right-radius:0;
      max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain; animation:sheetIn 300ms cubic-bezier(.32,.72,0,1);
    }
    /* grabber: says the sheet can be pulled, and holds while it scrolls */
    .modal::before{
      content:""; display:block; position:sticky; top:0; z-index:2;
      width:36px; height:4px; margin:var(--s2) auto var(--s2);
      border-radius:var(--r-pill); background:var(--line-strong);
    }
    /* anchored to the bottom edge here, so it arrives and leaves along it */
    .modal-bg.leaving .modal{ animation:sheetOut 200ms cubic-bezier(.32,.72,0,1) both; }
    /* a sheet the finger already threw must not be re-animated on close */
    .modal-bg.sheet-dragged .modal{ animation:none !important; }
    @media (prefers-reduced-motion: reduce){
      .modal{ animation-name:fade; }
      .modal-bg.leaving .modal{ animation-name:fadeOut; }
    }
    .modal-f{ position:sticky; bottom:0; background:var(--paper);
      padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom)); }
    .modal-f .btn{ flex:1; }
    .toast-stack{ bottom:calc(var(--s4) + env(safe-area-inset-bottom)); width:calc(100% - 24px); }
    .twrap{ -webkit-overflow-scrolling:touch; }
    table{ font-size:13px; }
  }
  @media (max-width:420px){
    .sum{ grid-template-columns:1fr 1fr; }
  }
  @media print{
    header.top, .toolbar, .back, .btn, .icon-btn, .toast-stack{ display:none !important; }
    body{ background:#fff; }
    .card, .batch, .sumc{ box-shadow:none; border-color:#ccc; break-inside:avoid; }
    .bbody{ grid-template-rows:1fr !important; opacity:1 !important; overflow:visible !important; visibility:visible !important; }
    .bbody-pad{ background:#fff; }
    .pager{ display:none !important; }
    .orow{ animation:none; }
  }

  /* ============================================================
     Notion geometry. Controls are 8px rectangles; {rounded.full}
     is reserved for status badges and pill tabs, per the spec.
     ============================================================ */
  .btn, input:not([type="checkbox"]):not([type="radio"]), select, textarea, .rlook, .rnext{
    border-radius:var(--r-sm) !important;
  }
  .chip, .carrier, .storenum, .bar, .pipebar, .staffbadge, .btn.sm{ border-radius:var(--r-pill) !important; }
  .icon-btn{ border-radius:50% !important; }
  /* ============================================================
     DASHBOARD SHELL — matches the staff dashboard: a fixed rail on
     desktop, a bottom tab bar on phones, the same card language.
     ============================================================ */
  :root{ --rail:284px; --rail-mini:76px; }

  .siderail{ display:none; }
  body.authed{ padding-left:var(--rail); transition:padding-left var(--t); }
  body.authed.rail-mini{ padding-left:var(--rail-mini); }
  body.authed .siderail{
    display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0;
    width:var(--rail); z-index:31; background:var(--paper); border-right:1px solid var(--line); --rail-pad:var(--s3);
    padding:var(--s4) var(--s3) 0; overflow-y:auto; overscroll-behavior:contain;
    transition:width var(--t);
  }
  body.authed.rail-mini .siderail{ width:var(--rail-mini); padding-inline:var(--s2); --rail-pad:var(--s2); }

  .rail-head{
    display:flex; align-items:center; gap:var(--s2);
    padding:var(--s2) var(--s3) var(--s5); min-width:0;
  }
  .rail-brand{ display:flex; align-items:center; flex:1 1 auto; min-width:0; padding:0; overflow:hidden; }
/* expanded, the control sits with the logo; collapsed, it moves to the header */
  .rail-toggle{
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    width:32px; height:32px; min-height:32px; padding:0;
    border-radius:var(--r-sm); background:transparent; border:1px solid transparent;
    color:var(--muted); cursor:pointer;
    transition:background var(--t), color var(--t), border-color var(--t);
  }
  .rail-toggle:hover{ background:var(--soft); color:var(--ink); border-color:var(--line); }
  .rail-toggle:focus-visible{ outline:none; box-shadow:var(--ring); }
  .rail-toggle svg{ width:17px; height:17px; display:block; }
  .rail-toggle.in-rail{ color:var(--faint); }
  .rail-toggle.in-rail:hover{ color:var(--ink); }
  .rail-toggle.in-top{ margin-left:-6px; }
  body:not(.authed) .rail-toggle{ display:none; }
  body.authed.rail-mini .rail-toggle.in-rail{ display:none; }
  body.authed:not(.rail-mini) .rail-toggle.in-top{ display:none; }
  body.authed header.top .brand{ margin-left:var(--s2); }
  .rail-logo{ height:26px; width:auto; display:block; }
  /* the brand lines up with the page title in the top bar */
  body.authed .siderail{ padding-top:14px; }
  body.authed .rail-head{ padding-top:0; }

  .rail-logo.is-dark, .rail-logo.is-mark{ display:none; }
  :root[data-theme="dark"] .rail-logo.is-light{ display:none; }
  :root[data-theme="dark"] .rail-logo.is-dark{ display:block; }
  body.authed.rail-mini .rail-head{ justify-content:center; padding-inline:0; }
  body.authed.rail-mini .rail-brand{ justify-content:center; padding:0; }
  body.authed.rail-mini .rail-logo.is-light,
  body.authed.rail-mini .rail-logo.is-dark{ display:none; }
  body.authed.rail-mini .rail-logo.is-mark{ display:block; width:32px; height:32px; }

  body.authed .pmenu{ flex-direction:column; align-items:stretch; gap:2px; margin:0; }
  body.authed .pmenu a{
    padding:9px var(--s3); min-height:38px; font-size:13.5px; gap:var(--s3);
    border-radius:var(--r-sm) !important;
  }
  body.authed .pmenu a > svg{ width:19px; height:19px; flex:0 0 auto; }
  body.authed .pmenu a .nav-lbl{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
  body.authed .pmenu .pbadge{ margin-left:auto; }
  /* one indicator slides between rows instead of each row lighting up */
  .siderail .pmenu{ position:relative; }
  .nav-ind{
    position:absolute; left:calc(var(--rail-pad, var(--s3)) * -1); right:0; top:0; height:38px;
    background:var(--ink-deep); border-radius:0 var(--r-pill) var(--r-pill) 0;
    opacity:0; pointer-events:none; z-index:0; transition:none;
  }
  .nav-ind.ready{
    transition:transform 200ms cubic-bezier(.2,.7,.2,1), height 200ms cubic-bezier(.2,.7,.2,1),
               left var(--t), opacity 140ms linear;
  }
  @media (prefers-reduced-motion: reduce){ .nav-ind.ready{ transition:opacity 140ms linear; } }
  /* dark mode: the rail indicator and the wordmark share one soft off-white,
     so neither punches a hole in the dark chrome */
  :root[data-theme="dark"] .nav-ind{ background:var(--rail-ind, #d7dbe2); }
  :root[data-theme="dark"] .nav-logo.is-dark,
  :root[data-theme="dark"] .brand img.is-dark,
  :root[data-theme="dark"] .rail-logo.is-dark{ filter:brightness(.845); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]) .nav-ind{ background:var(--rail-ind, #d7dbe2); }
    :root:not([data-theme]) .nav-logo.is-dark,
    :root:not([data-theme]) .brand img.is-dark,
    :root:not([data-theme]) .rail-logo.is-dark{ filter:brightness(.845); }
  }

  .siderail .pmenu a{ position:relative; z-index:1; }
  /* the indicator carries the fill now, so the row itself stays clear */
  body.authed .siderail .pmenu a.on,
  body.authed .siderail .pmenu a.on:hover{ background:transparent; color:var(--on-ink); }
  body.authed.rail-mini .pmenu a{ justify-content:center; padding-inline:0; }
  body.authed.rail-mini .pmenu a .nav-lbl{ display:none; }
  body.authed.rail-mini .pmenu .pbadge{ position:absolute; top:2px; right:10px; margin:0; }

  .rail-foot{
    margin-top:auto; padding:var(--s3) var(--s3) var(--s4); border-top:1px solid var(--line);
    display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  }
  .rail-ver{ font-size:11.5px; color:var(--faint); }
  body.authed.rail-mini .rail-foot{ align-items:center; padding-inline:0; }
  body.authed.rail-mini .rail-ver{ display:none; }

  /* theme switch — the control states what it is, the track states where it is */
  .rail-theme{
    display:flex; align-items:center; gap:var(--s2); width:100%;
    padding:6px 8px; min-height:38px; border-radius:var(--r-sm);
    background:transparent; border:1px solid transparent; color:var(--muted);
    font-size:13px; font-weight:500; text-align:left; cursor:pointer;
    transition:background var(--t), color var(--t), border-color var(--t);
  }
  .rail-theme:hover{ background:var(--soft); color:var(--ink); border-color:var(--line); }
  .rail-theme:focus-visible{ outline:none; box-shadow:var(--ring); }
  .rt-ico{ display:flex; flex:0 0 auto; color:var(--faint); }
  .rail-theme:hover .rt-ico{ color:var(--ink); }
  .rt-ico svg{ width:17px; height:17px; display:block; }
  :root[data-theme="light"] .rt-ico .i-sun{ display:block; }
  :root[data-theme="light"] .rt-ico .i-moon{ display:none; }
  :root[data-theme="dark"] .rt-ico .i-sun{ display:none; }
  :root[data-theme="dark"] .rt-ico .i-moon{ display:block; }
  .rt-lbl{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rt-track{
    position:relative; flex:0 0 auto; width:38px; height:22px; border-radius:var(--r-pill);
    background:var(--line-strong); transition:background var(--t);
  }
  .rt-knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(10,21,48,.28); transition:transform var(--t);
  }
  :root[data-theme="dark"] .rt-track{ background:var(--accent); }
  :root[data-theme="dark"] .rt-knob{ transform:translateX(16px); }
  @media (prefers-reduced-motion: reduce){ .rt-knob{ transition:none; } }
  body.authed.rail-mini .rail-theme{ width:auto; justify-content:center; padding:6px; }
  body.authed.rail-mini .rt-lbl, body.authed.rail-mini .rt-track{ display:none; }
  body.authed.rail-mini .rt-ico svg{ width:19px; height:19px; }
  /* the rail owns the theme control once signed in; the login screen keeps its own */
  body.authed .who #themeBtn{ display:none; }

  .rail-btn{
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    width:34px; height:34px; min-height:34px; padding:0; margin-right:calc(var(--s3) * -1);
    border-radius:var(--r-sm); background:transparent; border:1px solid transparent;
    color:var(--muted); cursor:pointer; transition:background var(--t), color var(--t), border-color var(--t);
  }
  .rail-btn:hover{ background:var(--soft); color:var(--ink); border-color:var(--line); }
  .rail-btn svg{ width:18px; height:18px; display:block; }
  body:not(.authed) .rail-btn{ display:none; }
  body.authed header.top .brand{ margin-right:auto; }
  /* the rail carries the mark on desktop, so the header leads with the name */
  @media (min-width:701px){
    :root body.authed header.top .brand img{ display:none; }
    body.authed header.top .brand > div{ padding-left:0; }
    body.authed header.top .brand > div::before{ display:none; }
  }

  /* ---------- home ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--s4); margin-bottom:var(--s5); }
  .stat{
    display:flex; flex-direction:column; gap:var(--s2); padding:var(--s4b, 20px);
    border-radius:var(--r-md); text-decoration:none; color:inherit; cursor:pointer;
    background:color-mix(in srgb, var(--stat-hue, var(--accent)) 7%, var(--paper));
    border:1px solid color-mix(in srgb, var(--stat-hue, var(--accent)) 30%, var(--paper));
    transition:border-color var(--t), box-shadow var(--t), transform var(--t);
  }
  :root[data-theme="dark"] .stat{ background:color-mix(in srgb, var(--stat-hue, var(--accent)) 15%, var(--paper)); }
  @supports not (color: color-mix(in srgb, red, blue)){
    .stat{ background:var(--soft); border-color:var(--line-strong); }
  }
  @media (hover: hover) and (pointer: fine){
    .stat:hover{ transform:translateY(-2px); box-shadow:var(--e1);
      border-color:color-mix(in srgb, var(--stat-hue, var(--accent)) 55%, var(--paper)); }
  }
  .stat-top{ display:flex; align-items:center; gap:var(--s3); min-width:0; }
  .stat-ico{
    width:32px; height:32px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    border-radius:var(--r-sm); background:var(--paper); color:var(--stat-hue, var(--accent));
    border:1px solid color-mix(in srgb, var(--stat-hue, var(--accent)) 30%, var(--paper));
  }
  .stat-ico svg{ width:17px; height:17px; stroke-width:1.9; }
  .stat-lbl{ font-size:13px; font-weight:600; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat-val{ font-size:32px; font-weight:600; line-height:1.05; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .stat-sub{ font-size:12.5px; color:var(--faint); }
  .stat.tone-warn .stat-sub{ color:var(--warn-ink); font-weight:600; }
  .stat.tone-ok .stat-sub{ color:var(--ok); font-weight:600; }

  .dash-grid{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:var(--s4); margin-bottom:var(--s4); }
  .dash-grid > .card{ margin-bottom:0; display:flex; flex-direction:column; }
  .dash-grid .card > h2{ margin:0; }
  .dash-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4); }
  .dash-head h2{ margin:0; white-space:nowrap; }
  .dash-head .btn{ flex:0 0 auto; white-space:nowrap; }
  .dash-val{ font-size:30px; font-weight:600; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:var(--s2); }
  .dash-sub{ font-size:12.5px; color:var(--muted); }

  .hbars{ display:flex; align-items:flex-end; gap:5px; height:150px; margin-top:var(--s4); }
  .hbar-col{ flex:1 1 0; min-width:0; height:100%; display:flex; align-items:flex-end; }
  .hbar{
    width:100%; border-radius:var(--r-xs) var(--r-xs) 0 0; background:var(--accent); opacity:.88;
    transform-origin:bottom; animation:hbarGrow 420ms cubic-bezier(.2,.7,.2,1) backwards;
  }
  .hbar-col:hover .hbar{ opacity:1; }
  .hbar.zero{ background:var(--line); }
  @keyframes hbarGrow{ from{ transform:scaleY(0); } }
  .haxis{ display:flex; justify-content:space-between; margin-top:var(--s2); font-size:11.5px; color:var(--faint); }

  .dn-wrap{ position:relative; width:140px; height:140px; margin:var(--s5) auto var(--s4); }
  .dn{ display:block; width:140px; height:140px; }
  .dn-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; animation:dnPop 320ms ease-out 220ms backwards; }
  @keyframes dnPop{ from{ opacity:0; transform:scale(.92); } }
  .dn-center b{ font-size:26px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .dn-center span{ font-size:11.5px; color:var(--faint); }
  .dn-legend{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }
  .dn-item{ display:flex; align-items:center; gap:var(--s2); font-size:12.5px; min-width:0; }
  .dn-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .dn-l{ color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dn-n{ margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }

  .rc-list{ display:flex; flex-direction:column; margin-top:var(--s3); }
  .rc-row{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 152px 82px;
    align-items:center; gap:var(--s3); padding:11px 0; border-top:1px solid var(--line); cursor:pointer;
  }
  .rc-row:focus-visible{ outline:none; box-shadow:var(--ring); }
  .rc-row:first-child{ border-top:none; }
  .rc-inv{ font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
