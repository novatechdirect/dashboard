     rather than an error, so an unseeded corner of the app renders empty
     instead of breaking mid-demo. */
  function demoTable(name){
    if (!DEMO.db) DEMO.db = demoSeed();
    if (!DEMO.db[name]) DEMO.db[name] = [];
    return DEMO.db[name];
  }

  function demoFrom(name){
    let filters = [], ord = null, lim = null, one = false, maybe = false;
    let mode = 'select', payload = null, conflict = null;
    const add = function(op, col, val){ filters.push({ op: op, col: col, val: val }); return api; };
    /* The signed-in person is real; the fixture rows are not. Matching them on
       user_id would always fail, so identity lookups ignore that filter and
       answer with the demo operator. */
    const loose = (name === 'staff' || name === 'customer_users');
    const match = function(row){
      return filters.every(function(f){
        if (loose && f.col === 'user_id') return true;
        const v = row[f.col];
        switch (f.op){
          case 'eq':   return String(v) === String(f.val);
          case 'neq':  return String(v) !== String(f.val);
          case 'in':   return (f.val || []).some(function(x){ return String(x) === String(v); });
          case 'is':   return f.val === null ? (v === null || v === undefined) : v === f.val;
          case 'notis':return f.val === null ? (v !== null && v !== undefined) : v !== f.val;
          case 'gt':   return v > f.val;
          case 'gte':  return v >= f.val;
          case 'lt':   return v < f.val;
          case 'lte':  return v <= f.val;
          case 'like': case 'ilike': {
            const re = new RegExp('^' + String(f.val).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*') + '$', 'i');
            return re.test(String(v == null ? '' : v));
          }
          default: return true;
        }
      });
    };
    const stamp = function(row){
      const out = Object.assign({}, row);
      if (out.id === undefined) out.id = demoId(name);
      if (out.created_at === undefined) out.created_at = new Date().toISOString();
      return out;
    };
    const run = function(){
      const tbl = demoTable(name);
      let out = [];
      if (mode === 'select'){
        out = tbl.filter(match);
        if (ord){
          out = out.slice().sort(function(x, y){
            const a = x[ord.col], b = y[ord.col];
            if (a === b) return 0;
            if (a === null || a === undefined) return 1;
            if (b === null || b === undefined) return -1;
            return (a > b ? 1 : -1) * (ord.asc ? 1 : -1);
          });
        }
        if (lim != null) out = out.slice(0, lim);
      } else if (mode === 'insert'){
        const rows = (Array.isArray(payload) ? payload : [payload]).map(stamp);
        rows.forEach(function(r){ tbl.push(r); });
        out = rows;
      } else if (mode === 'update'){
        out = tbl.filter(match);
        out.forEach(function(r){ Object.assign(r, payload); });
      } else if (mode === 'upsert'){
        const rows = Array.isArray(payload) ? payload : [payload];
        const keys = (conflict || 'id').split(',').map(function(s){ return s.trim(); });
        out = rows.map(function(r){
          const hit = tbl.find(function(x){ return keys.every(function(k){ return String(x[k]) === String(r[k]); }); });
          if (hit){ Object.assign(hit, r); return hit; }
          const fresh = stamp(r); tbl.push(fresh); return fresh;
        });
      } else if (mode === 'delete'){
        out = tbl.filter(match);
        DEMO.db[name] = tbl.filter(function(r){ return !match(r); });
      }
      if (one || maybe){
        return { data: out[0] || null, error: (one && !out.length) ? { message: 'No rows returned', code: 'PGRST116' } : null };
      }
      return { data: out, error: null };
    };
    const api = {
      select: function(){ return api; },
      insert: function(v){ mode = 'insert'; payload = v; return api; },
      update: function(v){ mode = 'update'; payload = v; return api; },
      upsert: function(v, o){ mode = 'upsert'; payload = v; conflict = o && o.onConflict; return api; },
      delete: function(){ mode = 'delete'; return api; },
      eq: function(c, v){ return add('eq', c, v); },
      neq: function(c, v){ return add('neq', c, v); },
      in: function(c, v){ return add('in', c, v); },
      is: function(c, v){ return add('is', c, v); },
      gt: function(c, v){ return add('gt', c, v); },
      gte: function(c, v){ return add('gte', c, v); },
      lt: function(c, v){ return add('lt', c, v); },
      lte: function(c, v){ return add('lte', c, v); },
      like: function(c, v){ return add('like', c, v); },
      ilike: function(c, v){ return add('ilike', c, v); },
      not: function(c, op, v){ return add(op === 'is' ? 'notis' : 'neq', c, v); },
      or: function(){ return api; },
      limit: function(n){ lim = n; return api; },
      range: function(f, t){ lim = t + 1; return api; },
      order: function(c, o){ ord = { col: c, asc: !(o && o.ascending === false) }; return api; },
      single: function(){ one = true; return api; },
      maybeSingle: function(){ maybe = true; return api; },
      then: function(res, rej){ return Promise.resolve(run()).then(res, rej); }
    };
    return api;
  }

  /* ---- functions ----
     The ones the screens need, answered from the fixtures. Everything else
     succeeds quietly: a demo should never show an error the real app would
     not show. */
  function demoRpc(name, args){
    args = args || {};
    if (!DEMO.db) DEMO.db = demoSeed();
    const db = DEMO.db;
    const paidOn = function(id){
      return db.order_payments.filter(function(p){ return String(p.order_id) === String(id); })
        .reduce(function(s, p){ return s + Number(p.amount || 0); }, 0);
    };
    const invRow = function(o){
      const paid = paidOn(o.id);
      const total = o.invoice_total == null ? null : Number(o.invoice_total);
      const bal = total == null ? null : total - paid;
      const late = (!o.due_date || total == null || bal <= 0.005) ? 0
        : Math.max(0, Math.round((Date.now() - new Date(o.due_date + 'T12:00:00').getTime()) / 86400000));
      return {
        order_id: o.id, invoice_no: o.invoice_no, po_number: o.po_number, created_at: o.created_at,
        due_date: o.due_date, invoice_total: total, paid: paid, balance: bal, days_late: late,
        held: !!o.hold_until_paid,
        state: total == null ? 'unpriced' : bal <= 0.005 ? 'paid'
             : late > 0 ? 'overdue' : paid > 0.005 ? 'part paid' : 'open',
        has_pdf: false,
        docs: db.order_customer_docs.filter(function(d){ return String(d.order_id) === String(o.id); }).length
      };
    };
    const invoices = function(){ return db.orders.map(invRow); };
    const ok = function(data){ return Promise.resolve({ data: data === undefined ? null : data, error: null }); };

    switch (name){
      case 'order_billing': {
        const o = db.orders.find(function(x){ return String(x.id) === String(args.p_order); });
        if (!o) return ok([]);
        const r = invRow(o);
        return ok([{ invoice_total: r.invoice_total, paid: r.paid, balance: r.balance,
                     due_date: r.due_date, hold_until_paid: r.held, days_late: r.days_late }]);
      }
      case 'order_payments_for':
      case 'portal_billing_payments':
        return ok(db.order_payments.filter(function(p){ return String(p.order_id) === String(args.p_order); })
          .map(function(p){ return { id: p.id, paid_on: p.paid_on, amount: p.amount, method: p.method, note: p.note }; }));
      case 'order_docs_for':
        return ok(db.order_documents.filter(function(d){ return String(d.order_id) === String(args.p_order); }));
      case 'portal_billing_invoices':
        return ok(invoices().sort(function(a, b){ return (b.due_date || '') < (a.due_date || '') ? -1 : 1; }));
      case 'portal_billing_summary': {
        const inv = invoices(), owed = inv.filter(function(r){ return Number(r.balance || 0) > 0.005; });
        const sum = function(f){ return owed.filter(f).reduce(function(s, r){ return s + Number(r.balance || 0); }, 0); };
        const dated = owed.filter(function(r){ return r.due_date; }).sort(function(a, b){ return a.due_date < b.due_date ? -1 : 1; });
        return ok([{
          invoiced: inv.reduce(function(s, r){ return s + Number(r.invoice_total || 0); }, 0),
          paid: inv.reduce(function(s, r){ return s + Number(r.paid || 0); }, 0),
          outstanding: sum(function(){ return true; }),
          overdue: sum(function(r){ return r.days_late > 0; }),
          open_count: owed.length,
          next_due_date: dated.length ? dated[0].due_date : null,
          next_due_amount: dated.length ? dated[0].balance : null,
          b_current: sum(function(r){ return r.days_late === 0; }),
          b_1_30: sum(function(r){ return r.days_late >= 1 && r.days_late <= 30; }),
          b_31_60: sum(function(r){ return r.days_late >= 31 && r.days_late <= 60; }),
          b_61_90: sum(function(r){ return r.days_late >= 61 && r.days_late <= 90; }),
          b_90_plus: sum(function(r){ return r.days_late > 90; })
        }]);
      }
      case 'portal_billing_series':
      case 'portal_billing_paid_series': {
        const months = Math.min(36, Math.max(1, Number(args.p_months || 12)));
        const out = [];
        for (let i = months - 1; i >= 0; i--){
          const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
          const key = d.toISOString().slice(0, 7);
          const paid = db.order_payments
            .filter(function(p){ return String(p.paid_on || '').slice(0, 7) === key; })
            .reduce(function(s, p){ return s + Number(p.amount || 0); }, 0);
          const invoiced = db.orders
            .filter(function(o){ return String(o.created_at || '').slice(0, 7) === key; })
            .reduce(function(s, o){ return s + Number(o.invoice_total || 0); }, 0);
          const units = db.batches
            .filter(function(b){ return b.status === 'shipped' && String(b.ship_date || '').slice(0, 7) === key; })
            .reduce(function(s, b){ return s + db.pc_log.filter(function(u){ return String(u.batch_id) === String(b.id); }).length; }, 0);
          out.push({ month: key + '-01', paid: paid, invoiced: invoiced, units: units });
        }
        return ok(out);
      }
      case 'order_notes_list':
        return ok(db.order_notes
          .filter(function(n){ return String(n.order_id) === String(args.p_order); })
          .sort(function(a, b){ return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (a.created_at < b.created_at ? -1 : 1); }));
      case 'order_note_post': {
        const id = demoId('note');
        db.order_notes.push({
          id: id, order_id: args.p_order, body: args.p_body,
          audience: args.p_audience || 'shared', side: DEMO_SIDE, pinned: !!args.p_pinned,
          author_name: args.p_author || (DEMO_SIDE === 'staff' ? 'Novatech' : 'Demo Gaming Co'),
          created_at: new Date().toISOString(), mine: true
        });
        return ok(id);
      }
      case 'order_note_delete':
        db.order_notes = db.order_notes.filter(function(n){ return String(n.id) !== String(args.p_note); });
        return ok();
      case 'order_note_counts':
        return ok(Object.values(db.order_notes.reduce(function(acc, n){
          const k = String(n.order_id);
          acc[k] = acc[k] || { order_id: n.order_id, notes: 0, last_at: null };
          acc[k].notes++; if (!acc[k].last_at || n.created_at > acc[k].last_at) acc[k].last_at = n.created_at;
          return acc;
        }, {})));
      case 'alloc_serials': {
        const n = Number(args.p_count || args.count || 1);
        const seq = db.serial_sequences[0] || { next_serial: 900 };
        const out = [];
        for (let i = 0; i < n; i++) out.push({ serial: 'DG-' + String(seq.next_serial + i).padStart(6, '0') });
        seq.next_serial += n;
        return ok(out);
      }
      case 'reclaim_serials': return ok();
      case 'serial_floor': return ok(500);
      case 'next_batch_no': {
        const mine = db.batches.filter(function(b){ return String(b.order_id) === String(args.p_order); });
        return ok(mine.reduce(function(m, b){ return Math.max(m, Number(b.batch_no || 0)); }, 0) + 1);
      }
      case 'email_log_recent': {
        let rows = (db._email_log || []).slice();
        if (args.p_kind) rows = rows.filter(function(x){ return x.kind === args.p_kind; });
        rows.sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; });
        return ok(rows.slice(0, Number(args.p_limit || 25)));
      }
      case 'portal_set_po_number': {
        const o = db.orders.find(function(x){ return String(x.id) === String(args.p_order); });
        if (o) o.po_number = args.p_po || null;
        return ok(o ? [o] : []);
      }
      case 'rma_secret_status': return ok([{ key: 'resend_api_key', is_set: true }]);
      case 'is_margin_admin': return ok(true);
      case 'find_user_by_email': return ok([]);
      case 'portal_remittance_notice': return ok();
      case 'rma_discord_test': case 'rma_email_test': case 'order_email_test':
        return ok({ ok: true, demo: true });
      default:
        return ok([]);
    }
  }

  /* ---------- theme ---------- */
  function setTheme(t, remote){
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    try { localStorage.setItem('ntTheme', t); } catch(e){}
    /* the preference belongs to the person, not the browser: it rides along on
       their account so a new device opens in the mode they chose */
    if (remote){
      try { if (SB && SB.auth && session && session.user) SB.auth.updateUser({ data: { theme: t } }); } catch(e){}
    }
    const metas = document.querySelectorAll('meta[name="theme-color"]');
    metas.forEach(function(m){
      if (!m.getAttribute('media')) m.setAttribute('content', t === 'dark' ? '#0e1116' : '#ffffff');
    });
    const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (bar) bar.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
    const sw = $('themeSwitch');
    if (sw) sw.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
  }
  function toggleTheme(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  }
  /* whatever the account last chose wins over this browser's copy */
  function applyAccountTheme(s){
    const t = s && s.user && s.user.user_metadata && s.user.user_metadata.theme;
    if ((t === 'dark' || t === 'light') && document.documentElement.getAttribute('data-theme') !== t) setTheme(t);
  }
  ['themeBtn','themeBtn2','themeSwitch'].forEach(function(id){
    const b = $(id); if (b) b.addEventListener('click', toggleTheme);
  });
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

  /* ---------- toast ---------- */
  function toast(msg, kind, ms){
    const stack = $('toastStack'); if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity 200ms, transform 200ms';
      el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
      setTimeout(function(){ el.remove(); }, 220);
    }, ms || 4000);
  }

  /* ---------- modal ---------- */
  let modalBg = null;
  let confirmResolve = null;
  function closeModal(){
    if (modalBg){
      const el = modalBg; modalBg = null;
      el.removeAttribute('id');
      /* drop any animation:none a drag left behind, so the class below starts
         the exit rather than losing to an inline override */
      const sh = el.querySelector('.modal');
      if (sh) sh.style.animation = '';
      el.classList.add('leaving');
      setTimeout(function(){ el.remove(); }, 140);
    }
    if (confirmResolve){ const r = confirmResolve; confirmResolve = null; r(false); }
  }
  /* Replaces the browser's confirm(). The verb the question opens with
     becomes the button. */
  function pConfirm(text){
    const parts = String(text || '').split(/\n\s*\n/);
    const title = parts[0].trim(), body = parts.slice(1).join(' ').trim();
    const first = (title.match(/^([A-Z][a-z]+)/) || [])[1] || '';
    const cta = /^(Delete|Remove|Cancel|Stop|Clear)$/.test(first) ? first : 'Yes';
    return new Promise(function(resolve){
      const bg = openModal(
        '<div class="modal-h"><h2>' + esc(title) + '</h2>' + (body ? '<p>' + esc(body) + '</p>' : '') + '</div>' +
        '<div class="modal-f"><button class="btn" id="pcNo" type="button">' + (first === 'Cancel' ? 'Keep it' : 'Go back') + '</button>' +
        '<button class="btn primary" id="pcYes" type="button">' + esc(cta) + '</button></div>');
      confirmResolve = resolve;
      bg.querySelector('#pcNo').addEventListener('click', closeModal);
      bg.querySelector('#pcYes').addEventListener('click', function(){ confirmResolve = null; closeModal(); resolve(true); });
      setTimeout(function(){ const b = bg.querySelector('#pcNo'); if (b) b.focus(); }, 30);
    });
  }
  function openModal(html){
    closeModal();
    modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.id = 'modalBg';
    modalBg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    let downOnBg = false;
    /* A selection drag that starts in the modal and ends on the backdrop
       still lands its click there. Closing on that wiped the form, which is
       why it looked tied to copy and paste. Press and release must both be
       on the backdrop. */
    modalBg.addEventListener('mousedown', function(e){ downOnBg = (e.target === modalBg); });
    modalBg.addEventListener('click', function(e){
      if (e.target === modalBg && downOnBg) closeModal();
      downOnBg = false;
    });
    document.body.appendChild(modalBg);
    const first = modalBg.querySelector('input, button');
    if (first) first.focus();
    return modalBg;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

  async function init(){
    demoBanner();
    if (!SB){ $('loginErr').textContent = 'Could not load the sign-in library. Check your connection and refresh.'; return; }
    const { data } = await SB.auth.getSession();
    session = data.session;
    applyAccountTheme(session);
    let authUid = session && session.user ? session.user.id : null;
    /* Token refreshes and refocus both fire here. Re-rendering on them sent
       the customer back to the order list mid-task. */
    SB.auth.onAuthStateChange(function(_e, s){
      const uid = s && s.user ? s.user.id : null;
      session = s;
      applyAccountTheme(s);
      if (uid === authUid) return;
      authUid = uid; render();
    });
    render();
  }
  async function render(){
    /* the answer is in: stop holding the frame and remember it for next time */
    document.documentElement.classList.remove('nt-boot');
    try { localStorage.setItem('ntWasAuthed', session ? '1' : '0'); } catch(e){}
    if (!session){
      document.body.classList.remove('authed');
      $('loginView').style.display = '';
      $('app').style.display = 'none';
      $('topbar').style.display = 'none';
      return;
    }
    $('loginView').style.display = 'none';
    $('whoEmail').textContent = session.user.email || '';
    const cu = await SB.from('customer_users').select('*').eq('user_id', session.user.id).limit(1);
    me = (cu.data || [])[0];
    canBill = !!(me && me.can_view_billing);

    if (!me || !me.active){
      /* Not a customer login. NovaTech staff can still open this page to see
         exactly what a customer sees, so check the roster before refusing. */
      const st = await SB.from('staff')
        .select('name,active,can_view_orders,can_manage_orders,can_admin_orders,is_admin')
        .eq('user_id', session.user.id).limit(1);
      const r = (st.data || [])[0];
      const staffOk = r && r.active &&
        (r.can_view_orders || r.can_manage_orders || r.can_admin_orders || r.is_admin);
      if (staffOk){
        isStaff = true;
        const cs = await SB.from('customers').select('*').eq('active', true).order('name');
        allCustomers = cs.data || [];
        if (!allCustomers.length){
          $('app').style.display = ''; $('topbar').style.display = '';
          $('listView').innerHTML = '<div class="card"><h1>No customers yet</h1>' +
            '<p class="muted">Add one in the dashboard\u2019s Admin page first.</p></div>';
          return;
        }
        if (!viewAs){
          /* the dashboard links here with ?as=<customer> so the ticket or order it points at is in view */
          const asP = new URLSearchParams(location.search || '').get('as');
          const hit = asP ? allCustomers.find(function(c){ return String(c.id) === asP; }) : null;
          viewAs = hit ? hit.id : allCustomers[0].id;
        }
        me = { customer_id: viewAs };
        $('app').style.display = ''; $('topbar').style.display = '';
        await load();
        return;
      }
      $('app').style.display = '';
      $('topbar').style.display = '';
      $('custName').textContent = '';
      $('listView').innerHTML = '<div class="card"><h1>Not set up yet</h1>' +
        '<p class="muted">This login is not linked to a customer account. Ask your NovaTech contact to enable it.</p></div>';
      $('detailView').style.display = 'none';
      return;
    }
    $('app').style.display = '';
    $('topbar').style.display = '';
    await load();
  }
  /* show the password, because a mistyped one is the commonest sign-in failure */

      '<svg viewBox="0 0 24 24" class="pw-eye-off" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4L20 20"/><path d="M9.9 5.8A9.6 9.6 0 0 1 12 5.5C18 5.5 21.5 12 21.5 12a16 16 0 0 1-2.6 3.3"/><path d="M6.6 7.7A16.4 16.4 0 0 0 2.5 12S6 18.5 12 18.5a9.7 9.7 0 0 0 3.1-.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g></svg>';
    btn.addEventListener('click', function(){
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('on', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.setAttribute('title', show ? 'Hide password' : 'Show password');

  $('go').addEventListener('click', signIn);
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') signIn(); });

  async function signIn(){
    const err = $('loginErr'); err.textContent = '';
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Signing in\u2026';
    const r = await SB.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (r.error) err.textContent = r.error.message || 'Could not sign in.';
  }
  $('signOut').addEventListener('click', function(){ SB.auth.signOut(); });

  /* ---------- data ---------- */
  async function load(){
    $('listView').innerHTML =
      '<div class="page-head"><h1>Your orders</h1></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:32%"></div>' +
        '<div class="skel skel-line" style="width:64%"></div></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:28%"></div>' +
        '<div class="skel skel-line" style="width:55%"></div></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:36%"></div>' +
        '<div class="skel skel-line" style="width:48%"></div></div>';
    const [c, o, cf, lo] = await Promise.all([
      SB.from('customers').select('*').eq('id', me.customer_id).limit(1),
      SB.from('orders').select('*').eq('customer_id', me.customer_id).eq('archived', false).order('created_at', { ascending:false }),
      SB.from('configs').select('*').eq('customer_id', me.customer_id),
      SB.from('ship_to_locations').select('*').eq('customer_id', me.customer_id)
    ]);
    customer = (c.data || [])[0];
    orders = o.data || [];
    configs = cf.data || [];
    locations = lo.data || [];
    $('custName').textContent = customer ? customer.name : '';
    const pick = $('staffPick');
    if (isStaff && pick){
      pick.style.display = '';
      pick.innerHTML = '<span class="staffbadge">Staff preview</span> ' +
        '<select id="viewAs" class="pickbox">' + allCustomers.map(function(c){
          return '<option value="' + esc(c.id) + '"' + (c.id === viewAs ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }).join('') + '</select>';
      $('viewAs').addEventListener('change', async function(){
        viewAs = this.value;
        me = { customer_id: viewAs };
        currentId = null; query = ''; setUrl(null);
        billState = 'idle'; billSum = null; billInv = []; billSeries = [];
        billPays = {}; billDocs = {}; billOpen = null;
        $('detailView').style.display = 'none';
        await load();
      });
    }
    const ids = orders.map(function(x){ return x.id; });
    if (ids.length){
      const [ln, ba, un] = await Promise.all([
        SB.from('order_lines').select('*').in('order_id', ids).order('position'),
        SB.from('batches').select('*').in('order_id', ids).order('batch_no'),
        SB.from('pc_log').select('id,serial,order_id,batch_id,config_id,unit_status').in('order_id', ids).order('serial')
      ]);
      lines = ln.data || []; batches = ba.data || []; units = un.data || [];
      const bids = batches.map(function(b){ return b.id; });
      if (bids.length){
        const tr = await SB.from('batch_tracking').select('*').in('batch_id', bids);
        tracking = tr.data || [];
      } else tracking = [];
    } else { lines = []; batches = []; units = []; tracking = []; }
    await loadRma();
    const wantR = readRmaLink();
    if (wantR){ pview = 'rmas'; }
    renderList();
    const want = readLink();
    if (want && orders.some(function(o){ return o.id === want; })) openOrder(want);
    else if (want) toast('That order is not on your account.', 'bad', 6000);
    if (wantR){
      if (rmaTickets.some(function(t){ return t.id === wantR; })) openRma(wantR);
      else toast('That RMA is not on your account.', 'bad', 6000);
    }
  }
  async function loadRma(){
    try {
      const cid = me.customer_id;
      const r = await Promise.all([
        SB.from('rma_tickets').select('*').eq('customer_id', cid).order('created_at', { ascending:false }),
        SB.from('customer_contacts').select('*').eq('customer_id', cid),
        SB.from('app_settings').select('*').eq('key', 'rma_return_address')
      ]);
      rmaTickets = r[0].data || []; rmaContacts = r[1].data || [];
      const ra = (r[2].data || [])[0]; rmaReturnAddress = ra ? (ra.value || '') : '';
      const ids = rmaTickets.map(function(t){ return t.id; });
      if (ids.length){
        const s = await Promise.all([
          SB.from('rma_parts').select('*').in('rma_id', ids).order('created_at'),
          SB.from('rma_shipments').select('*').in('rma_id', ids).order('created_at'),
          SB.from('rma_comments').select('*').in('rma_id', ids).eq('internal', false).order('created_at'),
          SB.from('rma_attachments').select('*').in('rma_id', ids).order('created_at'),
          SB.from('rma_events').select('*').in('rma_id', ids).order('created_at')
        ]);
        rmaParts = s[0].data || []; rmaShipments = s[1].data || []; rmaComments = s[2].data || [];
        rmaAttachments = s[3].data || []; rmaEvents = s[4].data || [];
      } else { rmaParts = []; rmaShipments = []; rmaComments = []; rmaAttachments = []; rmaEvents = []; }
    } catch(e){ rmaTickets = []; }
  }

  /* ---------- helpers ---------- */
  function cfgById(id){ return configs.find(function(c){ return c.id === id; }); }
  function specLines(cfg){
    if (!cfg) return [];
    const sticks = cfg.ram_sticks || 1;
    const ramBase = String(cfg.ram || '').replace(/^ram\s+/i, '').trim();
    const caseN = String(cfg.pc_case || '').replace(/\s*\bcases?\b\s*/ig, ' ').replace(/\s+/g, ' ').trim();
    return [['Case', caseN], ['CPU', (cfg.cpu||'').trim()], ['GPU', (cfg.gpu||'').trim()],
            ['RAM', ramBase ? ((sticks > 1 ? sticks + 'x ' : '') + ramBase) : ''],
            ['Storage', (cfg.storage||'').trim()]]
      .filter(function(p){ return p[1]; });
  }
  function stats(o){
    const mine = units.filter(function(u){ return u.order_id === o.id; });
    const ordered = lines.filter(function(l){ return l.order_id === o.id; })
      .reduce(function(a,l){ return a + (+l.qty_ordered||0); }, 0);
    let b=0,a=0,s=0;
    mine.forEach(function(u){
      if (u.unit_status === 'shipped') s++; else if (u.unit_status === 'assigned') a++; else b++;
    });
    return { ordered:ordered, built:b, assigned:a, shipped:s, made:b+a+s, remaining:Math.max(0, ordered-(b+a+s)) };
  }
  function statusOf(st){
    if (st.made === 0) return { c:'n', l:'Not started' };
    if (st.shipped > 0 && st.ordered > 0 && st.shipped >= st.ordered) return { c:'k', l:'Complete' };
    if (st.shipped > 0) return { c:'i', l:'Partially shipped' };
    if (st.remaining === 0) return { c:'w', l:'Awaiting shipment' };
    return { c:'n', l:'In production' };
  }
  function trackUrl(carrier, n){
    const e = encodeURIComponent(String(n||'').trim());
    if (!e) return '';
    switch (String(carrier||'').trim().toLowerCase()){
      case 'ups':   return 'https://www.ups.com/track?loc=en_US&requester=QUIC&tracknum=' + e;
      case 'fedex': return 'https://www.fedex.com/fedextrack/?trknbr=' + e;
      case 'usps':  return 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + e;
      default: return '';
    }
  }
  /* Carrier mark. Looks for a real logo at carriers/<slug>.png and falls back to
     the typographic badge when the file is absent — so Freight and Other, which
     have no logo, keep reading as text. */
  function carrierBadge(carrier){
    const c = String(carrier || '').trim();
    if (!c) return '';
    const k = c.toLowerCase();
    const slug = k.replace(/[^a-z0-9]+/g, '');
    const short = k === 'fedex' ? 'FDX' : k === 'freight' ? 'FRT' : k === 'other' ? 'SHIP' : c.toUpperCase();
    return '<span class="carrier" title="' + esc(c) + '">' +
      '<img src="carriers/' + esc(slug) + '.png" alt="' + esc(c) + '"' +
        ' onload="this.closest(\'.carrier\').classList.add(\'has-logo\')"' +
        ' onerror="this.remove()">' +
      '<i>' + esc(short) + '</i></span>';
  }
  /* A master number covers the whole batch; a unit number is that box alone.
     The distinction matters when a customer rings the carrier, so it is marked
     — quietly, because most of the time it is the same story either way. */
  function trkTag(isMaster){
    return isMaster
      ? '<span class="trk-tag" title="One number for the whole shipment">master</span>'
      : '';
  }
  function trackHtml(carrier, nums){
    const list = (Array.isArray(nums) ? nums : [nums]).filter(Boolean);
    if (!list.length) return '<span class="muted">\u2014</span>';
    return list.map(function(n){
      const u = trackUrl(carrier, n);
      return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(n) + '</a>' : esc(n);
    }).join(', ');
  }
  /* the destination lives on ship_to_locations, not on the batch */
  function locOf(b){ return b && b.location_id ? locations.find(function(l){ return l.id === b.location_id; }) : null; }
  function locName(b){
    const l = locOf(b);
    return l ? l.store_name : 'Destination to be confirmed';
  }
  function locNum(b){ const l = locOf(b); return (l && l.store_number) ? l.store_number : ''; }
  function locLine(b){
    const l = locOf(b);
    if (!l) return '';
    return [l.address1, l.address2, [l.city, l.state].filter(Boolean).join(', '), l.zip].filter(Boolean).join(' \u00b7 ');
  }

  /* ---------- list ---------- */
  /* Everything still in flight, summed across open orders. Complete orders
     drop out, so the total answers "what is left on my account". Stage order
     runs least to most advanced, matching the detail page's stat cards. */
  let pipeShown = null;
  function pipeHtml(){
    let toBuild = 0, built = 0, prep = 0, shipped = 0, open = 0;
    orders.forEach(function(o){
      const st = stats(o);
      if (st.ordered > 0 && st.shipped >= st.ordered) return;
      open++;
      toBuild += st.remaining; built += st.built; prep += st.assigned; shipped += st.shipped;
    });
    const total = toBuild + built + prep + shipped;
    if (!open || !total) return '';
    const segs = [
      { l:'Shipped',           n:shipped, c:'var(--ok)' },
      { l:'Preparing to ship', n:prep,    c:'var(--info)' },
      { l:'Ready to assign',   n:built,   c:'var(--accent)' },
      { l:'Remaining to build',n:toBuild, c:'var(--line-strong)', k:'rem' }
    ];
    return '<div class="card">' +
      '<h2>Pipeline <span class="subtle">across your open orders</span></h2>' +
      '<div class="pipev">' + num(total) + '</div>' +
      '<div class="pipes">units in ' + open + ' open order' + (open === 1 ? '' : 's') +
        (toBuild ? ' \u00b7 ' + num(toBuild) + ' left to build' : ' \u00b7 all built') + '</div>' +
      '<div class="pipebar">' + segs.map(function(s){
        return s.n ? '<i class="' + (s.k || '') + '" style="width:' + (s.n/total*100) + '%;background:' + s.c + '" title="' +
                     s.l + ': ' + num(s.n) + '"></i>' : '';
      }).join('') + '</div>' +
      '<div class="pipeleg">' + segs.map(function(s){
        return '<div class="pipeit"><span class="pipedot" style="background:' + s.c + '"></span>' +
               '<span class="pipel">' + s.l + '</span><span class="pipen">' + num(s.n) + '</span></div>';
      }).join('') + '</div></div>';
  }

  function pUnitTotals(){
    const t = { ordered:0, shipped:0, assigned:0, built:0, remaining:0 };
    orders.forEach(function(o){
      const st = stats(o);
      t.ordered += st.ordered; t.shipped += st.shipped;
      t.assigned += st.assigned; t.built += st.built; t.remaining += st.remaining;
    });
    return t;
  }
  function pOpenOrders(){
    return orders.filter(function(o){ const st = stats(o); return !(st.ordered > 0 && st.shipped >= st.ordered); });
  }
  function pStat(hue, ico, lbl, val, sub, tone, goto_){
    return '<a class="stat' + (tone ? ' tone-' + tone : '') + '" style="--stat-hue:' + hue + '"' +
      (goto_ ? ' data-pview="' + goto_ + '" role="button" tabindex="0"' : '') + '>' +
      '<span class="stat-top"><span class="stat-ico">' + ico + '</span><span class="stat-lbl">' + lbl + '</span></span>' +
      '<span class="stat-val">' + val + '</span><span class="stat-sub">' + sub + '</span></a>';
  }
  /* shipped units by calendar month, last twelve */
  function pShipMonths(n){
    const out = [], now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth() - (n - 1), 1);
    for (let i = 0; i < n; i++) out.push({ x:new Date(start.getFullYear(), start.getMonth() + i, 1), y:0 });
    shippedUnitDates().dated.forEach(function(d){
      const i = (d.getFullYear() - start.getFullYear()) * 12 + (d.getMonth() - start.getMonth());
      if (i >= 0 && i < n) out[i].y++;
    });
    return out;
  }
  function pMon(d){ return d.toLocaleDateString(undefined, { month:'short' }); }
  function pBarsHtml(series){
    const vals = series.map(function(p){ return p.y; });
    const total = vals.reduce(function(a, b){ return a + b; }, 0);
    if (!total) return '<p class="muted" style="margin:var(--s5) 0 0;">No units shipped in the last 12 months.</p>';
    const max = Math.max.apply(null, vals);
    return '<div class="hbars">' + series.map(function(p, i){
      const pct = p.y ? Math.max(4, Math.round(p.y / max * 100)) : 0;
      return '<div class="hbar-col" title="' + num(p.y) + (p.y === 1 ? ' unit' : ' units') + ' \u00b7 ' +
        p.x.toLocaleDateString(undefined, { month:'long', year:'numeric' }) + '">' +
        '<div class="hbar' + (p.y ? '' : ' zero') + '" style="height:' + (p.y ? pct + '%' : '3px') +
        ';animation-delay:' + (i * 30) + 'ms"></div></div>';
    }).join('') + '</div><div class="haxis"><span>' + pMon(series[0].x) + '</span><span>' +
      pMon(series[Math.floor((series.length - 1) / 2)].x) + '</span><span>' + pMon(series[series.length - 1].x) + '</span></div>';
  }
  function pDonutHtml(segs, unitLbl){
    const total = segs.reduce(function(a, s){ return a + s.n; }, 0);
    if (!total) return '<p class="muted" style="margin:var(--s5) 0 0;">Nothing to show yet.</p>';
    const R = 52, SW = 18, C = 2 * Math.PI * R, SWEEP = 760;
    let off = 0;
    const arcs = segs.map(function(s){
      if (!s.n) return '';
      const len = s.n / total * C;
      const a = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s.c + '" stroke-width="' + SW +
        '" stroke-dasharray="0 ' + C.toFixed(2) + '" data-da="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)" style="transition:stroke-dasharray ' +
        Math.max(90, len / C * SWEEP).toFixed(0) + 'ms linear;transition-delay:' + (off / C * SWEEP).toFixed(0) + 'ms"/>';

  /* the staff dashboard's count-up, for the home figures: climbs fast and
     lands gently on the real number, then hands the exact text back */
  const pReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  function pCountUp(el){
    const finalText = el.textContent;
    const target = parseFloat(finalText.replace(/[^0-9.\-]/g, ''));
    if (isNaN(target) || pReduce.matches) return;
    const RUN = 900;
    let start = 0, raf = 0, to = 0;
    function land(){ if (raf) cancelAnimationFrame(raf); clearTimeout(to); el.textContent = finalText; }
    function step(now){
      if (!start) start = now;
      const t = Math.min(1, Math.max(0, (now - start) / RUN));
      if (t >= 1){ land(); return; }
      el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3))).toLocaleString();
      raf = requestAnimationFrame(step);
    }
    /* if frames are throttled, land on the figure on the clock instead of
       leaving it stranded mid-climb */
    to = setTimeout(land, RUN + 120);
    raf = requestAnimationFrame(step);
  }

  /* ---------- billing ----------
     Read-only money. The only things they can change are the PO number and
     documents they attach themselves; both go through their own function or
     their own bucket. Figures come from security-definer functions, so an
     invoice held back from the portal still shows what is owed on it while
     the order, units and tracking stay hidden. */
  function bmoney(n){
    if (n == null || n === '') return '\u2014';
    const v = Number(n);
    return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function bmoneyBig(n){ return '$' + Math.round(Number(n || 0)).toLocaleString(); }
  function bsize(n){
    const b = +n || 0; if (!b) return '';
    return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  }
  const BILL_CHIP = { paid:'ok', overdue:'bad', 'part paid':'warn', open:'', unpriced:'' };

  /* Axis figures want to be short: $187k reads at a glance where $187,225.00
     just makes the reader count digits. */
  function bshort(n){
    const v = Math.abs(Number(n || 0));
    if (v >= 1000000) return '$' + (v / 1000000).toFixed(v >= 10000000 ? 0 : 1).replace(/\.0$/, '') + 'm';
    if (v >= 1000) return '$' + Math.round(v / 1000) + 'k';
    return '$' + Math.round(v);
  }
  function bmonthShort(d){
    const dt = new Date(String(d).slice(0, 10) + 'T12:00:00');
    return isNaN(dt) ? '' : dt.toLocaleDateString(undefined, { month:'short' });
  }
  function bmonthLong(d){
    const dt = new Date(String(d).slice(0, 10) + 'T12:00:00');
    return isNaN(dt) ? '' : dt.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  }
  /* A bar chart needs a top that is a round number, or the gridlines land on
     values nobody would choose to write down. */
  function bniceMax(v){
    if (!(v > 0)) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const step = [1, 2, 2.5, 5, 10].find(function(s){ return v <= s * mag; }) || 10;
    return step * mag;
  }

    const total = billSeries.reduce(function(s, x){ return s + val(x); }, 0);
    const fmt = function(v){ return units ? num(v) + (v === 1 ? ' unit' : ' units') : bmoney(v); };
    const axis = [top, top * 0.5, 0].map(function(v){

    return '<div class="card bpay-card" style="margin-top:var(--s4);">' +

        '<div class="bch-y">' + axis + '</div>' +

          '<div class="bch-grid"><i></i><i></i><i></i></div>' +

        (units ? '' : '<span>Invoiced over the same period <b>' + bmoneyBig(billSeries.reduce(function(s, x){ return s + Number(x.invoiced || 0); }, 0)) + '</b></span>') +

  async function loadBilling(){
    if (billState === 'loading') return;
    billState = 'loading';
    /* Staff have no customer_users row, so the functions need to be told
       which customer to answer for. A customer login ignores the argument. */
    const scope = isStaff && me ? me.customer_id : null;
    const [sm, iv, sr] = await Promise.all([
      SB.rpc('portal_billing_summary', { p_customer: scope }),
      SB.rpc('portal_billing_invoices', { p_customer: scope }),
      SB.rpc('portal_billing_series', { p_months: 12, p_customer: scope })
    ]);
    if (sm.error || iv.error){
      billState = 'error';
      billErr = ((sm.error || iv.error) || {}).message || 'Could not load billing.';
      return;
    }
    billSum = (sm.data || [])[0] || null;
    billInv = iv.data || [];
    billSeries = sr.error ? [] : (sr.data || []);
    billState = 'ready';
  }

  function renderBilling(){
    if (!canBill && !isStaff){ pview = 'orders'; return renderList(); }
    const host = $('listView');
    if (billState === 'idle'){
      host.innerHTML = pnavHtml() + '<h1>Billing</h1>' +
        '<div class="skel-card"><div class="skel skel-line" style="width:30%"></div>' +
        '<div class="skel skel-line" style="width:60%"></div></div>';
      loadBilling().then(function(){ if (pview === 'billing') renderBilling(); });
      return;
    }
    if (billState === 'loading') return;
    if (billState === 'error'){
      host.innerHTML = pnavHtml() + '<h1>Billing</h1>' +
        '<div class="card"><p class="muted">' + esc(billErr) + '</p></div>';
      return;

  async function billOpenRow(id){
    billOpen = String(billOpen) === String(id) ? null : id;
    billFresh = billOpen;
    renderBilling();
    billFresh = null;
    if (!billOpen) return;
    if (billPays[id] === undefined){
      const r = await SB.rpc('portal_billing_payments', {
        p_order: id, p_customer: isStaff && me ? me.customer_id : null });
      billPays[id] = r.error ? [] : (r.data || []);
      if (String(billOpen) === String(id)) renderBilling();
    }
    if (billDocs[id] === undefined){
      const d = await SB.from('order_customer_docs').select('*').eq('order_id', id).order('created_at', { ascending:false });
      billDocs[id] = d.error ? [] : (d.data || []);
      if (String(billOpen) === String(id)) renderBilling();
    }
  }

  function billPoModal(r){
    const bg = openModal(
      '<div class="modal-h"><h2>PO number</h2><p>Invoice ' + esc(r.invoice_no || '') + '. Yours to set \u2014 it appears on our copy too.</p></div>' +
      '<div class="modal-b"><div class="field"><label for="bPoIn">PO number</label>' +
        '<input id="bPoIn" type="text" maxlength="60" autocomplete="off" value="' + esc(r.po_number || '') + '" placeholder="e.g. 4500123987"></div></div>' +
      '<div class="modal-f"><button class="btn" id="bPoCancel" type="button">Cancel</button>' +
      '<button class="btn primary" id="bPoSave" type="button">Save</button></div>');
    const inp = bg.querySelector('#bPoIn'); inp.focus(); inp.select();
    bg.querySelector('#bPoCancel').addEventListener('click', closeModal);
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); bg.querySelector('#bPoSave').click(); } });
    bg.querySelector('#bPoSave').addEventListener('click', async function(){
      this.disabled = true; this.textContent = 'Saving\u2026';
      const v = inp.value.trim();
      const res = await SB.rpc('portal_set_po_number', { p_order: r.order_id, p_po: v || null });
      if (res.error){ this.disabled = false; this.textContent = 'Save'; toast(res.error.message, 'bad', 7000); return; }
      r.po_number = v || null;
      const o = orders.find(function(x){ return x.id === r.order_id; }); if (o) o.po_number = r.po_number;
      closeModal(); renderBilling(); toast(v ? 'PO number saved' : 'PO number cleared', 'ok');
    });
  }

  async function billUpload(id, files){
    let ok = 0;
    for (const f of Array.from(files)){
      if (f.size > 25 * 1024 * 1024){ toast(f.name + ' is over the 25 MB limit.', 'bad', 7000); continue; }
      const safe = f.name.replace(/[^\w.\-]+/g, '_').slice(-80);
      const path = id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '-' + safe;
      const up = await SB.storage.from('customer-docs').upload(path, f, { upsert:false, contentType: f.type || 'application/octet-stream' });
      if (up.error){ toast('Could not upload ' + f.name + ': ' + up.error.message, 'bad', 7000); continue; }
      const ins = await SB.from('order_customer_docs').insert({
        order_id: id, filename: f.name, path: path, size_bytes: f.size,
        content_type: f.type || null, created_by: session.user.id
      });
      if (ins.error){
        await SB.storage.from('customer-docs').remove([path]);
        toast('Uploaded but not recorded: ' + ins.error.message, 'bad', 7000);
        continue;
      }
      ok++;
    }
    if (ok){
      const d = await SB.from('order_customer_docs').select('*').eq('order_id', id).order('created_at', { ascending:false });
      billDocs[id] = d.error ? [] : (d.data || []);
      const row = billInv.find(function(x){ return String(x.order_id) === String(id); });
      if (row) row.docs = (billDocs[id] || []).length;
      renderBilling();
      toast(ok + (ok === 1 ? ' document attached' : ' documents attached'), 'ok');
    }
  }

  async function billSignedOpen(bucket, path){
    const r = await SB.storage.from(bucket).createSignedUrl(path, 120);
    if (r.error || !r.data || !r.data.signedUrl){
      toast('Could not open that file: ' + ((r.error && r.error.message) || 'no link returned'), 'bad', 7000);
      return;
    }
    window.open(r.data.signedUrl, '_blank', 'noopener');
  }

  function billCsv(){
    const head = ['Invoice', 'PO', 'Due', 'Status', 'Invoiced', 'Paid', 'Balance', 'Days late'];
    const q = function(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    const body = billInv.map(function(r){
      return [r.invoice_no, r.po_number, r.due_date, r.state,
        r.invoice_total == null ? '' : Number(r.invoice_total).toFixed(2),
        Number(r.paid || 0).toFixed(2),
        r.balance == null ? '' : Number(r.balance).toFixed(2),
        r.days_late || 0].map(q).join(',');
    });
    const csv = [head.map(q).join(',')].concat(body).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'statement-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  document.addEventListener('click', async function(e){
    if (pview !== 'billing') return;
    const tab = e.target.closest('[data-btab]');
    if (tab){ billTab = tab.getAttribute('data-btab'); billOpen = null; renderBilling(); return; }
    const cm = e.target.closest('[data-bchart]');
    if (cm){ billChart = cm.getAttribute('data-bchart'); renderBilling(); return; }
    if (e.target.closest('#bCsv')){ billCsv(); return; }
    if (e.target.closest('#bStmt')){ billStatement(); return; }

    const po = e.target.closest('[data-bpo]');
    if (po){
      const r = billInv.find(function(x){ return String(x.order_id) === po.getAttribute('data-bpo'); });
      if (r) billPoModal(r);
      return;
    }
    const rem = e.target.closest('[data-brem]');
    if (rem){
      const r = billInv.find(function(x){ return String(x.order_id) === rem.getAttribute('data-brem'); });
      if (r) billRemitModal(r);
      return;
    }
    const up = e.target.closest('[data-bupload]');
    if (up){
      const id = up.getAttribute('data-bupload');
      const inp = document.querySelector('[data-bfile="' + id + '"]');
      if (inp) inp.click();
      return;
    }
    const pdf = e.target.closest('[data-bpdf]');
    if (pdf){ billSignedOpen('order-invoices', pdf.getAttribute('data-bpdf') + '/invoice.pdf'); return; }

    const dop = e.target.closest('[data-bdocopen]');
    if (dop){
      const d = (billDocs[billOpen] || []).find(function(x){ return x.id === dop.getAttribute('data-bdocopen'); });
      if (d) billSignedOpen('customer-docs', d.path);
      return;
    }
    const ddel = e.target.closest('[data-bdocdel]');
    if (ddel){
      const id = billOpen;
      const d = (billDocs[id] || []).find(function(x){ return x.id === ddel.getAttribute('data-bdocdel'); });
      if (!d || !(await pConfirm('Remove ' + d.filename + '?'))) return;
      ddel.disabled = true;
      (async function(){
        const rm = await SB.storage.from('customer-docs').remove([d.path]);
        const del = rm.error ? null : await SB.from('order_customer_docs').delete().eq('id', d.id);
        const bad = rm.error || (del && del.error);

  /* ---------- notes ---------- */
  async function notesLoad(id){
    notesFor = id; notesErr = '';
    const r = await SB.rpc('order_notes_list', { p_order: id });
    if (notesFor !== id) return;
    notes = r.error ? [] : (r.data || []);
    if (r.error) notesErr = r.error.message;
    renderNotes();
  }

  function noteWhen(v){
    const d = new Date(v);
    if (isNaN(d)) return '';
    const mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  }

      ? '<div class="nthread">' + notes.map(function(n){

  /* ---------------------------------------------------------------
     GLOBAL SEARCH
     Serial, invoice, PO, tracking and RMA all name one record, so a
     hit is somewhere to go. Scoped to this customer's own data.
     --------------------------------------------------------------- */
  (function(){
    const wrap = $('gsearch');
    if (!wrap) return;
    const input = $('gsInput'), panel = $('gsPanel'), clearB = $('gsClear'),
          cancel = $('gsCancel'), openB = $('gsBtn'), scrim = $('gsScrim');

    const GS_ICO = {
      serial:'<svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path stroke-linecap="round" d="M8.5 20h7M12 16.5V20"/></g></svg>',
      order:'<svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 4.002C18.175 4.014 19.353 4.111 20.121 4.879C21 5.758 21 7.172 21 10v6c0 2.829 0 4.243-.879 5.122C19.243 22 17.828 22 15 22H9c-2.828 0-4.243 0-5.121-.878C3 20.243 3 18.828 3 16v-6c0-2.828 0-4.242.879-5.121C4.647 4.111 5.825 4.014 8 4.002"/><path stroke-linecap="round" d="M7 14.5h8M7 18h5.5"/><path d="M8 3.5A1.5 1.5 0 0 1 9.5 2h5A1.5 1.5 0 0 1 16 3.5v1A1.5 1.5 0 0 1 14.5 6h-5A1.5 1.5 0 0 1 8 4.5z"/></g></svg>',
      tracking:'<svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/></g></svg>',
      rma:'<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg>'
    };
    const GS_HUE = { serial:'var(--accent)', order:'var(--accent)', tracking:'var(--ok)', rma:'var(--hue-rma, var(--info))' };

    let hits = [], sel = -1;

    function mark(text, q){
      const s = String(text == null ? '' : text), at = s.toLowerCase().indexOf(q);
      if (at < 0) return esc(s);
      return esc(s.slice(0, at)) + '<mark>' + esc(s.slice(at, at + q.length)) + '</mark>' + esc(s.slice(at + q.length));
    }

    function find(raw){
      const q = String(raw || '').trim().toLowerCase();
      if (q.length < 2) return [];
      const out = [];
      function rank(v){
        const s = String(v == null ? '' : v).toLowerCase();
        if (!s) return 0;
        if (s === q) return 4;
        if (s.indexOf(q) === 0) return 3;
        return s.indexOf(q) >= 0 ? 1 : 0;
      }
      function take(group, rows, cap){
        rows.sort(function(a, b){ return b.r - a.r || String(a.title).localeCompare(String(b.title)); });
        rows.slice(0, cap || 5).forEach(function(x){ x.group = group; out.push(x); });
      }
      const byOrder = {}, byBatch = {};
      orders.forEach(function(o){ byOrder[o.id] = o; });
      batches.forEach(function(b){ byBatch[b.id] = b; });

      let g = [];
      units.forEach(function(u){
        const r = rank(u.serial); if (!r) return;
        const o = byOrder[u.order_id], b = u.batch_id ? byBatch[u.batch_id] : null;
        g.push({ r:r, kind:'serial', title:u.serial,
          sub:(o ? o.invoice_no : 'No invoice') + (b ? ' \u00b7 Batch ' + b.batch_no : ''),
          tag:u.unit_status === 'shipped' ? 'Shipped' : (u.batch_id ? 'Preparing' : 'Building'),
          go:o ? function(){ openOrder(o.id); } : null });
      });
      take('Serial number', g.filter(function(x){ return x.go; }), 6);

      g = [];
      orders.forEach(function(o){
        const ri = rank(o.invoice_no), rp = rank(o.po_number);
        if (!ri && !rp) return;
        g.push({ r:Math.max(ri, rp), kind:'order',
          title:ri >= rp ? o.invoice_no : o.po_number,
          sub:ri >= rp ? (o.po_number ? 'PO ' + o.po_number : 'No PO on file') : o.invoice_no,
          tag:ri >= rp ? 'Invoice' : 'PO',
          go:function(){ openOrder(o.id); } });
      });
      take('Order', g, 5);

      g = [];
      tracking.forEach(function(t){
        const r = rank(t.tracking_no); if (!r) return;
        const b = byBatch[t.batch_id]; if (!b) return;
        const o = byOrder[b.order_id];
        g.push({ r:r, kind:'tracking', title:t.tracking_no,
          sub:(o ? o.invoice_no + ' \u00b7 ' : '') + 'Batch ' + b.batch_no + (b.carrier ? ' \u00b7 ' + b.carrier : ''),
          tag:'Shipment', go:o ? function(){ openOrder(o.id); } : null });
      });
      rmaShipments.forEach(function(s){
        const r = rank(s.tracking_no); if (!r) return;
        const t = rmaTickets.find(function(x){ return x.id === s.rma_id; });
        if (!t) return;
        g.push({ r:r, kind:'tracking', title:s.tracking_no,
          sub:'RMA-' + t.rma_no + ' \u00b7 ' + (s.direction === 'return' ? 'your return' : 'part to you'),
          tag:'RMA', go:function(){ openRma(t.id); } });
      });
      take('Tracking', g.filter(function(x){ return x.go; }), 5);

      g = [];

      const idx = Array.prototype.indexOf.call(menu.children, a);
      if (idx < 0 || !menu.parentNode) return null;
      const g = menu.cloneNode(true);

      });

        /* labels are still growing: measure the settled layout on an invisible

        const g = ghostFor(a), m = g || a;
        const w = Math.max(0, m.offsetWidth - 8);
        ind.style.width = w + 'px';
        ind.style.height = Math.max(0, m.offsetHeight - 4) + 'px';
        ind.style.top = (m.offsetTop + 2) + 'px';
        ind.style.transform = 'translateX(' + (m.offsetLeft + (m.offsetWidth - w) / 2) + 'px)';
        if (g) g.parentNode.remove();

  /* ---------- the two charts the tech asked for, normalised per 100 units ----------
     Raw RMA counts only ever climb, which makes a growing account look worse the

     whether quality is holding. */
  const PCH = (function(){
    function fmtShort(d){ return d.toLocaleDateString(undefined, { month:'short', day:'numeric' }); }
    function smooth(pts){
      const n = pts.length;
      if (n < 3) return pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('');
      const dx = [], dy = [], m = [], t = [];
      for (let i = 0; i < n-1; i++){ dx.push(pts[i+1][0]-pts[i][0]); dy.push(pts[i+1][1]-pts[i][1]); m.push(dy[i]/(dx[i]||1e-6)); }
      t[0] = m[0]; t[n-1] = m[n-2];
      for (let i = 1; i < n-1; i++){
        if (m[i-1]*m[i] <= 0) t[i] = 0;
        else { const w1 = 2*dx[i]+dx[i-1], w2 = dx[i]+2*dx[i-1]; t[i] = (w1+w2)/(w1/m[i-1]+w2/m[i]); }
      }
      let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
      for (let i = 0; i < n-1; i++){
        const h = dx[i]/3;
        d += 'C' + (pts[i][0]+h).toFixed(1) + ' ' + (pts[i][1]+t[i]*h).toFixed(1) + ' ' +
                   (pts[i+1][0]-h).toFixed(1) + ' ' + (pts[i+1][1]-t[i+1]*h).toFixed(1) + ' ' +
                   pts[i+1][0].toFixed(1) + ' ' + pts[i+1][1].toFixed(1);
      }
      return d;
    }
    function area(host, series, o){
      o = o || {};
      const W = 600, H = o.h || 150, padT = 12, padB = 6, n = series.length;
      if (!n){ host.innerHTML = ''; return; }
      const max = Math.max(o.min || 0.001, Math.max.apply(null, series.map(function(p){ return p.y; })));
      const pts = series.map(function(p, i){ return [ n === 1 ? W/2 : (i/(n-1))*W, padT + (1 - p.y/max) * (H - padT - padB) ]; });
      const line = smooth(pts), gid = 'pg' + (o.id || Math.random().toString(36).slice(2));
      host.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">' +
          '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" style="stop-color:var(--accent)" stop-opacity=".28"/>' +
            '<stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + line + 'L' + W + ' ' + H + 'L0 ' + H + 'Z" fill="url(#' + gid + ')"/>' +
          '<path d="' + line + '" fill="none" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
          '<line class="pch-x" x1="0" x2="0" y1="0" y2="' + H + '" style="stroke:var(--line-strong)" vector-effect="non-scaling-stroke" opacity="0"/>' +
          '<circle class="pch-dot" r="4" style="fill:var(--accent);stroke:var(--paper)" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0"/>' +
        '</svg><div class="rchart-tip"></div>' +
        '<div class="rchart-axis"><span>' + fmtShort(series[0].x) + '</span>' +
          (n > 2 ? '<span>' + fmtShort(series[Math.floor((n-1)/2)].x) + '</span>' : '') +
          '<span>' + fmtShort(series[n-1].x) + '</span></div>';
      const svg = host.querySelector('svg'), tip = host.querySelector('.rchart-tip');
      const xl = svg.querySelector('.pch-x'), dot = svg.querySelector('.pch-dot');
      function move(ev){
        const r = svg.getBoundingClientRect();
        const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const i = Math.max(0, Math.min(n-1, Math.round((cx - r.left)/r.width * (n-1))));
        const p = pts[i];
        xl.setAttribute('x1', p[0]); xl.setAttribute('x2', p[0]); xl.setAttribute('opacity', 1);
        dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[1]); dot.setAttribute('opacity', 1);
        tip.style.left = (p[0]/W*100) + '%'; tip.style.top = (p[1] - 10) + 'px';
        tip.innerHTML = (o.fmt ? o.fmt(series[i]) : series[i].y);
        tip.style.opacity = 1;
      }
      function leave(){ xl.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tip.style.opacity = 0; }
      svg.addEventListener('mousemove', move); svg.addEventListener('touchmove', move, { passive:true });
      svg.addEventListener('mouseleave', leave); svg.addEventListener('touchend', leave);
    }
    return { area:area };
  })();

  function rate100(rmas, shipped){ return shipped ? (rmas / shipped * 100) : null; }

  /* a shipped unit's date comes from its batch; undated ones count as already
     out there, which keeps the denominator honest rather than flattering */
  function shippedUnitDates(){
    const dated = [], undated = [];
    units.forEach(function(u){
      if (u.unit_status !== 'shipped') return;
      const b = unitBatch(u);
      if (b && b.ship_date) dated.push(new Date(String(b.ship_date) + 'T12:00:00'));
      else undated.push(u);

    return { dated: dated.sort(function(a, b){ return a - b; }), base: undated.length, total: dated.length + undated.length };
  }
  function renderRmaRate(){
    const plot = $('rRatePlot'); if (!plot) return;
    const ship = shippedUnitDates();
    const live = rmaTickets.filter(function(t){ return t.status !== 'cancelled'; });
    const overall = rate100(live.length, ship.total);

    $('rRateVal').textContent = fmtRate(overall);
    $('rRateSub').textContent = overall == null
      ? 'No units shipped yet, so there is nothing to measure against.'
      : num(live.length) + ' RMA' + (live.length === 1 ? '' : 's') + ' across ' + num(ship.total) + ' units shipped';

    if (overall == null){ plot.innerHTML = ''; return; }

    /* 12 week-ends; at each one, the rate to date */
    const weeks = [], now = new Date(); now.setHours(23,59,59,999);
    const monday = new Date(now); monday.setHours(0,0,0,0);
    monday.setDate(monday.getDate() - ((monday.getDay()+6)%7));
    for (let i = 11; i >= 0; i--){
      const end = new Date(monday); end.setDate(end.getDate() - i*7 + 6); end.setHours(23,59,59,999);
      weeks.push(end > now ? now : end);
    }
    const series = weeks.map(function(end){
      const shipped = ship.base + ship.dated.filter(function(d){ return d <= end; }).length;
      const opened  = live.filter(function(t){ return new Date(t.created_at) <= end; }).length;
      const r = rate100(opened, shipped);
      return { x: end, y: r == null ? 0 : r, rmas: opened, units: shipped };
    });
    PCH.area(plot, series, { h:(window.matchMedia && window.matchMedia('(max-width:700px)').matches) ? 100 : 150, id:'rrate', min:0.5, fmt:function(p){
      return '<b>' + fmtRate(p.y) + ' per 100</b> ' + num(p.rmas) + ' of ' + num(p.units) + ' by ' +

  /* ---- return slip: goes in the box so the part lands on the right ticket ---- */
  const R_SLIP_CSS = 'body{font:14px/1.5 -apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;color:#1a1a1a;margin:0;padding:40px;max-width:720px}h1{font-size:26px;margin:0 0 2px;letter-spacing:-.5px}.k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#787671;margin:22px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 0;border-bottom:1px solid #e5e3df;vertical-align:top}th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#787671;font-weight:600}.n{text-align:right;white-space:nowrap}.big{font-size:24px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}.box{border:1px solid #c8c4be;border-radius:8px;padding:12px 14px;white-space:pre-wrap;min-height:44px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #1a1a1a;padding-bottom:14px}.muted{color:#5d5b54}@media print{body{padding:0}}';
  function returnSlip(t){

    const parts = rmaParts.filter(function(x){ return x.rma_id === t.id && x.status !== 'denied'; });
    const em = (session && session.user && session.user.email || '').toLowerCase();
    const c = rmaContacts.find(function(x){ return (x.email || '').toLowerCase() === em; }) || rmaContacts[0] || null;
    const from = c ? [c.name, c.address].filter(Boolean).join('\n') : (customer ? customer.name : '');
    const to = rmaReturnAddress || 'Novatech Gaming\n(return address to be confirmed on the ticket)';
    const w = window.open('', '_blank');
    if (!w){ toast('Allow pop-ups to print the slip.', 'bad', 6000); return; }
    const html = '<div class="top"><div><h1>RMA return slip</h1><div class="muted">' + esc(customer ? customer.name : '') + ' \u2192 Novatech Gaming</div></div>' +
        '<div style="text-align:right"><div class="big">' + rmaNo(t) + '</div><div class="muted">' + esc(fmtDate(ymd(new Date()))) + '</div></div></div>' +
      '<div class="grid"><div><div class="k">Ship to</div><div class="box">' + esc(to) + '</div></div>' +
        '<div><div class="k">From</div><div class="box">' + esc(from || '\u2014') + '</div></div></div>' +
      '<div class="k">Failed part' + (parts.length === 1 ? '' : 's') + ' enclosed</div><table><tr><th>Part</th><th class="n">Qty</th></tr>' +
        (parts.length ? parts.map(function(x){ return '<tr><td>' + esc(x.description) + '</td><td class="n">' + x.qty + '</td></tr>'; }).join('')
                      : '<tr><td colspan="2">' + esc(t.part_requested || rmaCat(t.issue_category)) + '</td></tr>') + '</table>' +
      '<div class="k">From unit</div><div class="box">Serial ' + esc(t.serial) + (cfg ? '\n' + esc(cfg.name) : '') + (o ? '\nInvoice ' + esc(o.invoice_no) : '') + '</div>' +
      '<div class="k">Instructions</div><div class="box">Place this slip inside the box and write ' + rmaNo(t) + ' on the outside. Add the tracking number to the ticket once it ships.</div>';
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + rmaNo(t) + ' return slip</title><style>' + R_SLIP_CSS + '</style></head><body>' + html + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(function(){ try { w.print(); } catch(e){} }, 400);

  async function rmaEvent(t, kind, from, to, detail){
    const r = await SB.from('rma_events').insert({ rma_id: t.id, kind: kind, from_val: from || null, to_val: to || null, detail: detail || null, actor_id: session.user.id, actor_type: 'customer', actor_name: myName() }).select().single();

    if (r.data) rmaEvents.push(r.data);
  }

  /* ---- attachments ---- */
  function attHtml(list){

  async function loadThumbs(host){
    const imgs = host.querySelectorAll('img[data-att]');
    for (const im of imgs){
      const x = rmaAttachments.find(function(y){ return y.id === im.getAttribute('data-att'); }); if (!x) continue;
      const r = await SB.storage.from(RMA_BUCKET).createSignedUrl(x.path, 600);

  document.addEventListener('click', async function(e){
    const el = e.target.closest('[data-att]'); if (!el) return;

  });
  function shrink(file){
    return new Promise(function(res, rej){
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', 0.86);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
  }
  async function rmaUpload(t, files, commentId){
    for (const f of files){
      let blob = f, type = f.type || 'application/octet-stream', name = f.name;
      if (/^image\/(jpeg|png|webp)$/.test(type)){ try { blob = await shrink(f); type = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; } catch(e){} }
      const safe = name.replace(/[^\w.\-]+/g, '_').slice(-80);
      const path = t.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '-' + safe;
      const up = await SB.storage.from(RMA_BUCKET).upload(path, blob, { contentType: type, upsert: false });
      if (up.error){ toast('Upload failed: ' + up.error.message, 'bad'); continue; }
      const ins = await SB.from('rma_attachments').insert({ rma_id: t.id, comment_id: commentId || null, path: path, filename: f.name, size_bytes: blob.size, content_type: type, uploaded_by: session.user.id, uploaded_by_type: 'customer' }).select().single();
      if (!ins.error && ins.data) rmaAttachments.push(ins.data);
    }
  }

  /* Copies verbatim, line breaks and all, without a modal in the way.
     execCommand first: it runs inside the click gesture and works on http
     and inside frames, where navigator.clipboard often does not. */
  function rmaCopyAddress(text, label){
    const what = label || 'Address';
    let ok = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch(e){ ok = false; }
    if (ok){ toast(what + ' copied', 'ok'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ toast(what + ' copied', 'ok'); },
        function(){ toast('Could not reach the clipboard \u2014 select the address and copy it by hand.', 'bad', 6000); });
      return;
    }
    toast('Could not reach the clipboard \u2014 select the address and copy it by hand.', 'bad', 6000);
  }
  async function copyText(text, label){
    try { await navigator.clipboard.writeText(text); toast(label + ' copied', 'ok'); }

                 : '<p class="muted">No specs recorded.</p>');

    let left = Math.min(r.left, window.innerWidth - p.offsetWidth - 12);

    p.style.left = Math.round(left) + 'px';

    const ox = Math.max(8, Math.min(p.offsetWidth - 8, r.left + r.width / 2 - left));
