<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NovaTech Portal">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>NovaTech &middot; Order Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    try{
      var t = localStorage.getItem('ntTheme') === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<style>

  :root{
    color-scheme:light;
    --font-ui:'Instrument Sans',system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ink:#12161c; --muted:#5b6673; --faint:#8c97a5;
    --bg:#eff1f5; --paper:#ffffff; --soft:#f4f6f9;
    --line:#e2e6ec; --line-strong:#cdd4de;
    --accent:#2050c8; --accent-hover:#1a44ad; --accent-soft:#e8eefc; --accent-line:#bdcdf4; --accent-ink:#ffffff;
    --ok:#10693a;   --ok-bg:#e3f3e8;   --ok-line:#bfe0cb;
    --warn:#8a5a00; --warn-bg:#fdf1d6; --warn-line:#f0d79a;
    --bad:#b3261e;  --bad-bg:#fdeae8;  --bad-line:#f3c6c1;
    --info:#1a4971; --info-bg:#e4eef8; --info-line:#c2d8ec;
    --e1:0 1px 2px rgba(16,24,40,.05);
    --e2:0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.06);
    --e3:0 2px 6px rgba(16,24,40,.06), 0 18px 44px rgba(16,24,40,.13);
    --ring:0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft), 0 0 14px -4px color-mix(in srgb, var(--accent) 26%, transparent);
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
    --t:160ms cubic-bezier(.2,.6,.2,1);
    --t-slow:220ms cubic-bezier(.2,.6,.2,1);
    --scrim:rgba(11,15,20,.5);

    /* brand spectrum + bloom, same system as the staff dashboard */
    --spec-1:#ff2e97; --spec-2:#8a2be2; --spec-3:#2563eb; --spec-4:#22d3ee;
    --spectrum:linear-gradient(90deg, var(--spec-1), var(--spec-2), var(--spec-3), var(--spec-4));
    --spectrum-a:.26;
    --glow-a1:22%; --glow-a2:28%;
  }
  :root[data-theme="dark"], :root:not([data-theme]){
    color-scheme:dark;
    --ink:#e8ecf2; --muted:#9aa5b4; --faint:#6c7787;
    --bg:#0e1116; --paper:#161b22; --soft:#1c222b;
    --line:#252c36; --line-strong:#374250;
    --accent:#6f9bff; --accent-hover:#8bb0ff; --accent-soft:#182338; --accent-line:#2c3f63; --accent-ink:#0b0f14;
    --ok:#5ec98a;   --ok-bg:#122319;   --ok-line:#23432f;
    --warn:#e0b256; --warn-bg:#241d0e; --warn-line:#463722;
    --bad:#f08b81;  --bad-bg:#2a1513;  --bad-line:#4d2622;
    --info:#8ec1ec; --info-bg:#12212c; --info-line:#25394a;
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.4);
    --e3:0 2px 6px rgba(0,0,0,.4), 0 20px 48px rgba(0,0,0,.55);
    --scrim:rgba(4,6,9,.66);
    --spec-1:#ff5cb0; --spec-2:#a855f7; --spec-3:#5b8cff; --spec-4:#3fdbe8;
    --spectrum-a:.34;
    --glow-a1:36%; --glow-a2:44%;
    --ring:0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft), 0 0 16px -4px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background var(--t-slow), color var(--t-slow);
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ color:var(--accent-hover); }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:none; box-shadow:var(--ring); border-radius:var(--r-sm);
  }
  .mono{ font-family:var(--font-num); font-variant-numeric:tabular-nums; }
  .muted{ color:var(--muted); font-size:12.5px; }
  .subtle{ font-size:11.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); margin-left:var(--s2); }

  /* ---------- top bar ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
    padding:var(--s3) var(--s5); background:var(--paper);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; flex-wrap:wrap;
    box-shadow:var(--e1);
  }
  header.top::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:var(--spectrum); opacity:var(--spectrum-a); pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:var(--s3); min-width:0; }
  .brand img{ height:28px; width:auto; }
  .brand b{ font-size:15px; letter-spacing:-0.015em; display:block; }
  .brand span{ color:var(--faint); font-size:12px; }
  .who{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .who-em{ font-size:12.5px; color:var(--muted); }

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    border-radius:var(--r-sm); padding:8px 14px; font:inherit; font-size:13px; font-weight:600;
    cursor:pointer; transition:border-color var(--t), background var(--t), transform var(--t), box-shadow var(--t);
  }
  .btn:hover{ border-color:var(--muted); box-shadow:var(--e1); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); box-shadow:0 0 20px -5px color-mix(in srgb, var(--accent) var(--glow-a2), transparent); }
  .btn.sm{ padding:6px 11px; font-size:12.5px; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; padding:0; border:1px solid var(--line-strong);
    background:var(--paper); color:var(--muted); border-radius:var(--r-pill); cursor:pointer;
    transition:color var(--t), border-color var(--t), background var(--t), box-shadow var(--t);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--muted); box-shadow:0 0 12px -3px color-mix(in srgb, var(--spec-4) var(--glow-a1), transparent); }
  .icon-btn svg{ width:17px; height:17px; }
  :root[data-theme="light"] .i-sun{ display:none; }
  :root:not([data-theme="light"]) .i-moon{ display:none; }

  /* ---------- layout ---------- */
  .wrap{ max-width:1080px; margin:0 auto; padding:var(--s6) var(--s5) var(--s7); }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:var(--s5); margin-bottom:var(--s4); box-shadow:var(--e1);
  }
  h1{ font-size:26px; letter-spacing:-0.028em; margin:0 0 var(--s2); }
  h2{ font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:0 0 var(--s3); }
  .page-head{ margin-bottom:var(--s5); }

  /* ---------- login ---------- */
  .login{ max-width:400px; margin:11vh auto; padding:0 var(--s4); animation:rise var(--t-slow) both; }
  .field{ margin-bottom:var(--s3); }
  .field label{ display:block; font-size:12px; font-weight:650; color:var(--muted); margin-bottom:var(--s1); }
  .field input, .pickbox, .searchbox{
    width:100%; height:42px; padding:0 var(--s3); font:inherit; font-size:14px;
    border:1px solid var(--line-strong); border-radius:var(--r-sm);
    background:var(--paper); color:var(--ink);
    transition:border-color var(--t), box-shadow var(--t);
  }
  .field input:focus, .pickbox:focus, .searchbox:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .err{ color:var(--bad); font-size:12.5px; min-height:1.2em; margin-top:var(--s2); font-weight:600; }

  /* ---------- order rows ---------- */
  .toolbar{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .searchbox{ flex:1 1 260px; height:38px; font-size:13px; }
  .orow{
    display:grid; grid-template-columns:minmax(0,1fr) 210px 120px 28px; gap:var(--s4);
    align-items:center; padding:var(--s4); border:1px solid var(--line);
    border-radius:var(--r-md); background:var(--paper); margin-bottom:var(--s3);
    cursor:pointer; box-shadow:var(--e1);
    transition:border-color var(--t), box-shadow var(--t), transform var(--t);
    animation:rise var(--t-slow) both;
  }
  .orow:hover{ border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); box-shadow:var(--e2), 0 0 22px -6px color-mix(in srgb, var(--accent) var(--glow-a2), transparent); transform:translateY(-1px); }
  .orow:hover .chev{ transform:translateX(3px); color:var(--accent); }
  .orow:focus-visible{ outline:none; box-shadow:var(--ring); }
  .inv{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; font-weight:700; font-size:15px; }
  .inv-lbl{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .chev{ color:var(--faint); display:flex; justify-content:flex-end; transition:transform var(--t), color var(--t); }
  .chev svg{ width:18px; height:18px; }

  .chip{
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    font-size:11.5px; font-weight:700; letter-spacing:.02em;
    padding:4px 10px; border-radius:var(--r-pill); border:1px solid transparent;
  }
  .chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.n{ color:var(--muted);  background:var(--soft);      border-color:var(--line); }
  .chip.i{ color:var(--info);   background:var(--info-bg);   border-color:var(--info-line); }
  .chip.w{ color:var(--warn);   background:var(--warn-bg);   border-color:var(--warn-line); }
  .chip.k{ color:var(--ok);     background:var(--ok-bg);     border-color:var(--ok-line); }

  .bar{ height:7px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; display:flex; border:1px solid var(--line); }
  .bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .bar i.s{ background:var(--ok); } .bar i.a{ background:var(--accent); } .bar i.b{ background:var(--line-strong); }
  .barlbl{ font-family:var(--font-num); font-size:11.5px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }

  /* ---------- detail ---------- */
  .back{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .sum{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s3); margin-bottom:var(--s5); }
  .sumc{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s4); box-shadow:var(--e1); animation:rise var(--t-slow) both;
  }
  .sumv{ font-family:var(--font-num); font-size:26px; font-weight:600; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; }
  .suml{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-top:var(--s1); }
  .sumc.ok .sumv{ color:var(--ok); }
  .sumc.rem .sumv{ color:var(--warn); }

  .batch{ border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:var(--s3); overflow:hidden; background:var(--paper); }
  .bhead{ display:grid; grid-template-columns:120px minmax(0,1fr) 160px auto; gap:var(--s3); align-items:center; padding:var(--s4); }
  .bhead b{ font-size:13.5px; }
  .storenum{
    display:inline-block; margin-left:var(--s2); font-family:var(--font-num); font-size:11px;
    font-weight:600; color:var(--muted); background:var(--soft); border:1px solid var(--line);
    border-radius:var(--r-pill); padding:1px 7px; vertical-align:middle;
  }
  .bbody{ padding:var(--s3) var(--s4) var(--s4); border-top:1px solid var(--line); background:var(--soft); }

  /* ---------- tables ---------- */
  .twrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper); }
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; }
  thead th{
    position:sticky; top:0; z-index:1; background:var(--paper);
    text-align:left; padding:9px 12px; font-size:10.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--faint);
    border-bottom:1px solid var(--line);
  }
  td{ padding:10px 12px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td{ border-bottom:0; }
  tbody tr{ transition:background var(--t); }
  tbody tr:hover{ background:var(--soft); }

  /* ---------- config popover ---------- */
  .cfg{ border-bottom:1px dotted var(--line-strong); cursor:help; transition:color var(--t), border-color var(--t); }
  .cfg:hover{ color:var(--accent); border-bottom-color:var(--accent); }
  .pop{
    display:none; position:fixed; z-index:120; max-width:300px;
    background:var(--paper); border:1px solid var(--line-strong);
    border-radius:var(--r-md); box-shadow:var(--e3); padding:var(--s3) var(--s4);
    animation:pop var(--t) both;
  }
  .pop h3{ margin:0 0 var(--s2); padding-bottom:var(--s2); border-bottom:1px solid var(--line); font-size:13px; }
  .pop dl{ margin:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px var(--s3); }
  .pop dt{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); align-self:center; }
  .pop dd{ margin:0; font-size:12.5px; font-family:var(--font-num); }

  /* ---------- empty + skeleton ---------- */
  .empty{ text-align:center; padding:var(--s7) var(--s4); color:var(--muted); }
  .empty-ico{
    width:44px; height:44px; margin:0 auto var(--s3); border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center;
    background:var(--soft); border:1px solid var(--line); color:var(--faint);
  }
  .empty-ico svg{ width:22px; height:22px; }
  .skel{ background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);
    background-size:400% 100%; animation:shimmer 1.3s ease-in-out infinite; border-radius:var(--r-sm); }
  .skel-line{ height:12px; margin-bottom:var(--s2); }
  .skel-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s4); margin-bottom:var(--s3); }

  /* ---------- toasts + modal ---------- */
  .toast-stack{ position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
    z-index:200; display:flex; flex-direction:column; gap:var(--s2); align-items:center; pointer-events:none; }
  .toast{
    pointer-events:auto; background:var(--paper); color:var(--ink);
    border:1px solid var(--line-strong); border-left:3px solid var(--accent);
    border-radius:var(--r-sm); box-shadow:var(--e3);
    padding:10px var(--s4); font-size:13px; font-weight:600; max-width:88vw;
    animation:rise var(--t) both;
  }
  .toast.ok{ border-left-color:var(--ok); }
  .toast.bad{ border-left-color:var(--bad); }
  .modal-bg{
    position:fixed; inset:0; z-index:150; background:var(--scrim);
    display:flex; align-items:center; justify-content:center; padding:var(--s4);
    animation:fade var(--t) both;
  }
  .modal{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--e3); width:100%; max-width:440px; animation:pop var(--t-slow) both;
  }
  .modal-h{ padding:var(--s5) var(--s5) 0; }
  .modal-h h3{ margin:0; font-size:17px; letter-spacing:-0.02em; }
  .modal-h p{ margin:var(--s1) 0 0; font-size:12.5px; color:var(--muted); }
  .modal-b{ padding:var(--s4) var(--s5); }
  .modal-f{ padding:0 var(--s5) var(--s5); display:flex; gap:var(--s2); justify-content:flex-end; }
  .lookup-out{ margin-top:var(--s3); font-size:13px; }
  .lookup-out dl{ margin:var(--s2) 0 0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px var(--s3); }
  .lookup-out dt{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); align-self:center; }
  .lookup-out dd{ margin:0; font-family:var(--font-num); font-size:12.5px; }

  .staffbadge{
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-line);
    border-radius:var(--r-pill); padding:3px 8px;
  }
  .pickbox{ height:34px; font-size:12.5px; max-width:190px; width:auto; }

  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  @keyframes pop{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:none; } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes shimmer{ from{ background-position:100% 50%; } to{ background-position:0 50%; } }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; }
  }

  @media (max-width:820px){
    html, body{ overflow-x:hidden; max-width:100%; }
    body{
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .wrap{ padding:var(--s5) var(--s4) calc(var(--s7) + env(safe-area-inset-bottom)); }
    header.top{
      padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
      gap:var(--s2);
      align-items:stretch;
    }
    .brand{ width:100%; }
    .who{ width:100%; justify-content:flex-end; gap:var(--s2); }
    .who-em{ display:none; }
    #staffPick{ width:100%; order:-1; flex:1 1 100%; }
    .pickbox{ max-width:100%; width:100%; height:48px; }
    .orow{ grid-template-columns:1fr; gap:var(--s3); }
    .orow .chev{ display:none; }
    .orow .barlbl{ font-size:12.5px; }
    .sum{ grid-template-columns:repeat(2,1fr); }
    .sumv{ font-size:22px; }
    .bhead{ grid-template-columns:1fr; }
    .back .btn{ flex:1 1 auto; min-height:44px; }
    .btn, .btn.sm{ min-height:44px; }
    .icon-btn{ width:44px; height:44px; }
    h1{ font-size:21px; }
    .login{ margin:4vh auto; padding:0 var(--s3); min-height:calc(100dvh - 8vh); display:flex; flex-direction:column; justify-content:center; }
    .login .card{ padding:var(--s5) var(--s4); }
    .field input, .searchbox, .pickbox{ min-height:48px; font-size:16px; max-width:100%; }
    .toolbar{ flex-direction:column; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .toolbar .btn{ width:100%; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .modal-bg{ align-items:flex-end; padding:0; }
    .modal{
      max-width:none; border-bottom-left-radius:0; border-bottom-right-radius:0;
      max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    .modal-f{ position:sticky; bottom:0; background:var(--paper);
      padding-bottom:calc(var(--s5) + env(safe-area-inset-bottom)); }
    .modal-f .btn{ flex:1; }
    .toast-stack{ bottom:calc(var(--s4) + env(safe-area-inset-bottom)); width:calc(100% - 24px); }
    .twrap{ -webkit-overflow-scrolling:touch; }
    table{ font-size:13px; }
  }
  @media (max-width:420px){
    .sum{ grid-template-columns:1fr 1fr; }
  }
  @media print{
    header.top, .toolbar, .back, .btn, .icon-btn, .toast-stack{ display:none !important; }
    body{ background:#fff; }
    .card, .batch, .sumc{ box-shadow:none; border-color:#ccc; break-inside:avoid; }
    .bbody{ display:block !important; background:#fff; }
    .orow{ animation:none; }
  }
</style>
</head>
<body>

<header class="top" id="topbar" style="display:none;">
  <div class="brand">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <div><b>Order Portal</b><span id="custName"></span></div>
  </div>
  <div class="who">
    <span id="staffPick" style="display:none;"></span>
    <span class="who-em" id="whoEmail"></span>
    <button type="button" class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn sm" id="signOut" type="button">Sign out</button>
  </div>
</header>

<div id="loginView" class="login">
  <div class="card">
    <h1>Order Portal</h1>
    <p class="muted" style="margin-top:0;">Sign in to see your orders, shipments and serial numbers.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="go" type="button" style="width:100%; height:44px;">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
  <p class="muted" style="text-align:center;">
    <button type="button" class="icon-btn" id="themeBtn2" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </p>
</div>

<div class="wrap" id="app" style="display:none;">
  <div id="listView"></div>
  <div id="detailView" style="display:none;"></div>
</div>

<div class="pop" id="pop"></div>
<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://vajrnbniwkvnkkkigeit.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_mF1sD8UO4CHuyCgPTLZsXQ_CilDLz3y';
  const SB = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true } })
    : null;

  const $ = function(id){ return document.getElementById(id); };
  function esc(v){ return (v==null?'':String(v)).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(n){ return (n==null||n==='') ? '\u2014' : Number(n).toLocaleString(); }
  function fmtDate(v){
    if (!v) return '';
    const d = new Date(String(v).length <= 10 ? v + 'T12:00:00' : v);
    return isNaN(d) ? String(v) : d.toLocaleDateString();
  }

  /* ---------- theme ---------- */
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    try { localStorage.setItem('ntTheme', t); } catch(e){}
    const metas = document.querySelectorAll('meta[name="theme-color"]');
    metas.forEach(function(m){
      if (!m.getAttribute('media')) m.setAttribute('content', t === 'dark' ? '#0e1116' : '#ffffff');
    });
    const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (bar) bar.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
  }
  function toggleTheme(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }
  ['themeBtn','themeBtn2'].forEach(function(id){
    const b = $(id); if (b) b.addEventListener('click', toggleTheme);
  });

  /* ---------- toast ---------- */
  function toast(msg, kind, ms){
    const stack = $('toastStack'); if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity 200ms, transform 200ms';
      el.style.opacity = '0'; el.style.transform = 'translateY(6px)';
      setTimeout(function(){ el.remove(); }, 220);
    }, ms || 4000);
  }

  /* ---------- modal ---------- */
  let modalBg = null;
  function closeModal(){ if (modalBg){ modalBg.remove(); modalBg = null; } }
  function openModal(html){
    closeModal();
    modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.id = 'modalBg';
    modalBg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    modalBg.addEventListener('click', function(e){ if (e.target === modalBg) closeModal(); });
    document.body.appendChild(modalBg);
    const first = modalBg.querySelector('input, button');
    if (first) first.focus();
    return modalBg;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

  /* ---------- shareable links: read once at startup, no listeners ---------- */
  function baseUrl(){ return location.origin + location.pathname; }
  function linkFor(orderId){ return baseUrl() + '?order=' + encodeURIComponent(orderId); }
  function setUrl(orderId){
    try { history.replaceState(null, '', orderId ? linkFor(orderId) : baseUrl()); } catch(e){}
  }
  function readLink(){
    const v = new URLSearchParams(location.search || '').get('order');
    return (v && /^[0-9a-fA-F-]{36}$/.test(v)) ? v : null;
  }
  async function copyLink(text){
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly','');
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      toast('Link copied', 'ok');
    } catch(e){
      openModal('<div class="modal-h"><h3>Copy this link</h3></div>' +
        '<div class="modal-b"><input id="cpBox" type="text" class="searchbox mono" readonly value="' + esc(text) + '"></div>' +
        '<div class="modal-f"><button class="btn primary" id="cpDone" type="button">Done</button></div>');
      const b = document.getElementById('cpBox'); if (b){ b.focus(); b.select(); }
      const dn = document.getElementById('cpDone'); if (dn) dn.addEventListener('click', closeModal);
    }
  }

  let session = null, me = null, customer = null;
  let isStaff = false, allCustomers = [], viewAs = null;
  let orders = [], lines = [], configs = [], batches = [], tracking = [], units = [], locations = [];
  let currentId = null, query = '';

  /* ---------- auth ---------- */
  async function init(){
    if (!SB){ $('loginErr').textContent = 'Could not load the sign-in library. Check your connection and refresh.'; return; }
    const { data } = await SB.auth.getSession();
    session = data.session;
    SB.auth.onAuthStateChange(function(_e, s){ session = s; render(); });
    render();
  }
  async function render(){
    if (!session){
      $('loginView').style.display = '';
      $('app').style.display = 'none';
      $('topbar').style.display = 'none';
      return;
    }
    $('loginView').style.display = 'none';
    $('whoEmail').textContent = session.user.email || '';
    const cu = await SB.from('customer_users').select('*').eq('user_id', session.user.id).limit(1);
    me = (cu.data || [])[0];

    if (!me || !me.active){
      /* Not a customer login. NovaTech staff can still open this page to see
         exactly what a customer sees, so check the roster before refusing. */
      const st = await SB.from('staff')
        .select('name,active,can_view_orders,can_manage_orders,can_admin_orders,is_admin')
        .eq('user_id', session.user.id).limit(1);
      const r = (st.data || [])[0];
      const staffOk = r && r.active &&
        (r.can_view_orders || r.can_manage_orders || r.can_admin_orders || r.is_admin);
      if (staffOk){
        isStaff = true;
        const cs = await SB.from('customers').select('*').eq('active', true).order('name');
        allCustomers = cs.data || [];
        if (!allCustomers.length){
          $('app').style.display = ''; $('topbar').style.display = '';
          $('listView').innerHTML = '<div class="card"><h1>No customers yet</h1>' +
            '<p class="muted">Add one in the dashboard\u2019s Admin page first.</p></div>';
          return;
        }
        if (!viewAs) viewAs = allCustomers[0].id;
        me = { customer_id: viewAs };
        $('app').style.display = ''; $('topbar').style.display = '';
        await load();
        return;
      }
      $('app').style.display = '';
      $('topbar').style.display = '';
      $('custName').textContent = '';
      $('listView').innerHTML = '<div class="card"><h1>Not set up yet</h1>' +
        '<p class="muted">This login is not linked to a customer account. Ask your NovaTech contact to enable it.</p></div>';
      $('detailView').style.display = 'none';
      return;
    }
    $('app').style.display = '';
    $('topbar').style.display = '';
    await load();
  }
  $('go').addEventListener('click', signIn);
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') signIn(); });
  $('em').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('pw').focus(); });
  async function signIn(){
    const err = $('loginErr'); err.textContent = '';
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Signing in\u2026';
    const r = await SB.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (r.error) err.textContent = r.error.message || 'Could not sign in.';
  }
  $('signOut').addEventListener('click', function(){ SB.auth.signOut(); });

  /* ---------- data ---------- */
  async function load(){
    $('listView').innerHTML =
      '<div class="page-head"><h1>Your orders</h1></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:32%"></div>' +
        '<div class="skel skel-line" style="width:64%"></div></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:28%"></div>' +
        '<div class="skel skel-line" style="width:55%"></div></div>' +
      '<div class="skel-card"><div class="skel skel-line" style="width:36%"></div>' +
        '<div class="skel skel-line" style="width:48%"></div></div>';
    const [c, o, cf, lo] = await Promise.all([
      SB.from('customers').select('*').eq('id', me.customer_id).limit(1),
      SB.from('orders').select('*').eq('customer_id', me.customer_id).eq('archived', false).order('created_at', { ascending:false }),
      SB.from('configs').select('*').eq('customer_id', me.customer_id),
      SB.from('ship_to_locations').select('*').eq('customer_id', me.customer_id)
    ]);
    customer = (c.data || [])[0];
    orders = o.data || [];
    configs = cf.data || [];
    locations = lo.data || [];
    $('custName').textContent = customer ? customer.name : '';
    const pick = $('staffPick');
    if (isStaff && pick){
      pick.style.display = '';
      pick.innerHTML = '<span class="staffbadge">Staff preview</span> ' +
        '<select id="viewAs" class="pickbox">' + allCustomers.map(function(c){
          return '<option value="' + esc(c.id) + '"' + (c.id === viewAs ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }).join('') + '</select>';
      $('viewAs').addEventListener('change', async function(){
        viewAs = this.value;
        me = { customer_id: viewAs };
        currentId = null; query = ''; setUrl(null);
        $('detailView').style.display = 'none';
        await load();
      });
    }
    const ids = orders.map(function(x){ return x.id; });
    if (ids.length){
      const [ln, ba, un] = await Promise.all([
        SB.from('order_lines').select('*').in('order_id', ids).order('position'),
        SB.from('batches').select('*').in('order_id', ids).order('batch_no'),
        SB.from('pc_log').select('id,serial,order_id,batch_id,config_id,unit_status').in('order_id', ids).order('serial')
      ]);
      lines = ln.data || []; batches = ba.data || []; units = un.data || [];
      const bids = batches.map(function(b){ return b.id; });
      if (bids.length){
        const tr = await SB.from('batch_tracking').select('*').in('batch_id', bids);
        tracking = tr.data || [];
      } else tracking = [];
    } else { lines = []; batches = []; units = []; tracking = []; }
    renderList();
    const want = readLink();
    if (want && orders.some(function(o){ return o.id === want; })) openOrder(want);
    else if (want) toast('That order is not on your account.', 'bad', 6000);
  }

  /* ---------- helpers ---------- */
  function cfgById(id){ return configs.find(function(c){ return c.id === id; }); }
  function specLines(cfg){
    if (!cfg) return [];
    const sticks = cfg.ram_sticks || 1;
    const ramBase = String(cfg.ram || '').replace(/^ram\s+/i, '').trim();
    const caseN = String(cfg.pc_case || '').replace(/\s*\bcases?\b\s*/ig, ' ').replace(/\s+/g, ' ').trim();
    return [['Case', caseN], ['CPU', (cfg.cpu||'').trim()], ['GPU', (cfg.gpu||'').trim()],
            ['RAM', ramBase ? ((sticks > 1 ? sticks + 'x ' : '') + ramBase) : ''],
            ['Storage', (cfg.storage||'').trim()]]
      .filter(function(p){ return p[1]; });
  }
  function stats(o){
    const mine = units.filter(function(u){ return u.order_id === o.id; });
    const ordered = lines.filter(function(l){ return l.order_id === o.id; })
      .reduce(function(a,l){ return a + (+l.qty_ordered||0); }, 0);
    let b=0,a=0,s=0;
    mine.forEach(function(u){
      if (u.unit_status === 'shipped') s++; else if (u.unit_status === 'assigned') a++; else b++;
    });
    return { ordered:ordered, built:b, assigned:a, shipped:s, made:b+a+s, remaining:Math.max(0, ordered-(b+a+s)) };
  }
  function statusOf(st){
    if (st.made === 0) return { c:'n', l:'Not started' };
    if (st.shipped > 0 && st.ordered > 0 && st.shipped >= st.ordered) return { c:'k', l:'Complete' };
    if (st.shipped > 0) return { c:'i', l:'Partially shipped' };
    if (st.remaining === 0) return { c:'w', l:'Ready to ship' };
    return { c:'n', l:'In production' };
  }
  function trackUrl(carrier, n){
    const e = encodeURIComponent(String(n||'').trim());
    if (!e) return '';
    switch (String(carrier||'').trim().toLowerCase()){
      case 'ups':   return 'https://www.ups.com/track?loc=en_US&requester=QUIC&tracknum=' + e;
      case 'fedex': return 'https://www.fedex.com/fedextrack/?trknbr=' + e;
      case 'usps':  return 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + e;
      default: return '';
    }
  }
  function trackHtml(carrier, nums){
    const list = (Array.isArray(nums) ? nums : [nums]).filter(Boolean);
    if (!list.length) return '<span class="muted">\u2014</span>';
    return list.map(function(n){
      const u = trackUrl(carrier, n);
      return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(n) + '</a>' : esc(n);
    }).join(', ');
  }
  /* the destination lives on ship_to_locations, not on the batch */
  function locOf(b){ return b && b.location_id ? locations.find(function(l){ return l.id === b.location_id; }) : null; }
  function locName(b){
    const l = locOf(b);
    return l ? l.store_name : 'Destination to be confirmed';
  }
  function locNum(b){ const l = locOf(b); return (l && l.store_number) ? l.store_number : ''; }
  function locLine(b){
    const l = locOf(b);
    if (!l) return '';
    return [l.address1, l.address2, [l.city, l.state].filter(Boolean).join(', '), l.zip].filter(Boolean).join(' \u00b7 ');
  }

  /* ---------- list ---------- */
  function renderList(){
    setUrl(null);
    $('detailView').style.display = 'none';
    $('listView').style.display = '';
    const q = query.trim().toLowerCase();
    const rows = orders.filter(function(o){
      return !q || (o.invoice_no||'').toLowerCase().indexOf(q) >= 0 || (o.po_number||'').toLowerCase().indexOf(q) >= 0;
    });
    $('listView').innerHTML =
      '<h1>Your orders</h1>' +
      '<p class="muted" style="margin-top:0;">Progress, shipments, tracking numbers and serial numbers for everything you have ordered.</p>' +
      '<div class="toolbar">' +
        '<input class="searchbox" id="q" type="text" placeholder="Search invoice or PO" value="' + esc(query) + '">' +
        '<button class="btn" id="lookup" type="button">Find a serial</button>' +
      '</div>' +
      (rows.length ? rows.map(function(o){
        const st = stats(o), s = statusOf(st);
        const pct = function(n){ return st.ordered ? Math.min(100, n/st.ordered*100) : 0; };
        return '<div class="orow" role="button" tabindex="0" data-id="' + esc(o.id) + '">' +
          '<div><div class="inv"><span class="inv-lbl">Invoice #</span>' +
            '<span class="mono">' + esc(o.invoice_no) + '</span>' +
            '<span class="chip ' + s.c + '">' + s.l + '</span></div>' +
            '<div class="sub">' + (o.po_number ? 'PO ' + esc(o.po_number) + ' &middot; ' : '') +
            (o.due_date ? 'due ' + esc(fmtDate(o.due_date)) : 'no due date') + '</div></div>' +
          '<div><div class="bar">' +
            '<i class="s" style="width:' + pct(st.shipped) + '%"></i>' +
            '<i class="a" style="width:' + pct(st.assigned) + '%"></i>' +
            '<i class="b" style="width:' + pct(st.built) + '%"></i>' +
          '</div><div class="barlbl">' + num(st.shipped) + ' of ' + num(st.ordered) + ' shipped &middot; ' + num(st.made) + ' built</div></div>' +
          '<div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>' +
        '</div>';
      }).join('')
      : '<div class="card"><div class="empty">' +
        '<div class="empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2V4a1 1 0 0 1 1-1z"/><path d="M9 12h6M9 16h4"/></svg></div>' +
        '<p>' + (orders.length ? 'No orders match that search.' : 'Nothing here yet.') + '</p>' +
        '<p class="muted">' + (orders.length ? 'Try a different invoice or PO number.' : 'Orders appear here once NovaTech creates them.') + '</p>' +
        '</div></div>');
    const qi = $('q');
    if (qi) qi.addEventListener('input', function(){ query = this.value; renderList(); $('q').focus(); });
    const lk = $('lookup');
    if (lk) lk.addEventListener('click', serialLookup);
  }

  /* ---------- detail ---------- */
  function openOrder(id){
    currentId = id;
    const o = orders.find(function(x){ return x.id === id; });
    if (!o) return;
    setUrl(id);
    const st = stats(o), s = statusOf(st);
    const mine = batches.filter(function(b){ return b.order_id === id; });
    const cfgName = {}; configs.forEach(function(c){ cfgName[c.id] = c.name; });

    $('listView').style.display = 'none';
    $('detailView').style.display = '';
    $('detailView').innerHTML =
      '<div class="back"><button class="btn" id="back" type="button">&larr; All orders</button>' +
      ' <button class="btn" id="csv" type="button">Download CSV</button>' +
      ' <button class="btn" id="prt" type="button">Print</button>' +
      ' <button class="btn" id="share" type="button">Copy link</button>' +
      (o.invoice_pdf_name ? ' <button class="btn primary" id="pdf" type="button">Invoice PDF</button>' : '') +
      '</div>' +
      '<h1>Invoice <span class="mono">' + esc(o.invoice_no) + '</span> <span class="chip ' + s.c + '">' + s.l + '</span></h1>' +
      '<p class="muted">' + (o.po_number ? 'PO ' + esc(o.po_number) + ' &middot; ' : '') +
        (o.due_date ? 'due ' + esc(fmtDate(o.due_date)) : '') + '</p>' +
      '<div class="sum">' +
        '<div class="sumc" title="Total quantity on this invoice"><div class="sumv">' + num(st.ordered) + '</div><div class="suml">Ordered</div></div>' +
        '<div class="sumc" title="Assembled and given a serial number"><div class="sumv">' + num(st.made) + '</div><div class="suml">Built</div></div>' +
        '<div class="sumc ok" title="Dispatched to a store"><div class="sumv">' + num(st.shipped) + '</div><div class="suml">Shipped</div></div>' +
        '<div class="sumc rem" title="Still to be built"><div class="sumv">' + num(st.remaining) + '</div><div class="suml">Remaining</div></div>' +
      '</div>' +
      '<div class="card"><h2>Shipments <span class="subtle">each shipment goes to one store</span></h2>' +
      (mine.length ? mine.map(function(b){
        const bu = units.filter(function(u){ return u.batch_id === b.id; });
        const tk = tracking.filter(function(t){ return t.batch_id === b.id; });
        const per = {}; tk.forEach(function(t){ if (t.unit_id) per[t.unit_id] = t.tracking_no; });
        const wide = tk.filter(function(t){ return !t.unit_id; }).map(function(t){ return t.tracking_no; });
        const shipped = b.status === 'shipped';
        return '<div class="batch">' +
          '<div class="bhead">' +
            '<div><b>Batch ' + b.batch_no + '</b><br><span class="chip ' + (shipped?'k':'w') + '">' + (shipped?'Shipped':'Preparing') + '</span></div>' +
            '<div><b>' + esc(locName(b)) + '</b>' +
              (locNum(b) ? '<span class="storenum">Store ' + esc(locNum(b)) + '</span>' : '') +
              '<div class="sub">' + esc(locLine(b) || '') + '</div></div>' +
            '<div class="mono">' + num(bu.length) + ' units<div class="sub">' +
              (b.carrier ? esc(b.carrier) + ' &middot; ' : '') + (b.ship_date ? esc(fmtDate(b.ship_date)) : 'not yet shipped') + '</div></div>' +
            '<div><button class="btn" data-x="' + esc(b.id) + '" type="button">Details</button></div>' +
          '</div>' +
          '<div class="bbody" id="bb_' + esc(b.id) + '" style="display:none;">' +
            '<div class="twrap"><table><thead><tr><th>Serial</th><th>Model</th><th>Tracking</th></tr></thead><tbody>' +
            bu.map(function(u){
              return '<tr><td class="mono">' + esc(u.serial) + '</td>' +
                '<td><span class="cfg" data-cfg="' + esc(u.config_id) + '" tabindex="0">' + esc(cfgName[u.config_id] || '\u2014') + '</span></td>' +
                '<td class="mono">' + trackHtml(b.carrier, per[u.id] ? [per[u.id]] : wide) + '</td></tr>';
            }).join('') + '</tbody></table></div>' +
          '</div>' +
        '</div>';
      }).join('')
      : '<div class="empty">' +
        '<div class="empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>' +
        '<p>Nothing has shipped yet.</p><p class="muted">Shipments appear here as they leave the building.</p></div>') +
      '</div>';

    $('back').addEventListener('click', renderList);
    $('share').addEventListener('click', function(){ copyLink(linkFor(o.id)); });
    if ($('pdf')) $('pdf').addEventListener('click', async function(){
      const btn = this; btn.disabled = true; btn.textContent = 'Opening\u2026';
      const r = await SB.storage.from('order-invoices').createSignedUrl(o.id + '/invoice.pdf', 120);
      btn.disabled = false; btn.textContent = 'Invoice PDF';
      if (r.error || !r.data || !r.data.signedUrl){
        toast('That invoice PDF could not be opened. Please ask your NovaTech contact.', 'bad', 7000);
        return;
      }
      window.open(r.data.signedUrl, '_blank', 'noopener');
    });
    $('csv').addEventListener('click', function(){ exportCsv(o); });
    $('prt').addEventListener('click', function(){
      document.querySelectorAll('.bbody').forEach(function(x){ x.style.display = ''; });
      window.print();
    });
    document.querySelectorAll('[data-x]').forEach(function(btn){
      btn.addEventListener('click', function(){
        const bd = $('bb_' + btn.getAttribute('data-x'));
        const open = bd.style.display !== 'none';
        bd.style.display = open ? 'none' : '';
        btn.textContent = open ? 'Details' : 'Hide';
      });
    });
  }
  $('listView').addEventListener('click', function(e){
    const r = e.target.closest('.orow'); if (r) openOrder(r.getAttribute('data-id'));
  });
  $('listView').addEventListener('keydown', function(e){
    const r = e.target.closest('.orow');
    if (r && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openOrder(r.getAttribute('data-id')); }
  });

  /* ---------- serial lookup ---------- */
  function serialLookup(){
    const bg = openModal(
      '<div class="modal-h"><h3>Find a serial number</h3>' +
      '<p>Type or scan a serial to see which order and shipment it belongs to.</p></div>' +
      '<div class="modal-b">' +
        '<div class="field"><label for="snIn">Serial</label>' +
        '<input id="snIn" type="text" placeholder="NT26000175" autocomplete="off" spellcheck="false"></div>' +
        '<div class="lookup-out" id="snOut"></div>' +
      '</div>' +
      '<div class="modal-f"><button class="btn" id="snClose" type="button">Close</button>' +
      '<button class="btn primary" id="snGo" type="button">Look up</button></div>');

    const out = bg.querySelector('#snOut');
    bg.querySelector('#snClose').addEventListener('click', closeModal);
    bg.querySelector('#snIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });
    bg.querySelector('#snGo').addEventListener('click', run);

    function run(){
      const sn = bg.querySelector('#snIn').value.trim();
      if (!sn){ out.innerHTML = '<span class="muted">Enter a serial number.</span>'; return; }
      const u = units.find(function(x){ return x.serial.toUpperCase() === sn.toUpperCase(); });
      if (!u){
        out.innerHTML = '<span class="chip w">Not found</span> ' +
          '<span class="muted">No unit with that serial on your orders.</span>';
        return;
      }
      const o = orders.find(function(x){ return x.id === u.order_id; });
      const b = u.batch_id ? batches.find(function(x){ return x.id === u.batch_id; }) : null;
      const t = tracking.find(function(x){ return x.unit_id === u.id; }) ||
                (b ? tracking.find(function(x){ return x.batch_id === b.id && !x.unit_id; }) : null);
      const cfg = cfgById(u.config_id);
      const st = u.unit_status === 'shipped' ? 'k' : (u.unit_status === 'assigned' ? 'i' : 'n');
      out.innerHTML =
        '<div><span class="mono" style="font-weight:700;">' + esc(u.serial) + '</span> ' +
          '<span class="chip ' + st + '">' + esc(u.unit_status || 'built') + '</span></div>' +
        '<dl>' +
          '<dt>Invoice</dt><dd>' + esc(o ? o.invoice_no : '\u2014') + '</dd>' +
          (cfg ? '<dt>Model</dt><dd>' + esc(cfg.name) + '</dd>' : '') +
          (b ? '<dt>Shipment</dt><dd>Batch ' + b.batch_no + (locName(b) ? ' \u00b7 ' + esc(locName(b)) : '') + '</dd>' : '') +
          (t ? '<dt>Tracking</dt><dd>' + trackHtml(b ? b.carrier : '', [t.tracking_no]) + '</dd>' : '') +
          (b && b.ship_date ? '<dt>Shipped</dt><dd>' + esc(fmtDate(b.ship_date)) + '</dd>' : '') +
        '</dl>' +
        (o ? '<p style="margin-bottom:0;"><button class="btn sm" id="snOpen" type="button">Open invoice ' + esc(o.invoice_no) + '</button></p>' : '');
      const go = out.querySelector('#snOpen');
      if (go) go.addEventListener('click', function(){ closeModal(); openOrder(o.id); });
    }
  }

  /* ---------- csv ---------- */
  function exportCsv(o){
    const cfgName = {}; configs.forEach(function(c){ cfgName[c.id] = c.name; });
    const head = ['Serial','Model','Invoice','Batch','Store','Store #','Address','Carrier','Tracking','Ship date','Status'];
    const rows = units.filter(function(u){ return u.order_id === o.id; }).map(function(u){
      const b = u.batch_id ? batches.find(function(x){ return x.id === u.batch_id; }) : null;
      const t = tracking.find(function(x){ return x.unit_id === u.id; }) ||
                (b ? tracking.find(function(x){ return x.batch_id === b.id && !x.unit_id; }) : null);
      return [u.serial, cfgName[u.config_id] || '', o.invoice_no, b ? b.batch_no : '',
              b ? locName(b) : '', b ? locNum(b) : '', b ? locLine(b) : '', b ? (b.carrier || '') : '',
              t ? t.tracking_no : '', b && b.ship_date ? b.ship_date : '', u.unit_status || ''];
    });
    const csv = [head].concat(rows).map(function(r){
      return r.map(function(c){ return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'invoice-' + o.invoice_no + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    toast('CSV downloaded \u00b7 ' + rows.length + ' unit' + (rows.length === 1 ? '' : 's'), 'ok');
  }

  /* ---------- spec popover ---------- */
  let popFor = null;
  function popHide(){ $('pop').style.display = 'none'; popFor = null; }
  function popShow(el){
    const cfg = cfgById(el.getAttribute('data-cfg'));
    if (!cfg) return;
    const p = $('pop');
    const sp = specLines(cfg);
    p.innerHTML = '<h3>' + esc(cfg.name) + '</h3>' +
      (sp.length ? '<dl>' + sp.map(function(x){ return '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl>'
                 : '<p class="muted">No specs recorded.</p>');
    p.style.display = 'block';
    popFor = el;
    const r = el.getBoundingClientRect();
    let left = Math.min(r.left, window.innerWidth - p.offsetWidth - 12);
    if (left < 12) left = 12;
    let top = r.bottom + 6;
    if (top + p.offsetHeight > window.innerHeight - 12) top = Math.max(12, r.top - p.offsetHeight - 6);
    p.style.left = Math.round(left) + 'px';
    p.style.top = Math.round(top) + 'px';
  }
  document.addEventListener('mouseover', function(e){
    const a = e.target.closest && e.target.closest('.cfg');
    if (a && a !== popFor) popShow(a);
  });
  document.addEventListener('mouseout', function(e){
    const a = e.target.closest && e.target.closest('.cfg');
    if (a && a === popFor) popHide();
  });
  document.addEventListener('click', function(e){
    const a = e.target.closest && e.target.closest('.cfg');
    if (a){ e.preventDefault(); if (a === popFor) popHide(); else popShow(a); return; }
    if (popFor) popHide();
  });
  document.addEventListener('focusin', function(e){
    const a = e.target.closest && e.target.closest('.cfg');
    if (a) popShow(a); else if (popFor) popHide();
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') popHide(); });
  window.addEventListener('scroll', popHide, true);
  window.addEventListener('resize', popHide);

  init();
})();
</script>
</body>
