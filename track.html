<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- light only (data-theme above): on a dark-mode device the unthemed dark
     rules used to half-apply and blank out the carrier buttons -->
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Shipment tracking</title>
<link rel="preconnect" href="https://vajrnbniwkvnkkkigeit.supabase.co" crossorigin>
<style>

  :root{
    color-scheme:light;
    /* the Notion app sets its interface in the platform face: SF Pro on a Mac
       or iPhone, Segoe UI on Windows. Figures ride it with tnum. */
    --font-ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";
    --font-num:var(--font-ui);
    --ink:#262521; --charcoal:#262521; --ink-deep:#0d0d0c; --on-ink:#ffffff; --muted:#65635e; --faint:#7c7a75;
    --stone:#a5a4a0; --disabled:#c4c3bf;
    --bg:#ffffff; --paper:#ffffff; --soft:#f7f7f5;
    --line:#e3e2df; --line-strong:#d1cfc9;
    --accent:#1877e0; --accent-fg:#1565c0; --accent-hover:#0c69cf;
    --accent-soft:#e3f0fd; --accent-line:#a6cdf6; --accent-ink:#ffffff;
    --link:#1565c0; --link-hover:#114f9c;
    --hue-rma:#1f7bc7;
    /* hue drives the dot and any fill; the pastel tint sits behind and the
       label uses the family's deep variant so it clears 4.5:1 */
    --ok:#2e9455;   --ok-ink:#1c3829;   --ok-bg:#d5efdb;   --ok-line:#b4dfc0;
    --warn:#de6808; --warn-ink:#49290e; --warn-bg:#fadec9; --warn-line:#f2c6a3;
    --bad:#dc3e39;  --bad-ink:#5d1715;  --bad-bg:#ffe2dd;  --bad-line:#f6c3bb;
    --info:#2678bd; --info-ink:#183347; --info-bg:#d3e5ef; --info-line:#b4d1e2;
    /* a status colour as text: the bright hues above stay on dots, bars and
       borders; words and figures use -fg, which clears 4.5:1 */
    --ok-fg:#23804a; --warn-fg:#b25405; --bad-fg:#c8322e;
    /* the keyboard focus outline, one colour everywhere */
    --focus:#1877e0;
    --e1:rgba(15,15,15,.04) 0 1px 2px 0;
    --e2:rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 3px 6px, rgba(15,15,15,.2) 0 9px 24px;
    --e3:rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 5px 10px, rgba(15,15,15,.2) 0 15px 40px;
    --e4:rgba(15,15,15,.05) 0 0 0 1px, rgba(15,15,15,.1) 0 5px 10px, rgba(15,15,15,.2) 0 15px 40px;
    --scrim:rgba(15,15,15,.6);
    /* liquid glass: one tinted surface plus its opaque stand-in, and the two
       easing curves every piece of chrome moves on */
    --glass:rgba(48,52,62,.68); --glass-solid:#2c2f38;
    --tab-chip:#f6f5f4; --tab-chip-ink:#15171d;
    --ease-drawer:cubic-bezier(.32,.72,0,1);
    --ease-out:cubic-bezier(.2,.8,.3,1);
    --ring:0 0 0 2px rgba(24,119,224,.35);
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s4b:20px;
    --s5:24px; --s6:32px; --s6b:40px; --s7:48px; --s8:64px;
    --r-xs:4px; --r-tag:4px; --r-sm:6px; --r-md:10px;
    --r-lg:12px; --r-xl:16px; --r-pill:9999px;
    --t:170ms cubic-bezier(.2,.6,.2,1);
    --t-slow:220ms cubic-bezier(.2,.6,.2,1);
      /* Notion pass: the sidebar and hover fills, the warm field fill on an
       inset hairline, the purple of in-progress work, tag dots, the key of
       a segmented switch and the toast slip */
    --side:#f7f7f5; --hover:rgba(55,53,47,.06); --press:rgba(55,53,47,.1);
    --nav-ink:#4b4a46; --nav-ico:#7f7e7a; --nav-sel:rgba(55,53,47,.08);
    --field:rgba(242,241,238,.6); --field-line:rgba(15,15,15,.1); --field-hover:rgba(15,15,15,.2);
    --series-bg:#e8deee; --series-ink:#412454;
    --dot-ok:#47a56c; --dot-warn:#e37a22; --dot-bad:#e7574b; --dot-series:#9968cc; --dot-neutral:#86857f;
    --series:#8553c2; --bad-solid:#dc3e39; --raised:var(--paper); --raised-line:var(--line);
    --seg-on:#ffffff; --toast-bg:#2f2f2f; --toast-line:transparent;
}
  :root[data-theme="dark"]{
    color-scheme:dark;
    /* Notion's dark theme: a near-black page beside a lifted sidebar */
    --ink:#e4e4e4; --charcoal:#e4e4e4; --muted:#a8a8a8; --faint:#8c8c8c;
    --stone:#6f6f6f; --disabled:#4f4f4f;
    --bg:#191919; --paper:#191919; --soft:#252525;
    --line:#343434;
    --line-strong:#484848;
    --ink-deep:#f3f3f3; --on-ink:#191919;
    --accent:#2383e2; --accent-fg:#5aa8ea; --accent-hover:#3a92e8;
    --accent-soft:color-mix(in srgb, #2383e2 18%, #191919);
    --accent-line:color-mix(in srgb, #2383e2 45%, #191919);
    --accent-ink:#ffffff;
    --link:#5aa8ea; --link-hover:#7fbcf0;
    --hue-rma:#4fa5e6;
    --ok:#3fab63;   --ok-ink:#cfe6d6;
    --ok-bg:color-mix(in srgb, #3fab63 24%, #191919);
    --ok-line:color-mix(in srgb, #3fab63 42%, #191919);
    --warn:#dc7a28; --warn-ink:#f3d9c2;
    --warn-bg:color-mix(in srgb, #dc7a28 24%, #191919);
    --warn-line:color-mix(in srgb, #dc7a28 42%, #191919);
    --bad:#d54a42;  --bad-ink:#f4cdc9;
    --bad-bg:color-mix(in srgb, #d54a42 24%, #191919);
    --bad-line:color-mix(in srgb, #d54a42 42%, #191919);
    --info:#3d7fe0; --info-ink:#cfdcf2;
    --info-bg:color-mix(in srgb, #3d7fe0 26%, #191919);
    --info-line:color-mix(in srgb, #3d7fe0 45%, #191919);
    --ok-fg:#5cc487; --warn-fg:#f0964c; --bad-fg:#f06d63;
    --focus:#5aa8ea;
    --e1:0 1px 2px rgba(0,0,0,.3);
    --e2:rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.2) 0 3px 6px, rgba(15,15,15,.4) 0 9px 24px;
    --e3:rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.2) 0 5px 10px, rgba(15,15,15,.4) 0 15px 40px;
    --e4:rgba(15,15,15,.1) 0 0 0 1px, rgba(15,15,15,.2) 0 5px 10px, rgba(15,15,15,.4) 0 15px 40px;
    --scrim:rgba(0,0,0,.6);
    --glass:rgba(32,32,32,.68); --glass-solid:#202020;
    --tab-chip:rgba(255,255,255,.16); --tab-chip-ink:#ececec;
    --ring:0 0 0 2px rgba(35,131,226,.45);
      --side:#202020; --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09);
    --nav-ink:#b4b4b4; --nav-ico:#8c8c8c; --nav-sel:rgba(255,255,255,.07);
    --field:rgba(255,255,255,.055); --field-line:rgba(255,255,255,.09); --field-hover:rgba(255,255,255,.2);
    --series-bg:color-mix(in srgb, #a472ea 24%, #191919); --series-ink:#e2d4f5;
    --series:#a472ea; --bad-solid:#d54a42; --raised:#252525; --raised-line:#373737;
    --seg-on:rgba(255,255,255,.13); --toast-bg:#2f2f2f; --toast-line:rgba(255,255,255,.09);
}
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  /* the rubber-band area past the top of the page is the html background,
     not the body's — without this it flashes white in dark mode */
  html{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:14px; line-height:1.50;
    font-feature-settings:normal;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background var(--t-slow), color var(--t-slow);
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--accent-fg); text-decoration:none; }
  a:hover{ color:var(--accent-hover); }
  /* one focus outline, visible on any surface; fields keep the accent ring */
  a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:none; border-color:var(--accent); box-shadow:var(--ring);
  }
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  h1,h2,h3,h4{ font-weight:600; letter-spacing:-0.5px; }
  h3,h4{ letter-spacing:0; }
  b, strong{ font-weight:600; }
  ::placeholder{ color:var(--stone); opacity:1; }
  input[type="checkbox"], input[type="radio"]{ accent-color:var(--accent); }
  .muted{ color:var(--muted); font-size:12.5px; }
  .subtle{ font-size:11.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); margin-left:var(--s2); }

  /* ---------- top bar ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:var(--s5);
    /* brand and actions land on the same columns as the page content below */
    padding:var(--s3) max(var(--s5), calc((100% - 1600px) / 2)); background:var(--paper);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; flex-wrap:nowrap;
    box-shadow:var(--e1);
  }
  header.top::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:var(--line); pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:var(--s4); min-width:0; }
  .brand img{ height:30px; width:auto; flex:0 0 auto; }
  .brand img.is-dark, .brand img.is-mark{ display:none; }
  .so-ico{ display:none; width:16px; height:16px; }
  :root[data-theme="dark"] .brand img.is-light{ display:none; }
  :root[data-theme="dark"] .brand img.is-dark{ display:block; }
  /* a hairline keeps the wordmark from touching the page label */
  .brand > div{ position:relative; padding-left:var(--s4); min-width:0; }
  .brand > div::before{
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:1px; height:28px;
    background:var(--line-strong);
  }
  .brand b{ font-size:15px; letter-spacing:0; display:block; line-height:1.3; }
  .brand span{ display:block; color:var(--faint); font-size:12px; line-height:1.3; }

  .pmenu{ display:flex; align-items:center; gap:var(--s1); margin:0 auto 0 var(--s3); }
  .pmenu a{
    position:relative; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted);
    text-decoration:none; padding:8px 16px; line-height:1.3; border-radius:var(--r-pill) !important; white-space:nowrap; cursor:pointer;
  }
  .pmenu a:hover{ background:var(--soft); color:var(--ink); }
  .pmenu a.on{ background:var(--ink); color:var(--paper); }
  .pbadge{
    display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
    border-radius:var(--r-pill); background:var(--warn); color:#fff; font-size:11px; font-weight:700; line-height:1;
  }
  .who{ display:flex; align-items:center; gap:var(--s4); flex-wrap:nowrap; min-width:0; }
  .who-em{ font-size:12.5px; color:var(--muted); }
  /* identity on one side of the rule, actions on the other */
  .who #themeBtn{ position:relative; margin-left:var(--s3); }
  .who #themeBtn::before{
    content:""; position:absolute; left:calc(var(--s3) * -1 - 1px); top:50%; transform:translateY(-50%);
    width:1px; height:24px;
    background:var(--line-strong);
  }

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    border-radius:var(--r-sm); padding:8px 12px; min-height:34px; font:inherit; font-size:14px; font-weight:500;
    /* an explicit line-height — the inherited 1.55 makes a 13px label 20px tall
       and pushes the button past its min-height */
    line-height:1.2;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; transition:border-color var(--t), background var(--t), transform var(--t), box-shadow var(--t);
  }
  .btn:hover{ border-color:var(--muted); box-shadow:var(--e1); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); padding:10px 18px; min-height:40px; }
  .btn.primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); box-shadow:none; }
  .btn.sm{ padding:4px 12px; min-height:28px; font-size:12.5px; }
  .back .btn, .toolbar .btn, .staffbadge{ white-space:nowrap; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; min-height:32px; padding:0; border:1px solid var(--line-strong);
    background:var(--paper); color:var(--muted); border-radius:var(--r-pill); cursor:pointer;
    transition:color var(--t), border-color var(--t), background var(--t), box-shadow var(--t);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--muted); box-shadow:none; }
  .icon-btn svg{ width:17px; height:17px; }
  :root[data-theme="light"] .i-sun{ display:none; }
  :root:not([data-theme="light"]) .i-moon{ display:none; }

  /* ---------- layout ---------- */
  .wrap{ max-width:1600px; margin:0 auto; padding:var(--s7) var(--s6) var(--s8); }
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s5); margin-bottom:var(--s5); box-shadow:none;
  }
  h1{ font-size:24px; letter-spacing:0; margin:0 0 var(--s2); line-height:1.2; }
  h2{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:0 0 var(--s4b); }
  .page-head{ margin-bottom:var(--s5); }
  /* the status chip is a sibling of the number, not punctuation after it */
  .inv-h1{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; row-gap:var(--s2); }

  /* ---------- login ---------- */
  .login{ max-width:400px; margin:11vh auto; padding:0 var(--s4); animation:rise var(--t-slow) both; }
  .field{ margin-bottom:var(--s3); }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:var(--s1); }
  .field input, .pickbox, .searchbox{
    width:100%; height:44px; padding:0 var(--s4); font:inherit; font-size:14px;
    border:1px solid var(--field-line); border-radius:var(--r-sm);
    background:var(--field); color:var(--ink);
    transition:border-color var(--t), box-shadow var(--t);
  }
  .field input:focus, .pickbox:focus, .searchbox:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .err{ color:var(--bad-fg); font-size:12.5px; min-height:1.2em; margin-top:var(--s2); font-weight:600; }

  /* ---------- order rows ---------- */
  .toolbar{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .searchbox{ flex:1 1 260px; height:44px; font-size:14px; }
  .orow{
    display:grid; grid-template-columns:minmax(0,1fr) auto 210px 28px; gap:var(--s5);
    align-items:center; padding:var(--s4); border:1px solid var(--line);
    border-radius:var(--r-md); background:var(--paper); margin-bottom:var(--s3);
    cursor:pointer; box-shadow:var(--e1);
    transition:border-color var(--t), box-shadow var(--t), transform var(--t);
    animation:rise var(--t-slow) both;
  }
  .orow:hover{ border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); box-shadow:var(--e2); }
  .orow:hover .chev{ color:var(--accent-fg); }
  /* movement only on a real pointer: a tap fires a hover that sticks */
  @media (hover: hover) and (pointer: fine){
    .orow:hover{ transform:translateY(-1px); }
    .orow:hover .chev{ transform:translateX(3px); }
  }
  .orow:focus-visible{ outline:none; box-shadow:var(--ring); }
  .inv{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; font-weight:600; font-size:15px; }
  /* its own cell, so the row's align-items:center does the vertical centring */
  .ostat{ display:flex; align-items:center; justify-content:center; min-width:0; margin-right:var(--s4); }
  .ostat .chip{ flex:0 0 auto; }
  .inv-lbl{ font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--faint);  white-space:nowrap; }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .chev{ color:var(--faint); display:flex; justify-content:flex-end; transition:transform var(--t), color var(--t); }
  .chev svg{ width:18px; height:18px; }

  .chip{
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
    font-size:11.5px; font-weight:600; letter-spacing:.02em;
    padding:4px 10px; border-radius:var(--r-pill); border:1px solid transparent;
  }
  .chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--dot, currentColor); }
  .chip.n{ color:var(--muted);  background:var(--soft);      border-color:var(--line); }
  .chip.i{ color:var(--info-ink);   background:var(--info-bg);   border-color:var(--info-line); --dot:var(--info); }
  .chip.w{ color:var(--warn-ink);   background:var(--warn-bg);   border-color:var(--warn-line); --dot:var(--warn); }
  .chip.k{ color:var(--ok-ink);     background:var(--ok-bg);     border-color:var(--ok-line); --dot:var(--ok); }
  .chip.r{ color:var(--ink); background:color-mix(in srgb, #1fa5c4 14%, var(--paper)); border-color:color-mix(in srgb, #1fa5c4 45%, var(--paper)); --dot:#1fa5c4; }
  .chip.b{ color:var(--bad-ink);    background:var(--bad-bg);    border-color:var(--bad-line); --dot:var(--bad); }

  /* shipping issues: one line that opens into the batches needing attention */
  .shipx{
    margin:0 0 var(--s4); border:1px solid var(--warn-line); border-radius:var(--r-md);
    background:color-mix(in srgb, var(--warn-bg) 55%, var(--paper));
  }
  .shipx.bad{ border-color:var(--bad-line); background:color-mix(in srgb, var(--bad-bg) 55%, var(--paper)); }
  .shipx > summary{
    display:flex; align-items:center; flex-wrap:wrap; gap:4px var(--s3);
    min-height:44px; padding:8px var(--s4); cursor:pointer; list-style:none;
  }
  .shipx > summary::-webkit-details-marker{ display:none; }
  .shipx > summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-md); }
  .shipx-ico{ width:18px; height:18px; flex:0 0 auto; color:var(--warn); }
  .shipx.bad .shipx-ico{ color:var(--bad); }
  .shipx-t{ font-weight:600; font-size:13.5px; color:var(--warn-ink); }
  .shipx.bad .shipx-t{ color:var(--bad-ink); }
  .shipx-sub{ font-size:12.5px; color:var(--muted); }
  .shipx-chev{ width:16px; height:16px; margin-left:auto; flex:0 0 auto; color:var(--muted); transition:transform var(--t); }
  .shipx[open] .shipx-chev{ transform:rotate(180deg); }
  .shipx-list{ display:flex; flex-direction:column; gap:6px; padding:0 var(--s3) var(--s3); }
  button.shipx-row{
    display:grid; justify-items:start; gap:3px; width:100%; position:relative; margin:0;
    padding:10px 36px 10px 12px; text-align:left; font:inherit; font-size:13px; line-height:1.4;
    background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-sm); cursor:pointer;
  }
  @media (hover: hover) and (pointer: fine){
    button.shipx-row:hover{ background:var(--soft); border-color:var(--line-strong); }
  }
  button.shipx-row::after{
    content:""; position:absolute; right:16px; top:50%; width:7px; height:7px; margin-top:-4px;
    border:solid var(--muted); border-width:0 1.5px 1.5px 0; transform:rotate(-45deg);
  }
  .shipx-top{ display:flex; align-items:center; flex-wrap:wrap; gap:4px var(--s2); width:100%; }
  .shipx-place{ color:var(--muted); }
  .shipx-when{ margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .shipx-trk{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  /* the batch a strip row jumped to */
  .batch{ scroll-margin-top:var(--s4); }
  .batch.shipx-flash{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .shipx-chev{ transition:none; } }

  .bar{ height:7px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; display:flex; border:1px solid var(--line); }
  .bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .bar i.s{ background:var(--ok); } .bar i.a{ background:var(--accent); } .bar i.b{ background:#e6b800; }
  .barlbl{ font-family:var(--font-num); font-size:11.5px; color:var(--muted); margin-top:8px; font-variant-numeric:tabular-nums; }

  /* ---------- detail ---------- */
  .back{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-bottom:var(--s4); }
  .sum{ display:grid; grid-template-columns:repeat(5,1fr); gap:var(--s3); margin-bottom:var(--s5); }
  .sumc{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s4); box-shadow:none; animation:rise var(--t-slow) both;
  }
  .sumv{ font-family:var(--font-num); font-size:26px; font-weight:600; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .suml{ font-size:12px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--muted); margin-top:var(--s1); line-height:1.3; text-wrap:balance; }
  .sumc.ok .sumv{ color:var(--ok-fg); }
  .sumc.rem .sumv{ color:var(--muted); }
  .sumc.prep .sumv{ color:var(--accent-fg, var(--accent)); }
  /* the built yellow, deepened on light grounds so the number stays legible */
  .sumc.built .sumv{ color:#a88600; }
  :root[data-theme="dark"] .sumc.built .sumv{ color:#e6b800; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme]) .sumc.built .sumv{ color:#e6b800; } }

  /* skinny progress rail above the tiles */
  .oprog{ margin-bottom:var(--s4); }
  .oprog-bar{
    display:flex; height:8px; overflow:hidden; background:var(--soft);
    border:1px solid var(--line); border-radius:var(--r-pill);
  }
  .oprog-bar i{ display:block; height:100%; transition:width var(--t-slow); }
  .oprog-l{
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
    margin-top:var(--s2); font-size:12px; color:var(--muted);
  }
  .oprog-l b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .obill > summary{ display:flex; align-items:center; gap:var(--s3); list-style:none; cursor:pointer; min-height:28px; border-radius:var(--r-sm, 6px); }
  .obill > summary::-webkit-details-marker{ display:none; }
  .obill > summary:focus-visible{ outline:none; box-shadow:var(--ring); }
  .obill-t{ font-weight:600; font-size:15px; margin-right:auto; }
  .obill-chev{ width:18px; height:18px; color:var(--muted); flex:0 0 auto; transition:transform var(--t); }
  .obill[open] .obill-chev{ transform:rotate(180deg); }
  .obill-in{ margin-top:var(--s5); padding-top:var(--s4); border-top:1px solid var(--line); animation:rise var(--t-slow) both; }
  .obill-acts{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s4); }
  .cfgp-row{ padding:var(--s4) 0; border-bottom:1px solid var(--line); min-width:0; }
  .cfgp h2 + .cfgp-row{ padding-top:var(--s2); }
  .cfgp-row:last-child{ border-bottom:0; padding-bottom:0; }
  .cfgp-n{ font-weight:600; font-size:14px; min-width:0; overflow-wrap:anywhere; }
  .cfgp-spec{ display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:6px; font-size:12.5px; color:var(--muted); line-height:1.45; }
  .cfgp-si{ display:inline-flex; align-items:center; gap:6px; min-width:0; }
  .cfgp-si svg{ width:15px; height:15px; flex:0 0 auto; color:var(--faint); }
  .cfgp-q{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s2) var(--s3); flex-wrap:wrap; margin-top:var(--s3); font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .cfgp-q b{ font-size:16px; font-weight:600; color:var(--accent-fg, var(--accent)); }
  .cfgp-q.done b{ color:var(--ok-fg); }
  .cfgp-qs{ font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--warn-ink, var(--warn)); }
  .cfgp-q.done .cfgp-qs{ color:var(--ok-fg); }
  .oprog-bar.cfgp-bar{ height:9px; margin-top:6px; border:0; background:color-mix(in srgb, var(--ink) 13%, transparent); box-shadow:inset 0 1px 2px color-mix(in srgb, #000 22%, transparent); }
  @media (max-width:640px){ .cfgp-spec{ display:grid; grid-template-columns:minmax(0,1fr); gap:4px; } }
  .shl-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:baseline; gap:4px var(--s4); padding:var(--s3) 0; border-bottom:1px solid var(--line); }
  .shl-row:last-child{ border-bottom:0; padding-bottom:0; }
  .shl-n{ font-weight:600; font-size:14px; min-width:0; overflow-wrap:anywhere; }
  .shl-n small{ font-size:12px; font-weight:500; color:var(--muted); margin-left:6px; }
  .shl-v{ font-family:var(--font-num); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ok-fg); white-space:nowrap; }
  .shl-v small{ font-family:var(--font-ui); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-left:4px; }
  .shl-b{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12.5px; color:var(--muted); }
  .shl-b b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- pipeline summary ---------- */
  .pipev{ font-size:28px; font-weight:600; line-height:1.25; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; }
  .pipes{ font-size:13px; color:var(--muted); }
  .pipebar{
    display:flex; height:12px; margin-top:var(--s4); overflow:hidden;
    background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill);
  }
  .pipebar i{ display:block; height:100%; transition:width var(--t-slow); }
  .pipeleg{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:var(--s2) var(--s6); margin-top:var(--s4); }
  .pipeit{ display:flex; align-items:center; gap:var(--s2); font-size:13px; min-width:0; }
  .pipedot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .pipel{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pipen{ margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }
  @media (max-width:640px){ .pipeleg{ grid-template-columns:minmax(0,1fr); gap:var(--s2); } .pipev{ font-size:24px; } }

  /* ---------- demo mode ---------- */
  #demoBar{
    position:fixed; left:0; right:0; bottom:0; z-index:9999;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px max(12px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
    background:var(--warn); color:#fff; font-size:12.5px; line-height:1.3;
    box-shadow:0 -2px 12px rgba(0,0,0,.18);
  }
  #demoBar b{ font-weight:600; }
  #demoBar .demo-dot{
    width:8px; height:8px; border-radius:50%; background:#fff; flex:0 0 auto;
    animation:demoPulse 1.8s ease-in-out infinite;
  }
  @keyframes demoPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  #demoBar .demo-sep{ opacity:.6; }
  #demoBar .demo-txt{ min-width:0; }
  #demoBar button{
    margin-left:auto; appearance:none; cursor:pointer; font:inherit; font-size:12px;
    padding:5px 12px; min-height:30px; border-radius:9999px;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.5); color:#fff;
  }
  #demoBar button:hover{ background:rgba(255,255,255,.3); }
  :root[data-demo]{ --demo-bar:44px; }

  @media print{ #demoBar{ display:none !important; } }

  /* ---------- notes on an order ----------
     Both sides write here. A note from NovaTech is the answer to "where is
     my order", so it sits under the shipments, not behind a tab. */
  .nthread{ display:flex; flex-direction:column; gap:var(--s3); }
  .nmsg{ border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s3) var(--s4); background:var(--paper); }
  .nmsg.them{ background:var(--soft); }
  .nmsg.pinned{ border-color:var(--accent-line); background:var(--accent-soft); }
  .nmsg-h{
    display:flex; justify-content:space-between; align-items:center; gap:var(--s3);
    flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:var(--s1);
  }
  .nmsg-h b{ color:var(--ink); font-weight:600; }
  .nmsg-h{ flex-wrap:nowrap; }
  .nmsg-h span{ display:inline-flex; align-items:center; gap:6px; min-width:0; }
  .nmsg-h span:first-child{ flex:1 1 auto; }
  .nmsg-h span:first-child b{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nmsg-h span:last-child{ flex:0 0 auto; white-space:nowrap; }
  .nmsg p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13.5px; }
  .nmsg-x{
    appearance:none; border:none; background:none; padding:0 2px; cursor:pointer;
    color:var(--faint); font-size:12px; line-height:1; font-family:inherit;
  }
  .nmsg-x:hover{ color:var(--bad-fg); }
  .ncompose{ margin-top:var(--s4); display:grid; gap:var(--s2); }
  .ncompose textarea{
    width:100%; min-height:76px; resize:vertical; font:inherit; font-size:13.5px;
    padding:var(--s3); border:1px solid var(--field-line); border-radius:var(--r-sm);
    background:var(--field); color:var(--ink);
  }
  .ncompose textarea:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .ncompose-bar{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .ncompose-bar .sp{ flex:1; }
  .nempty{ margin:0; color:var(--muted); font-size:13px; }

  /* ---------- billing ----------
     The page answers one question first — what do I owe — then shows the
     shape of the account: how it ages, what has moved month to month, and
     the invoices themselves. */

  /* same card language as the admin billing view */
  .card-title{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--faint); margin:0 0 var(--s2); }
  .card-sub{ font-size:12px; font-weight:400; color:var(--muted); letter-spacing:0; text-transform:none; margin-left:var(--s2); }
  .chart-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; }
  .chart-kpi{ display:flex; flex-direction:column; gap:var(--s1); min-width:0; }
  .chart-kpi .card-title{ margin:0 0 var(--s2); }
  .chart-sub{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .chart-tabs{ display:inline-flex; flex-wrap:wrap; gap:var(--s1); flex:0 0 auto; }
  .chart-tab{
    font:inherit; font-size:12px; font-weight:500; padding:4px 12px; min-height:28px; white-space:nowrap;
    border-radius:var(--r-pill); border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;
    transition:color var(--t), border-color var(--t), background var(--t);
  }
  .chart-tab:hover{ color:var(--ink); border-color:var(--line-strong); }
  #bStmt, #bCsv{ white-space:nowrap; }
  .chart-tab.on{ background:var(--ink-deep); color:var(--on-ink); border-color:var(--ink-deep); }
  .bill-kpis{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s4); margin-top:var(--s4); }
  .bill-k{ min-width:0; }
  .bill-kv{ font-family:var(--font-num); font-size:26px; font-weight:600; letter-spacing:-0.4px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .bill-kl{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-top:var(--s1); }
  .bill-ks{ font-size:12px; color:var(--muted); margin-top:2px; }
  .bill-k.paid .bill-kv{ color:var(--ok-fg); }
  .bill-k.due .bill-kv{ color:var(--warn-ink, var(--warn)); }
  .bill-rail{ display:flex; height:8px; margin-top:var(--s4); overflow:hidden; background:var(--soft); border:1px solid var(--line); border-radius:var(--r-pill); }
  .bill-rail i{ display:block; height:100%; background:var(--ok); transition:width var(--t-slow); }
  .bill-cap{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px var(--s3); margin-top:var(--s2); font-size:12px; color:var(--muted); }
  .bill-cap b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .bill-det{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s3) var(--s4); margin-top:var(--s5); padding-top:var(--s4); border-top:1px solid var(--line); }
  .bill-det-v{ font-family:var(--font-num); font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .bill-det-v.hot{ color:var(--bad-fg); }
  .bill-det-l{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-top:2px; }
  .bill-det-s{ font-size:12px; color:var(--muted); margin-top:2px; }
  @media (max-width:700px){
    .bill-kpis, .bill-det{ grid-template-columns:1fr 1fr; }
    .bill-kv{ font-size:22px; }
    .card-sub{ display:block; margin-left:0; margin-top:4px; line-height:1.45; }
  }
  @media (max-width:420px){ .bill-kpis, .bill-det{ grid-template-columns:1fr; } }

  /* aging: one bar, because five boxes of money say less than their shares */
  .bagebar{ display:flex; height:8px; border-radius:var(--r-pill); overflow:hidden; background:var(--soft); border:1px solid var(--line); margin-top:var(--s4); }
  .bagebar i{ display:block; min-width:2px; transition:flex-basis var(--t-slow); }
  .bagebar i.g0{ background:color-mix(in srgb, var(--warn) 32%, var(--paper)); }
  .bagebar i.g1{ background:color-mix(in srgb, var(--warn) 60%, var(--paper)); }
  .bagebar i.g2{ background:var(--warn); }
  .bagebar i.g3{ background:color-mix(in srgb, var(--bad) 70%, var(--warn)); }
  .bagebar i.g4{ background:var(--bad); }
  .bagekey{ display:flex; flex-wrap:wrap; gap:var(--s3) var(--s5); margin-top:var(--s4); }
  .bagekey > div{ min-width:0; }
  .bagekey-k{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .bagekey-k i{ width:8px; height:8px; border-radius:2px; flex:0 0 auto; }
  .bagekey-v{ margin-top:1px; font-weight:600; font-variant-numeric:tabular-nums; font-size:14px; }
  .bagekey .zero{ color:var(--stone); font-weight:400; }

  /* the chart: gridlines, a real axis, and a value on hover */
  .bch{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:0 var(--s3); margin-top:var(--s4b); }
  .bch-y{
    display:flex; flex-direction:column; justify-content:space-between;
    height:168px; font-size:10.5px; color:var(--faint); text-align:right;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .bch-y span{ transform:translateY(-50%); }
  .bch-y span:last-child{ transform:translateY(50%); }
  .bch-col2{ min-width:0; }
  .bch-plot{ position:relative; height:168px; }
  .bch-grid{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; }
  .bch-grid i{ display:block; height:1px; background:var(--line); }
  .bch-grid i:last-child{ background:var(--line-strong); }
  .bch-cols{ position:absolute; inset:0; display:flex; align-items:flex-end; gap:2px; }
  .bch-col{
    flex:1 1 0; min-width:0; height:100%; position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding:0 2px;
    border-radius:var(--r-xs) var(--r-xs) 0 0;
  }
  .bch-col:hover{ background:var(--soft); }
  .bch-bar{
    width:100%; max-width:44px; border-radius:var(--r-xs) var(--r-xs) 0 0;
    background:var(--ok);
    transition:height var(--t-slow);
  }
  .bch-col.none .bch-bar{ background:var(--line); }
  .bch-col.units .bch-bar{
    background:color-mix(in srgb, var(--ink) 72%, var(--paper));
  }
  .bch-tip{
    position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
    padding:3px 8px; border-radius:var(--r-tag); background:var(--ink); color:var(--paper);
    font-size:11px; white-space:nowrap; opacity:0; pointer-events:none;
    transition:opacity var(--t); font-variant-numeric:tabular-nums; z-index:2;
  }
  .bch-col:hover .bch-tip{ opacity:1; }
  .bch-x{ display:flex; gap:2px; margin-top:var(--s2); }
  .bch-x span{
    flex:1 1 0; min-width:0; text-align:center; font-size:10.5px; color:var(--faint);
    white-space:nowrap; overflow:hidden;
  }
  .bch-tot{ display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5); margin-top:var(--s4); font-size:12.5px; color:var(--muted); }
  .bch-tot b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .bchart-bar{ width:100%; max-width:34px; background:var(--accent); border-radius:var(--r-sm) var(--r-sm) 0 0; min-height:2px; }
  .btabs{ display:flex; gap:var(--s2); }
  .binv{ border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:var(--s2); overflow:hidden; background:var(--paper); container-type:inline-size; }
  /* one fixed track per figure, so every row lines up and the bar gets real width */
  .binv-h{
    display:grid; grid-template-columns:minmax(150px,1.1fr) minmax(120px,1fr) 128px 128px 104px;
    gap:var(--s3) var(--s5); align-items:center; padding:var(--s4) var(--s4b, var(--s5)); cursor:pointer;
    transition:background var(--t);
  }
  .binv-h > :last-child{ justify-self:end; }
  @container (max-width:720px){
    .binv-h{ grid-template-columns:minmax(130px,1fr) minmax(64px,120px) 104px 88px; gap:var(--s3) var(--s4); }
    .binv-n.hide-sm{ display:none; }
  }
  @container (max-width:460px){
    .binv-h{ grid-template-columns:minmax(0,1fr) auto; padding:var(--s3) var(--s4); }
    .binv-h > .binv-n{ display:none; }
    .binv-m-wrap{ grid-column:1 / -1; grid-row:2; }
  }
  /* payment state: green settled, yellow part paid, amber nothing in yet, red late */
  .bst{
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    font-size:12px; font-weight:600; color:var(--ink);
  }
  .bst::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--bst, var(--stone)); flex:0 0 auto; }
  .bst.paid{ --bst:var(--ok); }
  .bst.part{ --bst:#e6b800; }
  .bst.open{ --bst:var(--warn); }
  .bst.late{ --bst:var(--bad); }
  .binv.open{ border-color:var(--line-strong); box-shadow:var(--e1); }
  /* how much of this invoice is settled, at a glance */
  .binv-m{ height:6px; border-radius:var(--r-pill); background:var(--line); box-shadow:inset 0 0 0 1px var(--line-strong); overflow:hidden; }
  .binv-m i{ display:block; height:100%; border-radius:var(--r-pill); background:var(--ok); }
  .binv-m.full i{ background:var(--ok); }
  .binv-m.part i{ background:#e6b800; }
  .binv-m.late i{ background:var(--bad); }
  .binv-mp{ margin-top:3px; font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .binv-h:hover{ background:var(--soft); }
  .binv-h:focus-visible{ outline:none; box-shadow:var(--ring); }
  .binv-no{ font-weight:600; }
  .binv-sub{ font-size:12px; color:var(--muted); }
  .binv-n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .binv-n b{ display:block; }
  .binv-n span{ font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  .binv-b{ padding:0 var(--s4) var(--s4); border-top:1px solid var(--line); }
  .binv-b.fresh{ animation:rise var(--t-slow) both; }
  .binv-sec{ margin:var(--s4) 0 var(--s2); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .bpay{ display:grid; grid-template-columns:auto auto minmax(0,1fr); gap:var(--s3); padding:var(--s2) 0; border-bottom:1px solid var(--line); font-size:13px; }
  .bpay:last-child{ border-bottom:none; }
  .bpay-a{ font-weight:600; font-variant-numeric:tabular-nums; }
  .bpay-d{ color:var(--muted); }
  .bdoc{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:var(--s3); align-items:center; padding:var(--s2) 0; border-bottom:1px solid var(--line); font-size:13px; }
  .bdoc:last-child{ border-bottom:none; }
  .bdoc-n{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .bdoc-m{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .bacts{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s4); }
  @media (max-width:560px){
    .bagekey{ gap:var(--s3) var(--s4); }
    .bch-y{ display:none; }
    .bch{ grid-template-columns:minmax(0,1fr); }
  }

  /* ---------- RMAs ---------- */
  .rhead{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s4); }
  .rhead h1{ margin:0; }
  .rhsub{ display:flex; flex-wrap:wrap; align-items:center; gap:4px var(--s4); line-height:1.6; margin:var(--s3) 0 var(--s4); }
  .rhsub > span{ display:inline-flex; align-items:center; gap:var(--s3); min-width:0; }
  .rhsub > span + span::before{ content:"\00b7"; color:var(--faint); }
  /* the number leads; status chips sit at the far right of the row */
  .inv-h1 > .chip{ margin-left:auto; }
  .inv-h1 > .chip + .chip{ margin-left:0; }

  /* ---------- PO number: the one field the customer owns ---------- */
  .pometa{ display:flex; align-items:center; flex-wrap:wrap; gap:var(--s2) var(--s3); margin:calc(-1 * var(--s2)) 0 var(--s5); font-size:13px; color:var(--muted); }
  .pometa .po-k{ font-weight:600; }
  .pometa .po-v{ color:var(--ink); font-weight:600; }
  .pometa .po-none{ color:var(--faint); }
  .pometa .po-due::before{ content:"\00b7"; color:var(--faint); margin-right:var(--s3); }
  .poform{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .poform input{
    height:32px; padding:0 var(--s3); font:inherit; font-size:13px; width:200px; max-width:100%;
    border:1px solid var(--field-line); border-radius:var(--r-sm);
    background:var(--field); color:var(--ink);
  }
  .poform input:focus{ outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  @media (max-width:640px){
    .poform input{ height:40px; font-size:16px; width:100%; }
    .poform{ width:100%; }
    .poform .btn{ flex:1; }
  }
  .rhead .btn, .rlook + * .btn, #rnLook, #rmaRetGo{ white-space:nowrap; }
  .rrow{
    display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto 110px; gap:var(--s4); align-items:center;
    padding:var(--s4) var(--s4b); border:1px solid var(--line); border-radius:var(--r-md); background:var(--paper);
    margin-bottom:var(--s2); cursor:pointer; transition:border-color var(--t); animation:rise var(--t-slow) both;
  }
  .rrow:hover{ border-color:var(--line-strong); }
  .rrow .rno{ font-weight:600; font-variant-numeric:tabular-nums; }
  .rrow .rsub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .rrow .rissue{ font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rrow .rdate{ font-size:12px; color:var(--faint); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rtiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--s3); margin-bottom:var(--s4); }
  /* the tiles carry their state's hue, the way the dashboard stats do */
  .rtile{
    background:color-mix(in srgb, var(--rtile-hue, var(--line)) 8%, var(--paper));
    border:1px solid color-mix(in srgb, var(--rtile-hue, var(--line)) 32%, var(--paper));
    border-radius:var(--r-md); padding:var(--s4);
  }
  :root[data-theme="dark"] .rtile{ background:color-mix(in srgb, var(--rtile-hue, var(--line)) 16%, var(--paper)); }
  @supports not (color: color-mix(in srgb, red, blue)){
    .rtile{ background:var(--soft); border-color:var(--line); }
  }
  .rtile b{ display:block; font-size:24px; font-weight:600; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; line-height:1.2; }
  .rtile span{ font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--faint); }
  .rtile b{ color:var(--rtile-ink, var(--ink)); }
  .rtile.hot b{ color:var(--bad-ink); }
  /* ---- the two RMA charts, matching the ones Novatech sees ---- */
  .rcharts{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:var(--s4); margin-bottom:var(--s4); }
  @media (max-width:900px){ .rcharts{ grid-template-columns:minmax(0,1fr); } }
  .rchart{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s4); min-width:0; }
  .rchart h2{ font-size:13px; font-weight:600; margin:0; }
  .rchart-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s3); flex-wrap:wrap; }
  .rchart-head h2{ flex:1 1 150px; min-width:0; }
  .rchart-val{ font-size:28px; font-weight:600; line-height:1.25; letter-spacing:-0.5px; font-variant-numeric:tabular-nums; margin-top:var(--s2); }
  .rchart-sub{ font-size:12.5px; color:var(--muted); line-height:1.5; }
  .rchart-plot{ position:relative; margin-top:var(--s4); }
  .rchart-plot svg{ display:block; width:100%; }
  .rchart-axis{ display:flex; justify-content:space-between; font-size:11px; color:var(--faint); margin-top:var(--s2); font-variant-numeric:tabular-nums; }
  .rchart-tip{
    position:absolute; transform:translate(-50%,-100%); pointer-events:none; opacity:0; transition:opacity var(--t);
    background:var(--ink-deep); color:var(--on-ink); font-size:11.5px; line-height:1.4; white-space:nowrap;
    padding:5px 9px; border-radius:var(--r-sm);
  }
  .rchart-tabs{ display:inline-flex; gap:4px; flex:0 0 auto; }
  .rchart-tabs button{
    font:inherit; font-size:12px; font-weight:500; padding:3px 11px; min-height:26px; cursor:pointer;
    border-radius:var(--r-pill); border:1px solid var(--line); background:transparent; color:var(--muted);
  }
  .rchart-tabs button.on{ background:var(--ink-deep); color:var(--on-ink); border-color:var(--ink-deep); }
  .rfail{ display:grid; gap:var(--s2); margin-top:var(--s4); }
  .rfail-row{ display:grid; grid-template-columns:130px minmax(0,1fr) 40px; gap:var(--s3); align-items:center; font-size:13px; }
  .rfail-row .nt-catline{ color:var(--muted); min-width:0; }
  .rfail{ container-type:inline-size; }
  @container (max-width:250px){
    .rfail-row{ grid-template-columns:minmax(0,1fr) 40px; row-gap:6px; }
    .rfail-row b{ grid-column:2; grid-row:1; }
    .rfail-bar{ grid-column:1 / -1; grid-row:2; }
  }
  .rfail-bar{ height:8px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; }
  .rfail-bar i{ display:block; height:100%; background:var(--accent); }
  .rfail-row b{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  @media (max-width:700px){
    /* title → chart → number, the way every other chart on a phone reads */
    .rchart{ display:flex; flex-direction:column; gap:var(--s1); padding:var(--s4) var(--s3); }
    .rchart h2{ order:1; }
    .rchart-head{ order:1; }
    .rchart-plot{ order:2; margin-top:var(--s2); }
    .rchart-val{ order:3; font-size:18px; line-height:1.2; margin-top:var(--s2); }
    .rchart-sub{ order:4; font-size:11.5px; }
    .rfail{ order:5; }
    .rchart-axis{ margin-top:4px; font-size:10px; }
    .rchart-tabs{ width:100%; } .rchart-tabs button{ flex:1 1 auto; }
    .rfail-row{ grid-template-columns:104px minmax(0,1fr) 40px; }
  }
  .rchips{ display:flex; flex-wrap:wrap; gap:var(--s2); margin-bottom:var(--s4); }
  .rchips button{ font:inherit; font-size:12.5px; font-weight:500; padding:6px 14px; min-height:32px; border-radius:var(--r-pill) !important; border:1px solid var(--line); background:var(--paper); color:var(--muted); cursor:pointer; }
  .rchips button:hover{ border-color:var(--line-strong); color:var(--ink); }
  .rchips button.on{ background:var(--accent-soft); color:var(--accent-fg); border-color:var(--accent-line); }
  .olist-card .orow{ animation:none; }
  .olist-card .orow:last-of-type{ margin-bottom:0; }
  .rlist-card .rrow{ animation:none; }
  .rlist-card .rrow:last-of-type{ margin-bottom:0; }
  .rlist-card .rchips{ margin-bottom:var(--s3); }
  .rpager{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin-top:var(--s3); font-size:12.5px; color:var(--muted); }
  .nt-ico{ width:15px; height:15px; flex:0 0 auto; color:var(--faint); }
  .nt-catline{ display:inline-flex; align-items:center; gap:6px; min-width:0; }
  .nt-catline em{ font-style:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rlink{ color:var(--link); cursor:pointer; text-decoration:none; }
  .rlink:hover{ text-decoration:underline; }
  .rparts{ margin:0 0 var(--s3); padding:0; list-style:none; font-size:13.5px; }
  .rparts li{ display:flex; justify-content:space-between; gap:var(--s3); padding:6px 0; border-bottom:1px solid var(--line); }
  .rparts li:last-child{ border-bottom:0; }
  .rtl li.k::before{ background:var(--ok); }
  .rtl li.i::before{ background:var(--accent); }
  .rtl li.w::before{ background:var(--warn); }
  .rtl li.b::before{ background:var(--bad); }
  .raddr{ white-space:pre-wrap; font-size:13px; color:var(--muted); margin-top:6px; }
  .rmsg-addr{ font-size:13px; color:var(--muted); }
  .rmsg-acts{ display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:8px; }
  /* the return address, with the one-click copy the label maker needs */
  .rretaddr{ display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4);
    margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--warn-line); }
  .rretaddr-k{ font-size:11px; letter-spacing:1px; text-transform:uppercase; font-weight:600; }
  .rretaddr .raddr{ color:inherit; }
  .rretaddr button{ flex:0 0 auto; }
  .rnext{ font-size:13.5px; margin:0 0 var(--s4); padding:var(--s3) var(--s4); background:var(--soft); border-radius:var(--r-sm); border:1px solid var(--line); }
  .rnext.w{ background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-ink); }
  .rnext.b{ background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad-ink); }
  .rnext.k{ background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-ink); }
  /* the status notice needs air between it and the header block above */
  #detailView > .rnext{ margin-top:var(--s4); }
  .rgrid{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:var(--s4); align-items:start; }
  .rdl{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--s3) var(--s4); font-size:13.5px; line-height:1.55; margin:0; }
  .rdl dt{ color:var(--muted); } .rdl dd{ margin:0; min-width:0; overflow-wrap:anywhere; }
  .rthread{ display:flex; flex-direction:column; gap:var(--s3); }
  .rmsg{ border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s3) var(--s4); background:var(--paper); }
  .rmsg.me{ background:var(--soft); }
  .rmsg-h{ display:flex; justify-content:space-between; gap:var(--s3); font-size:12px; color:var(--muted); margin-bottom:var(--s1); flex-wrap:wrap; }
  .rmsg-h b{ color:var(--ink); font-weight:600; }
  .rmsg p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13.5px; }
  .ratt{ display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s2); }
  .ratt a{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border:1px solid var(--line); border-radius:var(--r-pill); background:var(--paper); color:var(--ink); text-decoration:none; cursor:pointer; max-width:100%; }
  .ratt a span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }
  .ratt img{ width:64px; height:64px; object-fit:cover; border-radius:var(--r-sm); border:1px solid var(--line); cursor:pointer; background:var(--soft); }
  .rcompose{ margin-top:var(--s4); display:grid; gap:var(--s2); }
  .rcompose textarea, .rfield textarea{ width:100%; min-height:80px; padding:var(--s3) var(--s4); font:inherit; font-size:14px; border:1px solid var(--field-line); background:var(--field); color:var(--ink); resize:vertical; }
  .rbar{ display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .rbar .spacer{ flex:1; }
  .rbar .filebtn{ cursor:pointer; }
  .rtl{ list-style:none; margin:0; padding:0; }
  .rtl li{ position:relative; padding:0 0 var(--s3) var(--s4b); font-size:13px; }
  .rtl li::before{ content:""; position:absolute; left:4px; top:6px; width:8px; height:8px; border-radius:50%; background:var(--line-strong); }
  .rtl li::after{ content:""; position:absolute; left:7px; top:16px; bottom:-2px; width:2px; background:var(--line); }
  .rtl li:last-child::after{ display:none; }
  .rtl small{ display:block; color:var(--faint); font-size:11.5px; }
  .rlook{ margin-top:var(--s2); padding:var(--s3) var(--s4); border:1px solid var(--line); border-radius:var(--r-sm); background:var(--soft); font-size:13px; }
  .rlook .chip{ vertical-align:middle; }
  /* the way out when a serial predates the portal */
  .rlegacy{ display:flex; align-items:flex-start; gap:10px; margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--line); cursor:pointer; }
  .rlegacy input{ width:16px; height:16px; margin-top:2px; flex:0 0 auto; cursor:pointer; }
  .rlegacy span{ color:var(--muted); line-height:1.5; }
  .rlegacy span b{ display:block; color:var(--ink); font-weight:600; }
  .rlegacy-note{ font-size:13px; line-height:1.5; color:var(--warn-ink); background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:var(--r-sm); padding:var(--s3) var(--s4); margin-bottom:var(--s4); }
  .field select{ width:100%; height:44px; padding:0 var(--s4); font:inherit; font-size:14px; border:1px solid var(--field-line); background:var(--field); color:var(--ink); }
  .modal.wide{ max-width:560px; }
  .modal-b.scroll{ max-height:70vh; overflow:auto; }
  @media (max-width:820px){
    .rgrid{ grid-template-columns:minmax(0,1fr); }
    .rhead .btn{ width:100%; }
    .inv-h1{ font-size:20px; gap:var(--s2); }
    .rhsub{ flex-direction:column; align-items:flex-start; gap:6px; }
    .rhsub > span + span::before{ content:none; }
    /* one action row, every button the same width whatever the label */
    .back{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); }
    .back .btn{ width:100%; min-height:40px; }
    .rrow{ grid-template-columns:minmax(0,1fr) auto; gap:var(--s2) var(--s3); padding:var(--s3) var(--s4); }
    .rrow .rissue{ grid-column:1 / -1; white-space:normal; }
    /* status reads as a corner badge, sized to its label */
    .rrow > .chip{ grid-column:2; grid-row:1; justify-self:end; align-self:start; width:auto; white-space:nowrap; }
    .rrow .rdate{ grid-column:1 / -1; text-align:left; }
    .rtiles{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .rtile b{ font-size:20px; }
    /* list card: shorter search, one scrolling filter row, then breathing room
       before the RMA cards themselves */
    .rlist-card .toolbar{ margin-bottom:var(--s3); }
    .rlist-card .searchbox{ height:38px; min-height:38px; }
    .rlist-card .rchips{
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; scroll-snap-type:x proximity;
      padding-right:12px; margin-bottom:var(--s5);
    }
    .rlist-card .rchips::-webkit-scrollbar{ display:none; }
    .rlist-card .rchips button{ flex:0 0 auto; white-space:nowrap; scroll-snap-align:start; }
  }
  @media (max-width:640px){
    .rcompose textarea, .rfield textarea{ font-size:16px; }
    .rbar .btn{ flex:1 1 auto; }
  }

  .batch{ border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:var(--s3); overflow:hidden; background:var(--paper); }
  /* batch number and its status share one line, status at the right edge */
  .bno{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); min-width:0; }
  .bno .chip{ flex:0 0 auto; }
  .bhead{
    cursor:pointer;
    transition:background var(--t);
    display:grid; grid-template-columns:auto minmax(0,1fr) auto auto;
    gap:var(--s3) var(--s4); align-items:center; padding:var(--s4);
  }
  /* the action sits at the right edge of the header at every width */
  .bhead > div:last-child{ justify-self:end; }
  .bacts{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .bhead .bacts{ margin-top:0; align-items:center; }
  /* between phone and desktop there is not room for four columns: the batch
     and its status take the first line, the rest pairs up below */
  @media (min-width:821px) and (max-width:980px){
    .bhead{ grid-template-columns:minmax(0,1fr) auto; }
    .bhead > .bno{ grid-column:1 / -1; }
    .bhead > div:last-child{ grid-column:1 / -1; justify-self:end; }
  }
  .bhead b{ font-size:13.5px; }
  /* desktop: fixed tracks so every card in the stack lines up, buttons on one line.
     Keyed to the card's own width, so a narrow window falls back to the flowing layout. */
  .batch{ container:pbatch / inline-size; }
  @container pbatch (min-width:900px){
    .bhead{ grid-template-columns:160px minmax(0,1fr) 280px 210px; min-height:84px; }
    .bhead > .bno{ justify-content:flex-start; }
    .bhead > .mono{ text-align:left; white-space:nowrap; overflow:hidden; }
    .bhead > .mono .bship{ flex-wrap:nowrap; }
    .bhead .bacts{ flex-wrap:nowrap; white-space:nowrap; }
  }
  @container pbatch (min-width:1100px){
    .bhead{ grid-template-columns:190px minmax(0,1fr) 320px 210px; }
  }
  /* sits over the serial column, so it reads as "copy this list" */
  .bbar{ display:flex; margin-bottom:var(--s3); }
  .bhead:hover{ background:var(--soft); }
  /* drawn just inside the header: the batch card clips anything outside it */
  .bhead:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }
  .bhead button, .bhead a, .bhead .cfg{ cursor:default; }
  .bhead button, .bhead a{ cursor:pointer; }
  .bship{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .bship a{ font-family:var(--font-num); font-size:12px; font-weight:600; }
  .trk-dd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bdot{ color:var(--faint); }
  /* UPS: the carrier's latest word on a shipment, at the top of its details */
  /* UPS: a tracking card in the carrier's shape, our colours */
  .ups-line{ container:upsc / inline-size; --uc:var(--accent); display:flex; flex-direction:column; gap:14px; margin:0 0 var(--s3); padding:16px 18px 14px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md, 8px); }
  .ups-line.done{ --uc:var(--ok); }
  .ups-line.bad{ --uc:var(--bad); border-color:var(--bad-line); }
  .ups-line-k{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .ups-line-big{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; margin-top:4px; font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.25; color:var(--ink); overflow-wrap:anywhere; }
  .ups-line-big.txt{ font-size:17px; }
  .ups-line.bad .ups-line-big{ color:var(--bad-ink); }
  .ups-line-win{ font-size:15px; font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ups-line-loc{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; font-size:12.5px; color:var(--ink); }
  .ups-line-steps{ list-style:none; margin:2px 0 0; padding:0; display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); position:relative; }
  .ups-line-steps::before, .ups-line-steps::after{ content:""; position:absolute; top:6px; left:10%; height:3px; border-radius:2px; }
  .ups-line-steps::before{ right:10%; background:var(--line-strong); }
  .ups-line-steps::after{ width:calc(80% * var(--p, 0)); background:var(--uc); }
  .ups-line-steps li{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; text-align:center; }
  .ups-line-steps i{ box-sizing:border-box; width:12px; height:12px; margin-top:1px; border-radius:50%; background:var(--paper); border:2px solid var(--line-strong); }
  .ups-line-steps li.did i{ background:var(--uc); border-color:var(--uc); }
  .ups-line-steps li.now i{ width:16px; height:16px; margin-top:-1px; border:3px solid var(--uc); box-shadow:0 0 0 4px color-mix(in srgb, var(--uc) 18%, transparent); }
  .ups-line.done .ups-line-steps li.now i{ background:var(--uc); }
  .ups-line-steps span{ font-size:11.5px; line-height:1.3; color:var(--muted); overflow-wrap:normal; word-break:normal; hyphens:none; }
  .ups-line-loc > .ups-line-k{ flex:0 0 auto; white-space:nowrap; }
  .ups-line-steps li.now span{ color:var(--ink); font-weight:600; }
  .ups-line.bad .ups-line-steps li.now span{ color:var(--bad-ink); }
  .ups-line-foot{ display:flex; flex-wrap:wrap; gap:2px 14px; padding-top:10px; border-top:1px solid var(--line); font-size:11.5px; color:var(--faint); }
  .ups-line-foot b{ color:var(--muted); font-weight:600; }
  .ups-line-hist{ border-top:1px solid var(--line); padding-top:10px; }

  .ups-mini{ display:inline-flex; align-items:center; gap:4px; margin-left:8px; font-family:var(--font-ui); font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; vertical-align:1px; }

  /* Track button wears the carrier's colours, kept to a soft tint */
  .bacts a.trk-btn{ --tb:#787671; --tf:var(--ink); --tp:12%; --tbd:#9aa5b4; --tfd:var(--ink);

    color:var(--tf) !important; box-shadow:none !important; font-weight:600; }

  .bacts a.trk-btn.c-ups{   --tb:#351C15; --tf:#351C15; --tbd:#A0705A; --tfd:#F2D9C9; }

  /* the open batch stands out from the stack */
  .batch:has(> .bbody.open){ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent), 0 8px 20px -10px color-mix(in srgb, var(--ink) 35%, transparent); }

  /* tidy: even inner padding, each part in its own band divided by hairlines */
  .ups-line{ --px:22px; gap:0; padding:0; overflow:hidden; box-shadow:var(--e1, 0 1px 2px rgba(0,0,0,.04)); }

  .ups-line > .ups-line-hist{ padding:0; border-top:1px solid var(--line); }

  .ups-line-hist ol{ margin:0; padding:4px var(--px) 8px; }
  .ups-line > .ups-line-foot{ padding:12px var(--px); }
  @container upsc (max-width:520px){
    .ups-line > *{ --px:16px; }

  .ups-d{ font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* the logo identifies the number, so the two never wrap apart */
  .trk-grp{ display:inline-flex; align-items:center; gap:8px; min-width:0; flex:0 0 auto; }

  /* The batch body grows out of a 0fr grid track instead of appearing at full
     height. min-height:0 on the inner child is what lets the track shrink. */
  .bbody{
    display:grid; grid-template-rows:0fr; overflow:hidden; opacity:0;

  }

  /* restoring a batch after a page redraw is not a user action; it must not play */

  /* The clip shell carries no padding or border of its own: either one would

  .bbody-in{ min-height:0; overflow:hidden; }

    .back .btn{ min-height:36px; }
    .btn{ min-height:36px; }
    .btn.sm{ min-height:36px; }
    .icon-btn{ width:32px; height:32px; min-height:32px; }

    /* top-biased, not dead-centre: the browser's own bottom bar makes a

    .login .card{ padding:var(--s5) var(--s4); }

    .pickbox{ height:44px; min-height:44px; font-size:16px; }
    .toolbar{ flex-direction:column; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }
    .toolbar .btn{ width:100%; }
    .toolbar .searchbox{ flex:1 1 auto; min-width:0; width:100%; }

  /* Screen only from here to the print block: a printed page is about 740px

  /* ============================================================

  /* ---------- home ---------- */

  @media (max-width:560px){

      '<p class="tk-foot">Updated ' + esc(upsWhen(D.generated_at || new Date().toISOString())) + ' \u00b7 refreshes every 5 minutes' +
        (D.expires_after ? ' \u00b7 this link works until ' + esc(upsDay(D.expires_after)) : '') + '</p>';
    open.forEach(function(id){ const bd = $('bb_' + id); if (bd){ bd.classList.add('open', 'instant'); requestAnimationFrame(function(){ bd.classList.remove('instant'); }); const x = document.querySelector('[data-x="' + id + '"]'); if (x) x.textContent = 'Hide'; } });
  }

  function batchHtml(v){
    const b = v.b, bu = v.bu, tk = v.tk, ups = v.ups, shipped = v.shipped, n = v.n;
    const l = locOf(b);
    const per = {}; tk.forEach(function(t){ if (t.unit_id) per[t.unit_id] = t.tracking_no; });
    const wideAll = tk.filter(function(t){ return !t.unit_id; }).map(function(t){ return t.tracking_no; });
    const wide = wideAll.filter(function(n){ return !isTrackLink(n); });
    const firstNo = wide[0] || (tk.find(function(t){ return t.unit_id && t.tracking_no; }) || {}).tracking_no || '';
    const trackLink = wideAll.find(isTrackLink) || (firstNo ? trackUrl(b.carrier, firstNo) : '');
    const bit = upsBit(ups) || (shipped && b.delivered_at ? 'Delivered ' + upsDay(b.delivered_at) : '');
    const upsBy = {}; tk.forEach(function(t){ upsBy[t.tracking_no] = t; });
    const addr = l ? [l.address1, l.address2, [l.city, l.state].filter(Boolean).join(', '), l.zip].filter(Boolean).join(' \u00b7 ') : '';
    return '<div class="batch">' +
      '<div class="bhead" data-head="' + esc(b.id) + '" role="button" tabindex="0" title="Click for serials and tracking">' +
        '<div class="bno"><b>Batch ' + n + '</b>' + upsChip(b, ups) + '</div>' +
        '<div><b>' + esc(l ? l.store_name : 'Store to be confirmed') + '</b>' +
          (l && l.store_number ? '<span class="storenum">' + esc(l.store_number) + '</span>' : '') +
          '<div class="sub">' + esc(addr) + '</div></div>' +
        '<div class="mono">' + num(bu.length) + ' units' +
          (b.ship_date ? '' : '<span class="muted" style="font-family:var(--font-ui);font-size:12px;"> \u00b7 not yet shipped</span>') +
          '<div class="sub bship">' +
          (wide.length
            ? '<span class="trk-grp">' + carrierBadge(b.carrier) + trackHtml(b.carrier, [wide[0]]) +
              (wide.length > 1 ? '<span class="muted">+' + num(wide.length - 1) + '</span>' : '') +
              '</span>' + (b.ship_date ? '<span class="bdot">&middot;</span>' : '')
            : carrierBadge(b.carrier)) +
          (b.ship_date ? '<span>' + esc(fmtDate(b.ship_date)) + '</span>' : '') +
          '</div>' +
          (bit ? '<div class="sub ups-d">' + esc(bit) + '</div>' : '') + '</div>' +
        '<div class="bacts">' +
          (trackLink ? '<a class="btn trk-btn c-' + carrierKey(b.carrier)[0] + '" style="padding:8px 12px;min-height:34px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;" href="' + esc(trackLink) + '" target="_blank" rel="noopener noreferrer" title="Track shipment">' + esc(carrierKey(b.carrier)[1]) + ' \u2197</a>' : '') +
          '<button class="btn" data-x="' + esc(b.id) + '" type="button">Details</button></div>' +
      '</div>' +
      '<div class="bbody" id="bb_' + esc(b.id) + '"><div class="bbody-in"><div class="bbody-pad">' +
        upsStrip(ups) +
        (bu.length ? '<div class="bbar"><button class="btn sm" data-copy="' + esc(b.id) + '" type="button" title="Copy every serial in this batch, comma separated">Copy Serial Numbers</button></div>' +
        '<div class="twrap"><table><thead><tr><th>Serial</th><th>Model</th><th>Tracking</th></tr></thead><tbody>' +
          bu.map(function(u){
            const c = cfgOf(u.config_id), sp = specLines(c).map(function(p){ return p[1]; }).join(' \u00b7 ');
            return '<tr><td class="mono">' + esc(u.serial) + '</td>' +
              '<td>' + esc(c ? c.name : '\u2014') + (sp ? '<div class="tk-spec">' + esc(sp) + '</div>' : '') + '</td>' +
              '<td class="mono">' + trackHtml(b.carrier, per[u.id] ? [per[u.id]] : wide) +
                (per[u.id] ? upsMini(upsBy[per[u.id]]) : (wide.length ? trkTag(true) : '')) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="muted" style="margin:0;">Units are being assigned to this shipment.</p>') +
      '</div></div></div>' +
    '</div>';
  }

  /* a strip row: open that batch and bring it into view */
  function focusShipment(id){
    const bd = $('bb_' + id); if (!bd) return;
    if (!bd.classList.contains('open')) toggle(id);
    const card = bd.closest('.batch');
    card.scrollIntoView({ block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    card.classList.add('shipx-flash');
    setTimeout(function(){ card.classList.remove('shipx-flash'); }, 2400);
  }
  function toggle(id){
    const bd = $('bb_' + id); if (!bd) return;
    const was = bd.classList.contains('open');
    bd.classList.toggle('open', !was);
    if (was) open.delete(id); else open.add(id);
    const x = document.querySelector('[data-x="' + id + '"]'); if (x) x.textContent = was ? 'Details' : 'Hide';
  }
  document.addEventListener('click', function(e){
    const x = e.target.closest('[data-x]'); if (x){ toggle(x.getAttribute('data-x')); return; }
    const c = e.target.closest('[data-copy]');
    if (c){
      const id = c.getAttribute('data-copy');
      const s = D.units.filter(function(u){ return u.batch_id === id; }).map(function(u){ return u.serial; }).join(', ');
      (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject())
        .then(function(){ toast('Serial numbers copied', 'ok'); }, function(){ toast('Could not copy. Select the serials and copy them by hand.', 'bad'); });
      return;
    }
    const sf = e.target.closest('[data-shipfocus]');
    if (sf){ focusShipment(sf.getAttribute('data-shipfocus')); return; }
    const h = e.target.closest('[data-head]');
    if (h && !e.target.closest('button, a')) toggle(h.getAttribute('data-head'));
  });
  document.addEventListener('keydown', function(e){
    const h = e.target.closest && e.target.closest('[data-head]');
    if (h && e.target === h && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggle(h.getAttribute('data-head')); }
  });

  async function load(quiet){
    if (DEMO){ D = demoData(); render(); return; }
    if (!TOKEN){ message('This link is incomplete', 'Ask whoever sent it for the full tracking link.'); return; }
    if (!window.supabase){ if (!quiet) message('Tracking is unavailable', 'Check your connection and reload the page.'); return; }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });
    const r = await sb.rpc('public_dealer_tracking', { p_token: TOKEN });
    if (r.error){ if (!quiet) message('Tracking is unavailable', 'Something went wrong loading this page. Try again in a few minutes.'); return; }
    const d = r.data || {};
    if (!d.ok){
      if (d.reason === 'expired') message('This tracking link has expired', 'Every shipment on it was delivered more than 30 days ago.');
      else if (d.reason === 'hold') message('Tracking isn\u2019t available right now', 'Check back soon, or ask whoever sent the link.');
      else message('This tracking link isn\u2019t valid', 'It may have been turned off. Ask whoever sent it for a new one.');
      D = null; return;
    }
    D = d; render();
  }

  function demoData(){
    const EXC = 'The receiver was not available for delivery. A second attempt will be made the next business day.';
    const day = function(n){ const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ymd = function(n){ return day(n).replace(/-/g, ''); };
    const ts = function(n, h){ const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h || 12, 0, 0, 0); return d.toISOString(); };
    const hist = function(st, d){
      const ev = [{ d:ymd(st === 'label' ? d : d - 4), t:'160400', y:'M', s:'Shipper created a label, UPS has not received the package yet.', w:'' }];
      if (st !== 'label') ev.push({ d:ymd(d - 4), t:'202100', y:'I', s:'Arrived at Facility', w:'Newark, DE' },
        { d:ymd(d - 3), t:'220500', y:'I', s:'Departed from Facility', w:'Newark, DE' },
        { d:ymd(d - 2), t:'071100', y:'I', s:'Arrived at Facility', w:'Hodgkins, IL' },
        { d:ymd(d - 1), t:'034700', y:'I', s:'Departed from Facility', w:'Hodgkins, IL' });
      if (st === 'out' || st === 'delivered') ev.push({ d:ymd(d), t:'081500', y:'O', s:'Out For Delivery Today', w:'Knoxville, TN' });
      if (st === 'delivered') ev.push({ d:ymd(d), t:'141400', y:'D', s:'Delivered', w:'Knoxville, TN' });
      if (st === 'exception') ev.push({ d:ymd(d), t:'081500', y:'O', s:'Out For Delivery Today', w:'Knoxville, TN' },
                                      { d:ymd(d), t:'151000', y:'X', s:EXC, w:'Knoxville, TN' });
      return ev.reverse();
    };
    const t = function(bid, no, st, d){
      return { batch_id:bid, unit_id:null, tracking_no:no, ups_status:st,
        ups_text:{ delivered:'Delivered', out:'Out For Delivery Today', transit:'On the Way', label:'Label Created', exception:EXC }[st],
        ups_where: st === 'label' ? null : 'Knoxville, TN', ups_event_at: ts(d, 14), ups_pickup_on: st === 'label' ? null : day(d - 4),
        ups_eta: st === 'out' || st === 'transit' ? day(st === 'out' ? 0 : 1) : null,
        ups_eta_from: st === 'out' ? '100000' : null, ups_eta_to: st === 'out' ? '120000' : null,
        ups_delivered_at: st === 'delivered' ? ts(d, 14) : null, ups_checked_at: new Date(Date.now() - 9 * 60000).toISOString(),
        ups_activity: hist(st, d) };
    };
    const units = []; let sn = 30101;
    const add = function(bid, n, cfg){ for (let i = 0; i < n; i++) units.push({ id:'u' + sn, serial:'NT-' + (sn++), batch_id:bid, config_id:cfg, unit_status:'shipped' }); };
    add('b5', 2, 'c2'); add('b4', 4, 'c1'); add('b3', 6, 'c2'); add('b2', 5, 'c1'); add('b1', 3, 'c2');
    return {
      ok:true, dealer:'Rent One', generated_at:new Date().toISOString(),
      locations:[{ id:'l1', store_name:'Rent One', store_number:'214', address1:'4410 Clinton Hwy', city:'Knoxville', state:'TN', zip:'37912' },
                 { id:'l2', store_name:'Rent One', store_number:'102', address1:'2200 Gunbarrel Rd', city:'Chattanooga', state:'TN', zip:'37421' }],
      configs:[{ id:'c1', name:'Revenant', pc_case:'Lian Li O11 Mini', cpu:'Ryzen 7 7800X3D', gpu:'RTX 4070 Super', ram:'DDR5 16GB', ram_sticks:2, storage:'2TB NVMe' },
               { id:'c2', name:'Reaper', pc_case:'NZXT H5 Flow', cpu:'Core i5-14600K', gpu:'RTX 4060 Ti', ram:'DDR5 16GB', ram_sticks:2, storage:'1TB NVMe' }],
      batches:[{ id:'b5', batch_no:5, status:'ready', ship_date:null, delivered_at:null, carrier:'UPS', location_id:'l2' },
               { id:'b4', batch_no:4, status:'open', ship_date:null, delivered_at:null, carrier:'UPS', location_id:'l1' },
               { id:'b3', batch_no:3, status:'shipped', ship_date:day(-2), delivered_at:null, carrier:'UPS', location_id:'l2' },
               { id:'b2', batch_no:2, status:'shipped', ship_date:day(-4), delivered_at:null, carrier:'UPS', location_id:'l1' },
               { id:'b1', batch_no:1, status:'shipped', ship_date:day(-12), delivered_at:ts(-8, 14), carrier:'UPS', location_id:'l2' }],
      tracking:[t('b5', '1Z12D5F00300000058', 'label', 0), t('b4', '1Z12D5F00300000041', 'label', -6), t('b3', '1Z12D5F00300000033', 'out', 0),
                t('b2', '1Z12D5F00300000025', 'exception', -1), t('b1', '1Z12D5F00300000017', 'delivered', -8)],
      units:units
    };
  }

  load(false);
  setInterval(function(){ if (D && !document.hidden) load(true); }, 5 * 60 * 1000);
})();
</script>
